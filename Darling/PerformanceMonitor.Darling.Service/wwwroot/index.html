<!doctype html>
<!--
  Darling Web (#1562) — the read-only browser dashboard served by the Darling service's web host on port 5153.
  Fully self-contained / air-gapped: no CDN, no fonts, no remote anything (a CI scan enforces it). All markup,
  style, and behavior ship from this wwwroot. The shell below is static; js/app.js routes the pages into #main.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Darling Web</title>
    <!-- #5701: the page had no icon link, so every browser asked for /favicon.ico on its first load and got a 404.
         A data: SVG (the CSP allows img-src data:) answers that request without a file or a round trip. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6feb'/%3E%3Cpath d='M2 11l3-4 3 2 3-5 3 3' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/time-range.css" />
  </head>
  <body>
    <div id="app">
      <!-- #6315: below 768 px the sidebar leaves the page flow; this bar (hidden at wider widths) holds the button that
           opens it as an overlay. js/narrow-nav.js owns the open state, aria-expanded and focus. -->
      <header id="topbar">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open the menu" title="Open the menu">&#9776;</button>
        <span class="topbar-title">Darling Web</span>
      </header>
      <div id="nav-backdrop" aria-hidden="true"></div>
      <aside id="sidebar">
        <div class="brand">
          <h1>Darling Web</h1>
          <div class="sub">SQL Server and PostgreSQL monitor</div>
          <!-- Shell-level master pause (#4222d, #4666): one button that stops every page's auto-refresh.
               js/app.js sets the label/aria-label/title and the pressed state; see initAutoRefreshToggle(). -->
          <button id="sidebar-collapse" class="sidebar-collapse" type="button" aria-expanded="true" title="Hide the sidebar"></button>
          <button id="auto-refresh-toggle" class="auto-refresh-toggle" type="button" aria-pressed="false"></button>
          <!-- Front door only (#6840): js/store-picker.js fills and shows this when /api/session says front_door. The top bar below is
               hidden at desktop widths, so the picker lives here, where the menu is on every width. -->
          <div id="store-picker" class="store-picker" hidden></div>
        </div>
        <nav class="nav">
          <a data-route="fleet" href="#/fleet">Fleet Overview</a>
          <!-- Revealed by js/app.js only once the store has Availability Group data (#991); the #/ag route works
               regardless, so a deep link is never broken by the entry being hidden. -->
          <a data-route="ag" href="#/ag" hidden>Availability Groups</a>
          <a data-route="finops" href="#/finops">FinOps</a>
          <a data-route="sweeps" href="#/sweeps">Fleet Sweeps</a>
          <a data-route="alerts" href="#/alerts">Alert History</a>
          <a data-route="investigations" href="#/investigations">Investigations</a>
          <a data-route="proposals" href="#/proposals">Proposals</a>
          <a data-route="alert-rules" href="#/alert-rules">Alert Rules</a>
          <a data-route="admin" href="#/admin">Admin</a>
          <a data-route="views" href="#/views">Custom Views</a>
          <a data-route="mute-rules" href="#/mute-rules">Mute Rules</a>
          <a data-route="known-patterns" href="#/known-patterns">Known Patterns</a>
          <a data-route="manage-tags" href="#/manage-tags">Manage Tags</a>
          <a data-route="manage-query-tags" href="#/manage-query-tags">Query Tags</a>
          <a data-route="query-tag-usage" href="#/query-tag-usage">Query Tag Usage</a>
          <a data-route="job-history" href="#/job-history">Job History</a>
        </nav>
        <div class="server-list-header">Servers</div>
        <div id="server-search" class="server-search"></div>
        <div id="server-list"></div>
        <div class="server-list-header">Views</div>
        <div id="view-list"></div>
        <div id="viewer-settings"></div>
      </aside>
      <main id="main"></main>
    </div>
    <footer id="statusbar"></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
