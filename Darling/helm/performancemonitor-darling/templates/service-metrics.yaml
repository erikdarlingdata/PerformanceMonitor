{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "performancemonitor-darling.surfaceName" (dict "ctx" . "surface" "metrics") }}
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "performancemonitor-darling.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "performancemonitor-darling.surfaceName" (dict "ctx" . "surface" "metrics") }}
  labels:
    {{- /* One map, so a label the chart also sets is written once, with the value from serviceMonitor.labels. */}}
    {{- merge (deepCopy .Values.metrics.serviceMonitor.labels) (include "performancemonitor-darling.labels" . | fromYaml) | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "performancemonitor-darling.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      {{- /* With a web certificate in darling.json the metrics port serves HTTPS only. */}}
      {{- if dig "web" "network" "tls" "" .Values.config }}
      scheme: https
      {{- with .Values.metrics.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "performancemonitor-darling.secretName" . }}
          key: {{ .Values.secrets.metricsTokenKey }}
{{- end }}
{{- end }}
