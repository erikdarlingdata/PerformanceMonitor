{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
{{- include "performancemonitor-darling.checkIngress" (dict "ctx" . "surface" "mcp") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "performancemonitor-darling.fullname" . }}-mcp
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
  {{- with .Values.mcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mcp.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.mcp.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.mcp.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "performancemonitor-darling.fullname" $ }}-mcp
                port:
                  number: {{ $.Values.mcp.port }}
    {{- end }}
{{- end }}
