{{- if not .Values.secrets.existingSecret }}
{{- $name := include "performancemonitor-darling.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $current := dict }}
{{- if $existing }}
{{- $current = $existing.data | default dict }}
{{- end }}
{{- /* Keys given in secrets.values win; generated tokens reuse the live Secret's value so an upgrade keeps them. */}}
{{- $data := dict }}
{{- range $key, $value := .Values.secrets.values }}
{{- $_ := set $data $key ($value | toString | b64enc) }}
{{- end }}
{{- range $key := list .Values.secrets.webTokenKey .Values.secrets.mcpTokenKey }}
{{- if not (hasKey $data $key) }}
{{- $_ := set $data $key (get $current $key | default (randAlphaNum 40 | b64enc)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ get $data $key }}
  {{- end }}
{{- end }}
