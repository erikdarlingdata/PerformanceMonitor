{{- if and .Values.web.enabled .Values.web.ingress.enabled }}
{{- include "performancemonitor-darling.checkIngress" (dict "ctx" . "surface" "web") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "performancemonitor-darling.fullname" . }}-web
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
  {{- with .Values.web.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.web.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.web.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.web.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "performancemonitor-darling.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.port }}
    {{- end }}
{{- end }}
