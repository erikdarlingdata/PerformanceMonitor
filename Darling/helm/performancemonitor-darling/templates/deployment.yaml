apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "performancemonitor-darling.fullname" . }}
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "performancemonitor-darling.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "performancemonitor-darling.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: render-config
          image: {{ include "performancemonitor-darling.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/render-config.sh", "/scripts/darling.json", "/config/darling.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.configSubstitutions }}
          env:
            {{- range $i, $s := . }}
            - name: DARLING_SUBST_{{ $i }}_PLACEHOLDER
              value: {{ $s.placeholder | quote }}
            - name: DARLING_SUBST_{{ $i }}_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ include "performancemonitor-darling.secretName" $ }}
                  key: {{ $s.secretKey | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-template
              mountPath: /scripts
              readOnly: true
      containers:
        - name: darling
          image: {{ include "performancemonitor-darling.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DARLING_CONFIG
              value: /config/darling.json
            - name: DARLING_STOPPED_MARKER
              value: /tmp/darling-stopped
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/darling
            - name: config
              mountPath: /config
            - name: app-share
              mountPath: /usr/share/PerformanceMonitorDarling
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/darling
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "performancemonitor-darling.claimName" . }}
        - name: config
          emptyDir:
            sizeLimit: 1Mi
        - name: app-share
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: config-template
          configMap:
            name: {{ include "performancemonitor-darling.fullname" . }}
        - name: secrets
          secret:
            secretName: {{ include "performancemonitor-darling.secretName" . }}
            defaultMode: 288
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
