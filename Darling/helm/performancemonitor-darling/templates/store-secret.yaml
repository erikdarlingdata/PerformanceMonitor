{{- if and (eq .Values.store.mode "bundled") (not .Values.store.bundled.auth.existingSecret) }}
{{- $name := include "performancemonitor-darling.storeName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $current := dict }}
{{- if $existing }}
{{- $current = $existing.data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "performancemonitor-darling.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ get $current "password" | default (randAlphaNum 40 | b64enc) }}
{{- end }}
