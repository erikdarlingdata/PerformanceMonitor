# Dependabot version updates (routine dependency bumps).
# Security updates are enabled separately at the repo level and are not affected by this file.
#
# NuGet projects commit packages.lock.json. Dependabot regenerates the lock files of the projects it finds
# through the solution: its own commit carried nine on #6107, five on #6777 and all six of the solution's on
# #8431. It does not regenerate the WPF smoke harness's (tools/ui-smoke-wpf), which is outside the solution,
# so that one is left pinned to the old versions every time (#6107, #6790, #8529). Every NuGet pull request
# therefore needs one command, run on Windows, before it can go green:
#
#     dotnet restore tools/ui-smoke-wpf/UiSmokeWpf.csproj --force-evaluate
#
# then a commit of tools/ui-smoke-wpf/packages.lock.json. Without it the red step is PR CI's "Restore the
# WPF smoke harness (locked)". If "Restore the test projects" or the Exporter's restore is red with NU1004
# as well, the solution's lock files are behind too (#6777 carried a hand commit that regenerated them after
# Dependabot's), and the pull request also needs:
#
#     dotnet restore PerformanceMonitor.sln --force-evaluate
#
# then a commit of every packages.lock.json it rewrites. On a checkout with CRLF line endings that is only
# the files whose CONTENT moved; a restore run on Linux or macOS also rewrites the rest with LF, and git
# normalises those back on add.
#
# The harness restore is a step the updater does not perform, not a workaround for something misconfigured
# here, and the lock files are worth the step: they are the only pin on the TRANSITIVE closure, which no
# props diff shows moving. Reconciling #3143's AWSSDK.PI 4.0.100.11 -> .12 also moved AWSSDK.Core
# 4.0.102.1 -> .3, which the one-line props change never mentioned.
#
# Not automated. A workflow committing to a Dependabot branch needs a write-scoped credential this repository
# does not issue, and a push made with GITHUB_TOKEN triggers no workflow run — so the healed commit would
# carry no checks at all, which is a worse place to be than one red check that names its own remedy (#3143).
#
# ── Reviewing a Microsoft.Data.SqlClient or Azure.Identity bump ────────────────────────────────────────
#
# Read this before approving one. Lite's EntraDefaultCredential mode is broker-free only because
# Azure.Identity.Broker is absent from the dependency graph: DefaultAzureCredential's chain DOES contain a
# broker link (ExcludeBrokerCredential defaults to false, and SqlClient sets only
# ExcludeInteractiveBrowserCredential), and that link is inert solely because it resolves its options by
# reflection and gives up when the separate package is not referenced.
#
# Azure.Identity is not pinned in Directory.Packages.props. It arrives transitively through
# Microsoft.Data.SqlClient.Extensions.Azure's version range, at one resolved version across the seven lock
# files that carry it — so a SqlClient bump can move it without a props diff mentioning it, which is the
# same transitive-closure blind spot the --force-evaluate step above exists for.
#
# Two pins in Lite.Tests/EntraDefaultCredentialTests.cs assert that absence, each with a positive control,
# and BOTH of them assert the absence of that PACKAGE — today's mechanism, not the outcome. So check, by
# hand, whether the bump changed either of:
#
#   * ExcludeBrokerCredential's default, or which exclusions SqlClient sets when it builds the options.
#     A default flipping to true, or SqlClient starting to set it, would make the pins redundant rather
#     than wrong — worth knowing, and worth deleting them for.
#   * the broker's PACKAGING. If a future Azure.Identity carries the broker options type itself, or
#     resolves them from somewhere other than an Azure.Identity.Broker assembly, both pins stay green and
#     the guarantee is gone with nothing to notice it.
#
# Deliberately prose and not a check. Nothing in the graph can be asserted about a mechanism that does not
# exist yet, and a test asserting today's shape harder is what is already there.
version: 2
updates:
  # .NET packages across the solution (PerformanceMonitor.sln discovers all projects).
  - package-ecosystem: "nuget"
    directory: "/"
    # All work lands on dev; the check-branches guard rejects any PR to main that is not
    # dev itself, so Dependabot PRs against main (the previous default) could never merge.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # One grouped PR for routine NuGet bumps, to keep review noise down. Majors are
    # deliberately NOT in the group (Studio's convention): a breaking change arrives as
    # its own PR instead of buried in a routine batch. With central package management
    # (Directory.Packages.props) each bump is one line, so grouped PRs can no longer
    # ship the #2100 class of multi-project version misalignment.
    groups:
      nuget-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # The .NET SDK that global.json pins (#3906). This is the .NET RUNTIME for everything published
  # self-contained (Lite and the Viewer's Setup/Portable builds pack the runtime of whichever SDK built
  # them), so a runtime security release reaches users only through this pin. The NuGet group above
  # never moves it. After 10.0.12 (2026-09-08, three CVEs in Microsoft.DiaSymReader.Native among
  # others), Dependabot moved Microsoft.Extensions.* to 10.0.12, but global.json stayed on 10.0.302,
  # whose latestPatch roll-forward never leaves the 3xx band. That band ended at 10.0.303, so 3.8.0
  # shipped runtime 10.0.11 and a security scan flagged it.
  #
  # Each pull request needs one more line by hand: the FROM line in Darling/Dockerfile has to name
  # the same SDK. DockerfileSdkPinTests fails the pull request, with the version to use, until it
  # does. Majors are ignored: .NET 10 is the LTS the products target, and a move to 11 is a
  # retargeting decision, not a servicing bump.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # upload-artifact majors are release-path sensitive: its artifact-id output feeds the
      # SignPath signing steps, which only execute on release publish — a bad bump breaks
      # signing at the worst possible moment. Bumped manually alongside a validated signing
      # run instead (#1653).
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
