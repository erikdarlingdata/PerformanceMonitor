name: Claude review guard re-run

# #6549: the Claude review guard (claude-review-guard.yml) gives its runner back when the review it
# watches has not started after about three minutes, and FAILS its check, naming the run it waits
# for. This workflow brings the verdict back without a human: when the review has an outcome, it
# re-runs the newest guard run of that head, and the re-run judges the review as the guard always has.
#
# Why a re-run, and why a separate file. Branch protection on dev requires the check named "Claude
# review guard". A re-run of the guard's own run keeps its check suite, its check-run name and its head
# SHA, so the re-run's result is the one branch protection reads, exactly as a re-run by hand is.
# A job in THIS workflow must never carry that name: it would report on the same head from another
# check suite, and one skipped by its `if:` reports as passing (GitHub counts success, skipped and
# neutral as passing). The guard cannot take these triggers itself for the same reason: its job would
# be skipped, or would run, on events it has no verdict for.
#
# The two triggers, and when each works:
#   - pull_request_review (submitted): runs the copy in the pull request's merge commit, so it works
#     on dev as soon as this file merges, before any release. The bot posts with the Claude app's
#     installation token (its reviews are authored by claude[bot]); only the GITHUB_TOKEN's events
#     start no workflow. The job runs for the bot's VERDICT review only: the review with a body,
#     the same rule the guard's verdict scan uses. The inline-comment tool files each comment as a
#     bodiless review of its own, and each would otherwise take a runner.
#   - workflow_run (Claude Auto Review completed): fires only from the default branch's copy, so it
#     is dormant until a release ships this file. It covers the review runs that post no verdict
#     review: a push after the follow-up (the decide job skips the review), a review the action
#     skipped, a review that failed or timed out. Before that release those leave the guard red
#     until a human re-runs it, and its message says so.
#
# What it re-runs. The newest `pull_request` run of the guard for the head, and only when that run is
# completed and its result is no newer than the review's outcome (the verdict's submitted_at, or the
# review run's updated_at): a guard that is still running or queued judges the review itself, and one
# that finished after the outcome has already judged it. It re-runs nothing when the pull request's
# head has moved past that SHA, because a re-run joins the guard's concurrency group and would cancel
# the guard of the newer head. A read or a re-run that fails fails this job, which is not a required
# check; the guard then stays red, which is fail-closed, and a re-run of either one retries.
on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Claude Auto Review]
    types: [completed]

permissions: {}

# One re-run decision at a time per head, queued rather than cancelled: the second decision then sees
# the guard the first one re-ran as not completed, and leaves it alone.
concurrency:
  group: claude-review-guard-rerun-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rerun:
    # NOT "Claude review guard" (see the header): that is the required check's name.
    name: Re-run the Claude review guard
    if: >-
      (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'claude[bot]'
        && github.event.review.body
        && github.event.review.commit_id == github.event.pull_request.head.sha
        && github.event.pull_request.base.ref == 'dev'
        && !github.event.pull_request.draft)
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Re-running a workflow run needs actions: write; the pull request read checks the head.
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the guard that has not judged this review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
          GUARD_WF: claude-review-guard.yml
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          # When the review's outcome became readable: the verdict's submission, or the run's
          # completion. A guard whose result is newer than this has judged it.
          OUTCOME_AT: ${{ github.event.review.submitted_at || github.event.workflow_run.updated_at }}
          OUTCOME: ${{ github.event_name == 'pull_request_review' && format('verdict review {0}', github.event.review.html_url) || format('review run {0} ({1})', github.event.workflow_run.id, github.event.workflow_run.conclusion) }}
        run: |
          set -euo pipefail
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # The newest pull_request run of the guard for $SHA (the list is newest first), as
          # "id status conclusion updated_at pr". A failed read fails this job; it never re-runs blind.
          if ! line=$(gh api "repos/$R/actions/workflows/$GUARD_WF/runs?head_sha=$SHA&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] // empty
                    | "\(.id) \(.status) \(.conclusion // "-") \(.updated_at) \(.pull_requests[0].number // "-")"'); then
            echo "::error title=Guard runs unreadable::Could not list the Claude review guard runs for $SHA."\
              "Nothing was re-run; re-run this job, or the guard by hand."
            exit 1
          fi
          if [ -z "$line" ]; then
            echo "::notice title=No guard run::No Claude review guard run exists for $SHA (a draft, or a"\
              "pull request into another branch). Nothing to re-run for $OUTCOME."
            exit 0
          fi
          read -r id status conclusion updated pr <<<"$line"
          summary "- $OUTCOME, at $OUTCOME_AT. Newest guard run for ${SHA:0:12}: $id, $status/$conclusion, updated $updated."
          if [ "$status" != "completed" ]; then
            echo "::notice title=Guard still running::Guard run $id is $status; it judges $OUTCOME itself."
            exit 0
          fi
          # ISO 8601 UTC timestamps in one format compare as strings. A tie re-runs: judging again
          # is never a wrong answer, and skipping a guard that had not judged would leave it red.
          if [[ "$updated" > "$OUTCOME_AT" ]]; then
            echo "::notice title=Guard already judged::Guard run $id finished at $updated, after"\
              "$OUTCOME at $OUTCOME_AT, so it judged that outcome. Nothing to re-run."
            exit 0
          fi
          if [ "$pr" != "-" ]; then
            if ! head=$(gh api "repos/$R/pulls/$pr" --jq '.head.sha // empty') || [ -z "$head" ]; then
              echo "::error title=Head unreadable::Could not read the head of PR #$pr, so guard run $id"\
                "was not re-run (a re-run for a stale head would cancel the newer head's guard)."\
                "Re-run this job, or the guard by hand."
              exit 1
            fi
            if [ "$head" != "$SHA" ]; then
              echo "::notice title=Head moved::PR #$pr is at ${head:0:12} now, not ${SHA:0:12}; that"\
                "head's own guard judges it. Guard run $id was not re-run."
              exit 0
            fi
          fi
          if ! err=$(gh api -X POST "repos/$R/actions/runs/$id/rerun" 2>&1 >/dev/null); then
            # Another decision may have re-run it first: then the run is no longer completed.
            now=$(gh api "repos/$R/actions/runs/$id" --jq '.status' 2>/dev/null || echo unknown)
            if [ "$now" != "completed" ] && [ "$now" != "unknown" ]; then
              echo "::notice title=Guard already re-run::Guard run $id is $now; something else re-ran it."
              exit 0
            fi
            echo "::error title=Guard re-run failed::Could not re-run guard run $id for $SHA: $err."\
              "Its check stays as it is (red if it was waiting for this review). Re-run it by hand."
            exit 1
          fi
          echo "::notice title=Guard re-run::Re-ran guard run $id ($conclusion, finished $updated), which"\
            "had not judged $OUTCOME."
          summary "- Re-ran guard run $id: https://github.com/$R/actions/runs/$id"
