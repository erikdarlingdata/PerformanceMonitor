name: PR CI

# #6656: the pull request and dev-push CI. One plan job decides the work from the changed files, one build job builds
# both test projects once, N test legs run weighted slices of the classes from that build, and one verdict job turns the
# result into the commit status `CI result`. `CI result` is a commit status and not a job: a skipped required job counts
# as passing, so a skipped run could leave a green on a SHA nobody tested. The status stays pending until the
# verdict sets it, so a run that is cancelled or dies early never passes. A fork pull request's run has a read-only
# token, so fork-ci-result.yml writes its `CI result` from the verdict job's conclusion once the run completes (#8188).
#
# Every pull request runs, draft or ready for review (#7717; PR 2 of the rollout removed the `ci-next` label gate). Agent
# pull requests open as drafts and need their first build and test run on CI, not on the laptop. The draft flag does not
# gate the run, it narrows the scope (#7727): a draft that changes product files runs the build, the test classes of the test
# files it changed and the Darling Stage=Guard classes, not the full suite. The full suite runs when the pull request is
# marked ready for review (`ready_for_review` starts a run), so every merge has a full green run behind it.
# Only a pull request carrying the `merge-train` label does not run; the verdict job fails its `CI result`.
# No `labeled` trigger: an unrelated label would cancel and restart the run.
#
# #7819: a push to dev runs the classes the nightly test map picks for the pushed commit's files, as a ready pull request does
# (ci-plan.py rule 10), and sets `CI result` on the dev commit. The full suite runs on dev once an hour instead of on
# every merge: the schedule below re-dispatches this workflow onto the dev ref (the nightly's pattern, see the redispatch job),
# and the dispatched run plans every area, sets `CI result` and a second status, `CI full suite`, on dev's tip, and skips when
# that tip already carries a finished `CI full suite`. Branch protection on dev has `strict: false`, so two pull requests that
# each pass alone can fail together; the hourly run is what catches that, within the hour and with a short commit range.
# `gh workflow run pr.yml --ref dev` is the manual full run. On another ref it runs that branch's full suite and sets only
# `CI result` on the branch's commit: `CI full suite` and the "dev is red" issue are written only when the ref is dev.

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  schedule:
    # Hourly, off the hour (GitHub's :00 queue is the crowded one). The scheduled run executes the default branch's copy of this
    # file and does nothing but re-dispatch onto dev, so a change here reaches the schedule only once main carries it.
    - cron: '17 * * * *'
  workflow_dispatch: # the full suite on the dispatched ref: the vehicle the hourly re-dispatch rides, and the manual full run
    inputs:
      from_schedule:
        description: 'Set true by the hourly re-dispatch: the run then skips when the dispatched commit already carries a finished CI full suite status. Leave false for a manual run, which always runs.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: read
  actions: read # the verdict job asks whether a newer run of this workflow exists for the pull request (#6656)

# A new push to a pull request cancels that pull request's earlier run. Dev pushes never cancel a running run: at most one
# runs and one newest waits. The hourly full suite has its own group, so a merge's run is not queued behind it and a manual
# dispatch waits for a running one instead of doubling it; the scheduled re-dispatch is seconds long and has its own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-ci-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && 'dev-full-suite' || github.event_name == 'schedule' && 'dev-hourly-redispatch' || 'dev-push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_RESULT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # #7819: a scheduled run executes the DEFAULT branch's copy of this file (main's), while dev is what the full suite must
  # test. As nightly.yml does, the schedule does nothing but re-dispatch this workflow onto the dev ref: a workflow_dispatch
  # run executes the dispatched ref's copy of this file, dev's. GITHUB_TOKEN may create workflow_dispatch runs (the Actions
  # recursion guard exempts workflow_dispatch and repository_dispatch), and the dispatched run cannot loop back here because it
  # arrives as workflow_dispatch, not schedule. This job references no tree path, so main's copy keeps working across releases.
  # Until main carries this job, the schedule starts nothing, and dev's full runs are the nightly's and manual dispatches.
  redispatch:
    name: Re-dispatch the hourly full suite onto dev
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-dispatch this workflow onto the dev ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pr.yml --repo "${GITHUB_REPOSITORY}" --ref dev -f from_schedule=true

  plan:
    name: CI plan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      outcome: ${{ steps.plan.outputs.outcome }}
      areas: ${{ steps.plan.outputs.areas }}
      darling_scope: ${{ steps.plan.outputs.darling_scope }}
      class_lists: ${{ steps.plan.outputs.class_lists }}
      build: ${{ steps.plan.outputs.build }}
      pg_old_targets: ${{ steps.plan.outputs.pg_old_targets }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
      legs: ${{ steps.plan.outputs.legs }}
      legs_json: ${{ steps.plan.outputs.legs_json }}
      exporter: ${{ steps.exporter.outputs.exporter }}
    steps:
      # Depth 2: a pull request run checks out the merge commit, and the plan reads the pull request's own change as
      # HEAD^1..HEAD (the map selection below, #7728). A dev push checks out the pushed commit and reads the same range (#7819).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # #7819: the hourly re-dispatch runs the full suite only when dev moved since the last full run that finished. A finished
      # full run leaves `CI full suite` as success or failure on its commit (the verdict job); pending is a run still going or one
      # that died, and a commit with no such status has never had one. A read that fails runs the suite: a spare run is cheap,
      # a missed one is not. A manual dispatch (from_schedule false) always runs.
      - name: Skip when the full suite already ran on this commit
        id: skip
        if: github.event_name == 'workflow_dispatch' && inputs.from_schedule == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          done_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses?per_page=100" \
            --jq '[.[] | select(.context == "CI full suite" and (.state == "success" or .state == "failure"))] | length' 2>/dev/null) || done_count=""
          if [[ "${done_count}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice title=Full suite already ran::${GITHUB_SHA} already carries a finished CI full suite status, and dev has not moved since. Nothing to run."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      # #7728: a pull request that is ready for review picks its test classes from the newest nightly test map, and so does a dev
      # push (#7819). This step only fetches the map. It never fails the job: a download that fails leaves the file out and says
      # why in map_error, and the plan then runs every class its areas select. A draft does not use the map, and the hourly
      # workflow_dispatch run runs everything.
      - name: Fetch the newest nightly test map
        id: map
        if: steps.skip.outputs.skip != 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.draft != true) || github.event_name == 'push')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p test-map-download
          error="no successful nightly run on dev has a test-map artifact"
          ids=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow nightly.yml --branch dev --status success --limit 5 --json databaseId --jq '.[].databaseId' 2>test-map-download/list.err)
          if [ -z "${ids}" ]; then
            error="the nightly run list could not be read: $(head -c 200 test-map-download/list.err | tr '\n' ' ')"
          fi
          for id in ${ids}; do
            if gh run download "${id}" --repo "${GITHUB_REPOSITORY}" --name test-map --dir test-map-download 2>test-map-download/get.err && [ -s test-map-download/test-map.json.gz ]; then
              echo "map_file=test-map-download/test-map.json.gz" >> "${GITHUB_OUTPUT}"
              echo "Fetched the test map of nightly run ${id}."
              exit 0
            fi
            error="the test-map artifact of nightly run ${id} could not be downloaded: $(head -c 200 test-map-download/get.err | tr '\n' ' ')"
          done
          echo "::warning title=No nightly test map::${error}. The run uses every class its areas select."
          echo "map_error=${error}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Plan the run from the changed files
        id: plan
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft || 'false' }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced || 'false' }}
          MAP_FILE: ${{ steps.map.outputs.map_file }}
          MAP_ERROR: ${{ steps.map.outputs.map_error || 'the nightly test map was not fetched' }}
        run: |
          set -euo pipefail

          # The payload's draft flag is as old as the event. A push to a draft and `gh pr ready` seconds apart start the push run
          # last: it cancels the ready run and its payload still says draft, so it would run the narrow draft scope and the ready
          # head would get a `CI result` without the full suite. Read the live state instead; if the call fails, keep the payload's value.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if live_draft=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.draft' 2>/dev/null) && [[ "${live_draft}" =~ ^(true|false)$ ]]; then
              if [ "${live_draft}" != "${IS_DRAFT}" ]; then
                echo "::notice title=Draft state read live::The pull request is draft=${live_draft} now, but the event payload said draft=${IS_DRAFT}. Using the live state."
              fi
              IS_DRAFT="${live_draft}"
            else
              echo "::notice title=Draft state read from the payload::The pull request API call failed, so the event payload's draft=${IS_DRAFT} is used."
            fi
          fi

          # A pull request lists its files through the API. A dev push (#7819) lists the pushed commit's files, HEAD^1..HEAD, when it is
          # one commit on top of the ref's previous tip (`before`) and not forced; any other push gets one path no area knows, so
          # the plan runs every area. A workflow_dispatch run has no list and runs every area.
          : > changed.txt
          if [ "${EVENT_NAME}" = "push" ]; then
            parent=$(git rev-parse -q --verify HEAD^1 2>/dev/null || true)
            if [ "${PUSH_FORCED}" = "true" ]; then
              echo "::warning title=Forced push::The push was forced, so its change cannot be read as one commit. Running every area."
              echo "unknown/push-was-forced" > changed.txt
            elif [ -z "${parent}" ] || [ "${parent}" != "${PUSH_BEFORE}" ]; then
              echo "::warning title=Push of more than one commit::The pushed commit's parent is not the ref's previous tip (${PUSH_BEFORE:0:9}), so the change cannot be read as one commit. Running every area."
              echo "unknown/push-of-more-than-one-commit" > changed.txt
            elif ! git diff --name-only HEAD^1 HEAD > changed.part; then
              echo "::warning title=Changed-file list unavailable::git diff failed, so the pushed commit's files are unknown. Running every area."
              echo "unknown/push-diff-unavailable" > changed.txt
            else
              mv changed.part changed.txt
            fi
          fi
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # The files API can fail (a 5xx, a rate limit) and caps its list at 3000 files. Either way the list cannot be
            # trusted, so give the plan one path no area knows: it then runs every area, and the PR is slower, not red.
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' > changed.part; then
              mv changed.part changed.txt
              if [ "$(wc -l < changed.txt)" -ge 3000 ]; then
                echo "::warning title=Changed-file list may be cut::The files API returned 3000 or more files, its limit, so the list may be cut short. Running every area."
                echo "unknown/changed-files-cut-off" > changed.txt
              fi
            else
              echo "::warning title=Changed-file list unavailable::The pull request files API call failed, so the changed files are unknown. Running every area."
              echo "unknown/changed-files-unavailable" > changed.txt
            fi
          fi
          echo "$(wc -l < changed.txt) changed file(s)"

          # --map turns the map rule on for a pull request that is ready for review (#7728). Any failure of the map, its download,
          # its parse or its age, makes the plan run every class its areas select, and `why` says so.
          python -I .github/scripts/ci-plan.py --event "${EVENT_NAME}" --base "${BASE_REF}" --head-ref "${HEAD_REF}" \
            --draft "${IS_DRAFT}" --labels "${LABELS}" --files-file changed.txt --github-output "${GITHUB_OUTPUT}" \
            --map "${MAP_FILE}" --map-error "${MAP_ERROR}" --class-lists-dir ci-class-lists

      # #7734: the selected class lists go to the test legs as files, not as environment variables (a Windows variable holds
      # 32,767 characters, which stopped a selection at about 980 Darling classes). Written by the plan step; three days of retention.
      - name: Upload the class lists
        if: steps.plan.outputs.class_lists == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-class-lists
          path: ci-class-lists
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      # The exporter job (Exporter/) has its own path rule: the `exporter` filter in build.yml, read here through ci-select.py
      # so there is one copy of the patterns. A run that plans every area (the hourly dispatch, a push the map answered FULL for),
      # a pull request that is not against dev, an empty file list and a file list that cannot be trusted all run it; a dev push
      # with a file list follows the pull request's rule (#7819). Root files (the solution, Directory.*.props, global.json,
      # nuget.config) are in the `root` filter.
      - name: Decide whether the exporter job runs
        id: exporter
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          PLAN_AREAS: ${{ steps.plan.outputs.areas }}
        run: |
          set -euo pipefail

          python -I - <<'PY' >> "${GITHUB_OUTPUT}"
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("ci_select", ".github/scripts/ci-select.py")
          mod = importlib.util.module_from_spec(spec)
          sys.modules["ci_select"] = mod
          spec.loader.exec_module(mod)
          files = [ln.strip() for ln in open("changed.txt", encoding="utf-8") if ln.strip()]
          areas = mod.Rules().areas(files)
          run = (
              os.environ["EVENT_NAME"] not in ("pull_request", "push")
              or os.environ["PLAN_AREAS"] == "all"
              or os.environ["BASE_REF"] != "dev"
              or not files
              or any(f.startswith("unknown/") for f in files)
              or areas["exporter"]
              or areas["root"]
              or "Directory.Packages.props" in files
          )
          print("exporter=" + ("true" if run else "false"))
          PY

      # Pending from the moment the plan says the run goes. A fork's read-only token cannot write it: for a fork pull request,
      # fork-ci-result.yml writes the final state from this run's `CI verdict` job conclusion once the run completes (#8188).
      # A run on the dev ref that plans every area also marks `CI full suite` pending (#7819); the verdict
      # job finishes both, and the hourly re-dispatch skips a commit whose `CI full suite` is finished. A pull request's ref is
      # refs/pull/N/merge and a manual dispatch on another branch has that branch's ref, so neither writes `CI full suite`.
      - name: Set CI result to pending
        if: steps.plan.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ON_DEV: ${{ github.ref == 'refs/heads/dev' }}
          FULL_SUITE: ${{ steps.plan.outputs.full_suite }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CI_RESULT_SHA}" -f state=pending -f context='CI result' \
            -f description='CI is running' -f target_url="${TARGET_URL}" > /dev/null
          if [ "${ON_DEV}" = "true" ] && [ "${FULL_SUITE}" = "true" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${CI_RESULT_SHA}" -f state=pending -f context='CI full suite' \
              -f description='The full suite is running' -f target_url="${TARGET_URL}" > /dev/null
          fi

      # As build.yml's workflow-lint job does: on every dev run, and on a pull request when a workflow file changed.
      - name: Lint the workflow files with actionlint and shellcheck
        if: steps.plan.outputs.run == 'true' && (steps.plan.outputs.actionlint == 'true' || github.event_name != 'pull_request')
        shell: bash
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          set -uo pipefail
          # No -ignore and no shellcheck-off flag: a finding is fixed in the workflow, not silenced here.
          if ! docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -no-color; then
            echo "::error title=actionlint found problems::Fix them in the workflow file. The findings, shellcheck's among them, are listed above."
            exit 1
          fi

      - name: Parse and link every wwwroot/js module
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.check_web_js == 'true'
        shell: bash
        run: bash .github/scripts/check-web-js.sh

  build:
    name: Build the test projects
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # #6497: a runner whose processes cannot start (0xC0000142 STATUS_DLL_INIT_FAILED) would otherwise fail one
      # step at a time and pay each job's own timeout. This is the first step, so such a runner fails here in seconds.
      - name: Check the runner can start a process
        timeout-minutes: 2
        shell: bash
        run: dotnet --version

      - uses: actions/checkout@v7

      # The exact SDK version from global.json, not its feature band. Given a band, setup-dotnet resolves the newest
      # patch through aka.ms links, and on 2026-10-25 those links sent every run to a download that failed with HTTP 409.
      # With an exact version the install script downloads from the release feed and never asks aka.ms.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Locked mode and `set -euo pipefail`: a multi-line run block under the default shell reports only its last
      # command's exit code, so the first restore could fail unseen (LockedModeRestoreCoverageTests enforces both).
      - name: Restore the test projects
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode
          dotnet restore Lite.Tests/Lite.Tests.csproj --locked-mode

      - name: Build the Darling test project
        shell: bash
        run: |
          set -euo pipefail

          dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore

      - name: Build the Lite test project
        shell: bash
        run: |
          set -euo pipefail

          dotnet build Lite.Tests/Lite.Tests.csproj -c Release --no-restore

      # Where this build was made and from what, for the legs' check. No dot-prefix (upload-artifact skips hidden files).
      - name: Record where this build was made
        shell: pwsh
        env:
          PRODUCER_WORKSPACE: ${{ github.workspace }}
          PRODUCER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path guard-build-origin.txt -Value @("workspace=$env:PRODUCER_WORKSPACE", "sha=$env:PRODUCER_SHA") -Encoding utf8NoBOM

      # The legs run on windows-latest (win-x64), which loads only runtimes/win, runtimes/unix and runtimes/win-x64. The
      # other platforms' native libraries (osx, linux, arm, x86: DuckDB, Skia, MSAL, HarfBuzz) were 822 of the 1,054 MB
      # of the first artifact and what 16 legs spent minutes downloading at once (#6656). Nothing reads them: the tests
      # that name runtimes/ plant their own tree. PDBs stay, for stack traces with line numbers.
      - name: Leave other platforms' native libraries out of the artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keep = @('win', 'win-x64', 'unix')
          $roots = @('Darling/Darling.Tests/bin/Release', 'Darling/PerformanceMonitor.Darling.Service/bin/Release', 'Lite.Tests/bin/Release')
          $removed = 0
          foreach ($root in $roots) {
            foreach ($runtimes in @(Get-ChildItem -Path $root -Directory -Recurse -Filter runtimes)) {
              foreach ($rid in @(Get-ChildItem -Path $runtimes.FullName -Directory)) {
                if ($keep -notcontains $rid.Name) {
                  Remove-Item -Recurse -Force $rid.FullName
                  $removed++
                }
              }
            }
          }
          Write-Host "Removed $removed runtime folder(s) for other platforms."

      # The same file lists the Guard build uploaded for the two projects. One day of retention: only this run's legs read it.
      - name: Upload the built test projects
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-build
          path: |
            guard-build-origin.txt
            Darling/Darling.Tests/bin/Release
            Darling/PerformanceMonitor.Darling.Service/bin/Release
            Darling/Darling.Tests/obj/project.assets.json
            Darling/Darling.Tests/obj/project.nuget.cache
            Darling/Darling.Tests/obj/*.nuget.g.props
            Darling/Darling.Tests/obj/*.nuget.g.targets
            Darling/Darling.Tests/obj/*.nuget.dgspec.json
            Lite.Tests/bin/Release
            Lite/bin/**/PerformanceMonitorLite.runtimeconfig.json
            Lite.Tests/obj/project.assets.json
            Lite.Tests/obj/project.nuget.cache
            Lite.Tests/obj/*.nuget.g.props
            Lite.Tests/obj/*.nuget.g.targets
            Lite.Tests/obj/*.nuget.dgspec.json
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: error

  test:
    name: Test leg ${{ matrix.leg }}/${{ needs.plan.outputs.legs }}
    needs: [plan, build]
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.legs != '0' }}
    runs-on: windows-latest
    # The test step has 25 minutes; the rest is setup, the artifact fetch and the uploads.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs_json) }}
    steps:
      # #6497: a runner whose processes cannot start (0xC0000142 STATUS_DLL_INIT_FAILED) would otherwise fail one
      # step at a time and pay each job's own timeout. This is the first step, so such a runner fails here in seconds.
      - name: Check the runner can start a process
        timeout-minutes: 2
        shell: bash
        run: dotnet --version

      - uses: actions/checkout@v7

      - name: Fetch the build
        uses: actions/download-artifact@v8
        with:
          name: ci-test-build
          path: .

      # A fetched build that is not for THIS workspace and commit is an error: the tests find the repo root through
      # [CallerFilePath], so a binary built at another path would read another tree.
      - name: Check the fetched build is for this workspace and commit
        shell: pwsh
        env:
          THIS_WORKSPACE: ${{ github.workspace }}
          THIS_SHA: ${{ github.sha }}
          REQUIRED_FILES: Darling/Darling.Tests/bin/Release/net10.0-windows/Darling.Tests.dll;Darling/Darling.Tests/obj/project.assets.json;Lite.Tests/bin/Release/net10.0-windows/Lite.Tests.dll;Darling/Darling.Tests/bin/Release/net10.0-windows/Darling.Tests.exe;Lite.Tests/bin/Release/net10.0-windows/Lite.Tests.exe;Lite.Tests/obj/project.assets.json
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = @{}
          if (Test-Path guard-build-origin.txt) {
            foreach ($line in Get-Content guard-build-origin.txt) { if ($line -match '^(\w+)=(.*)$') { $origin[$Matches[1]] = $Matches[2] } }
          }
          if ($origin['workspace'] -ne $env:THIS_WORKSPACE -or $origin['sha'] -ne $env:THIS_SHA) {
            Write-Host "::error title=Build is for another workspace or commit::The fetched build says workspace '$($origin['workspace'])' at '$($origin['sha'])'; this leg is at '$env:THIS_WORKSPACE' at '$env:THIS_SHA'."
            exit 1
          }
          foreach ($file in ($env:REQUIRED_FILES -split ';')) {
            if (-not (Test-Path $file)) {
              Write-Host "::error title=Build is incomplete::The fetched build has no $file."
              exit 1
            }
          }

      # No .NET SDK install here (#7098): the legs run the built Darling.Tests.exe and Lite.Tests.exe on the runner image's
      # own .NET 10, so they do not reinstall the SDK global.json pins (the image's patch is older, and a leg compiles
      # nothing). The legs therefore run on the image's .NET 10 patch, not the pinned one. The pg-old-targets job below
      # still runs `dotnet run`, so it keeps its own install.

      # Same cache key as build.yml and nightly.yml (the fetch script's own content hash), so a warm cache from any of
      # them means no ~340MB download here. Every leg that runs any Darling class needs the runtime: a 'full' scope runs
      # all of them, and 'reads-lite' (a Lite-only change) still runs the Stage=Guard and Lite-reads classes, some of which
      # are live PostgreSQL classes (#6656).
      # A Lite-only change whose plan has darling_scope 'none' and areas 'lite' runs the same Stage=Guard and Lite-reads
      # classes under -Areas lite, so it needs the runtime and PostgreSQL too (#6656, #6684).
      - name: Cache Darling pg-runtime.zip
        if: (needs.plan.outputs.darling_scope != 'none' || needs.plan.outputs.areas == 'lite')
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip (cache miss only)
        if: (needs.plan.outputs.darling_scope != 'none' || needs.plan.outputs.areas == 'lite') && steps.cache-pg-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Extract pg-runtime
        if: (needs.plan.outputs.darling_scope != 'none' || needs.plan.outputs.areas == 'lite')
        shell: pwsh
        run: |
          $zip  = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime.zip"
          $dest = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          if (-not (Test-Path "$dest\pgsql\bin\pg_ctl.exe")) { throw "pg-runtime missing pgsql\bin\pg_ctl.exe" }

      - name: Start PostgreSQL
        if: (needs.plan.outputs.darling_scope != 'none' || needs.plan.outputs.areas == 'lite')
        shell: pwsh
        run: ./.github/scripts/start-test-pg.ps1 -Mode Start

      # -NoTreeGuards: leg 1's whole-tree guards piece is the whole Darling suite once more with no store. Measured on
      # run 39996992603 it took 12.7 minutes (36,832 tests), not the half minute the design assumed, and it timed leg 1
      # out. The legs already run every Darling class (and for a Lite-only change the Guard and Lite-reads classes), with
      # the store. The step has its own timeout, so a hang still reaches the upload steps below.
      - name: Fetch the class lists
        if: needs.plan.outputs.class_lists == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ci-class-lists
          path: ci-class-lists

      - name: Run test leg ${{ matrix.leg }}
        timeout-minutes: 25
        shell: pwsh
        env:
          LEG: ${{ matrix.leg }}
          LEG_COUNT: ${{ needs.plan.outputs.legs }}
          AREAS: ${{ needs.plan.outputs.areas }}
          CLASS_LISTS: ${{ needs.plan.outputs.class_lists }}
        run: |
          $listArgs = @{}
          if ($env:CLASS_LISTS -eq 'true') {
            if (Test-Path -LiteralPath ci-class-lists/darling-classes.txt) { $listArgs.OnlyDarlingClassesFile = 'ci-class-lists/darling-classes.txt' }
            if (Test-Path -LiteralPath ci-class-lists/lite-classes.txt) { $listArgs.OnlyLiteClassesFile = 'ci-class-lists/lite-classes.txt' }
          }
          ./.github/scripts/run-ci-leg.ps1 -Leg $env:LEG -LegCount $env:LEG_COUNT -Areas $env:AREAS @listArgs -NoTreeGuards

      - name: Stop PostgreSQL
        if: always() && (needs.plan.outputs.darling_scope != 'none' || needs.plan.outputs.areas == 'lite')
        shell: pwsh
        run: ./.github/scripts/start-test-pg.ps1 -Mode Stop

      - name: Upload the leg's results
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-results-${{ matrix.leg }}
          path: |
            TestResults/
            !TestResults/crash-dumps/**
            ${{ runner.temp }}/darling-pg*.log
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      # #8190: a test host that died with a native fault (exit -1073741819 is an access violation) wrote a minidump under
      # TestResults/crash-dumps, and the shard scripts recorded its exit code there (.github/scripts/crash-dumps.ps1). The folder
      # is its own artifact: only a crashed leg has one, and a dump is tens of MB, so it is kept out of the results above.
      - name: Upload the leg's crash dumps
        if: always() && hashFiles('TestResults/crash-dumps/**') != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: ci-crash-dumps-${{ matrix.leg }}
          path: TestResults/crash-dumps/
          retention-days: 7
          overwrite: true

  # The Darling export tool (Exporter/): restore in locked mode, build, and run its tests. It is a plain net10.0 console app,
  # so it runs on Linux, where Docker is available for the tests that start a real PostgreSQL (they skip themselves without
  # Docker). The verdict job folds the result into `CI result`, so this adds no required check of its own.
  exporter:
    name: Exporter build and test
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.exporter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The exact SDK version from global.json, for the reason the build job gives.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore the exporter projects
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore Exporter/PerformanceMonitor.Exporter/PerformanceMonitor.Exporter.csproj --locked-mode
          dotnet restore Exporter/PerformanceMonitor.Exporter.Tests/PerformanceMonitor.Exporter.Tests.csproj --locked-mode

      - name: Build the exporter tests
        shell: bash
        run: |
          set -euo pipefail

          dotnet build Exporter/PerformanceMonitor.Exporter.Tests/PerformanceMonitor.Exporter.Tests.csproj -c Release --no-restore

      - name: Test the exporter (fast)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          dotnet test Exporter/PerformanceMonitor.Exporter.Tests/PerformanceMonitor.Exporter.Tests.csproj -c Release --no-build --filter "Category!=Slow" --blame-hang-timeout 300s

      # The two million-row state store tests take about a minute each on a developer machine and about three minutes
      # each on this runner (3 m 4 s and 3 m 19 s, measured on #7581's CI), which is close to a 300 s hang timeout. 900 s still stops a real hang well inside the step.
      # Normal verbosity prints each test's duration, so a test that grows slower shows in the log before it times out.
      - name: Test the exporter (slow)
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          dotnet test Exporter/PerformanceMonitor.Exporter.Tests/PerformanceMonitor.Exporter.Tests.csproj -c Release --no-build --filter "Category=Slow" --blame-hang-timeout 900s --blame-hang-dump-type full --logger "console;verbosity=normal"

      # A hang leaves its dumps and the blame sequence file in TestResults/. Without this upload they die with the runner.
      - name: Upload the exporter test results
        if: failure()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: exporter-test-results
          path: Exporter/PerformanceMonitor.Exporter.Tests/TestResults/
          retention-days: 3
          if-no-files-found: ignore

  # #6985: every PostgreSQL collector against a REAL PostgreSQL 10, 13, 14, 16 and 17, so a NULL an old server sends or a
  # column a supported version lacks (#6206, #6836) turns the pull request red. Runs only when the plan says a file it covers
  # changed (ci-plan.py's PG_OLD_TARGET_PATHS); the nightly runs it every night. Reuses the build job's artifact.
  pg-old-targets:
    name: PostgreSQL collectors on old targets
    needs: [plan, build]
    if: ${{ needs.plan.outputs.run == 'true' && needs.plan.outputs.build == 'true' && needs.plan.outputs.pg_old_targets == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check the runner can start a process
        timeout-minutes: 2
        shell: bash
        run: dotnet --version

      - uses: actions/checkout@v7

      - name: Fetch the build
        uses: actions/download-artifact@v8
        with:
          name: ci-test-build
          path: .

      # The tests find the repo root through [CallerFilePath], so a binary built at another path would read another tree.
      - name: Check the fetched build is for this workspace and commit
        shell: pwsh
        env:
          THIS_WORKSPACE: ${{ github.workspace }}
          THIS_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = @{}
          if (Test-Path guard-build-origin.txt) {
            foreach ($line in Get-Content guard-build-origin.txt) { if ($line -match '^(\w+)=(.*)$') { $origin[$Matches[1]] = $Matches[2] } }
          }
          if ($origin['workspace'] -ne $env:THIS_WORKSPACE -or $origin['sha'] -ne $env:THIS_SHA) {
            Write-Host "::error title=Build is for another workspace or commit::The fetched build says workspace '$($origin['workspace'])' at '$($origin['sha'])'; this job is at '$env:THIS_WORKSPACE' at '$env:THIS_SHA'."
            exit 1
          }
          foreach ($file in @('Darling/Darling.Tests/bin/Release/net10.0-windows/Darling.Tests.dll', 'Darling/Darling.Tests/obj/project.assets.json')) {
            if (-not (Test-Path $file)) { Write-Host "::error title=Build is incomplete::The fetched build has no $file."; exit 1 }
          }

      - name: Read the SDK version from global.json
        id: globaljson_sdk
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}

      # The same key as every other job (the fetch script's own content hash): a warm cache means no ~340MB download.
      - name: Cache Darling pg-runtime.zip
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip (cache miss only)
        if: steps.cache-pg-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Extract pg-runtime
        shell: pwsh
        run: |
          $zip  = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime.zip"
          $dest = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          if (-not (Test-Path "$dest\pgsql\bin\pg_ctl.exe")) { throw "pg-runtime missing pgsql\bin\pg_ctl.exe" }

      # Fetch the five old servers (cached on the fetch script's own hash; the shared download cache stays out of it, five
      # 320 MB zips), start the 5541 store through the shared script, then one trust-auth loopback cluster per major.
      - name: Cache the old PostgreSQL targets
        uses: actions/cache@v6
        with:
          path: |
            Darling/artifacts/pg-targets
            !Darling/artifacts/pg-targets/downloads
          key: pg-targets-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-target.ps1') }}

      - name: Start the store and the old PostgreSQL targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/start-test-pg.ps1 -Mode Start
          ./.github/scripts/start-test-pg.ps1 -Mode StartTargets -Majors 10,13,14,16,17

      # DARLING_TEST_PG_TARGETS_REQUIRED turns a missing target variable into a failure instead of a skip. A run that
      # matched no test exits 0, so the step also fails on a total of zero.
      - name: Run the collectors against the old targets
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in @(./.github/scripts/start-test-pg.ps1 -Mode Env -Majors 10,13,14,16,17)) {
            $name, $value = $line -split '=', 2
            [Environment]::SetEnvironmentVariable($name, $value)
          }
          $env:DARLING_TEST_PG_TARGETS_REQUIRED = '1'
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- -class "*PgCollectorsOnOldTargetsLiveTests*" -longRunning 300 2>&1 | Tee-Object -FilePath TestResults/pg-old-targets.log
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { exit $exit }
          if (-not (Select-String -Path TestResults/pg-old-targets.log -Pattern 'Total:\s+[1-9]' -Quiet)) { throw 'the run reported no tests: the class filter matched nothing' }

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: ./.github/scripts/start-test-pg.ps1 -Mode Stop

      - name: Upload the logs
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: pg-old-targets-results
          path: |
            TestResults/
            ${{ runner.temp }}/darling-pg*.log
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # Named "CI verdict", never "CI result": `CI result` is the commit status this job sets.
  verdict:
    name: CI verdict
    needs: [plan, build, test, pg-old-targets, exporter]
    # A run that does not go and is not train-blocked has nothing to say, so skip the runner; a failed plan job still reports.
    # The scheduled re-dispatch and an hourly run that found its commit already covered plan nothing and say nothing (#7819).
    if: ${{ always() && github.event_name != 'schedule' && (needs.plan.result != 'success' || needs.plan.outputs.run == 'true' || needs.plan.outputs.outcome == 'train-blocked') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the scripts folder, for ci-verdict-issues.py (#8202): the two issue steps below call it. No credentials stay
      # in the checkout; the steps use GH_TOKEN.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set CI result
        id: verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ON_DEV: ${{ github.ref == 'refs/heads/dev' }}
          FULL_SUITE: ${{ needs.plan.outputs.full_suite }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_OUTCOME: ${{ needs.plan.outputs.outcome }}
          PLAN_BUILD: ${{ needs.plan.outputs.build }}
          PLAN_LEGS: ${{ needs.plan.outputs.legs }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLAN_PG_OLD: ${{ needs.plan.outputs.pg_old_targets }}
          PG_OLD_RESULT: ${{ needs.pg-old-targets.result }}
          PLAN_RUN: ${{ needs.plan.outputs.run }}
          PLAN_EXPORTER: ${{ needs.plan.outputs.exporter }}
          EXPORTER_RESULT: ${{ needs.exporter.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Success only when every job is success, or was skipped because the plan did not ask for it.
          state=success
          desc="CI passed"
          failed=""
          if [ "${PLAN_RESULT}" != "success" ]; then
            state=failure; failed="plan (${PLAN_RESULT})"
          elif [ "${PLAN_OUTCOME}" = "train-blocked" ]; then
            state=failure
            desc="This pull request carries the merge-train label; only an admin override merges it."
            echo "::error title=CI result failed::This pull request carries the merge-train label, so its train run covers it. It can be merged only by an admin override after a merge train covered it."
          else
            want_build=skipped; [ "${PLAN_BUILD}" = "true" ] && want_build=success
            want_test=skipped;  [ "${PLAN_LEGS}" != "0" ] && want_test=success
            [ "${BUILD_RESULT}" = "${want_build}" ] || { state=failure; failed="${failed} build (${BUILD_RESULT})"; }
            [ "${TEST_RESULT}" = "${want_test}" ]   || { state=failure; failed="${failed} test (${TEST_RESULT})"; }
            want_pg=skipped;    [ "${PLAN_PG_OLD}" = "true" ] && [ "${PLAN_BUILD}" = "true" ] && want_pg=success
            [ "${PG_OLD_RESULT}" = "${want_pg}" ]   || { state=failure; failed="${failed} pg-old-targets (${PG_OLD_RESULT})"; }
            want_exporter=skipped; [ "${PLAN_RUN}" = "true" ] && [ "${PLAN_EXPORTER}" = "true" ] && want_exporter=success
            [ "${EXPORTER_RESULT}" = "${want_exporter}" ] || { state=failure; failed="${failed} exporter (${EXPORTER_RESULT})"; }
          fi
          # #6656: a run that a newer push or ready-for-review replaced is cancelled, but cancelled() inside this job reports the
          # job's own state, so the step cannot tell. Ask the API instead: when a newer run of this workflow exists for this pull
          # request, it sets CI result and this one posts no failure. A newer run is this pull request's when it comes from this
          # head repository (a fork's runs list no pull requests, so the repository is what tells two forks that both use
          # `patch-1` apart) and its pull request list is empty or names this number. -f makes gh URL-encode the branch name. A test
          # leg that hits its timeout also reports cancelled, but no newer run exists then, so that failure still posts. If the call
          # fails, post as before.
          if [ "${state}" = "failure" ] && [ "${EVENT_NAME}" = "pull_request" ]; then
            newer=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yml/runs"               -f event=pull_request -f branch="${HEAD_REF}" -f per_page=20               --jq '[.workflow_runs[]
                     | select(.id > (env.GITHUB_RUN_ID | tonumber)
                              and .head_repository.full_name == env.HEAD_REPO
                              and (((.pull_requests // []) | length) == 0
                                   or any((.pull_requests // [])[]; (.number | tostring) == env.PR_NUMBER)))] | length' 2>/dev/null) || newer=""
            if [[ "${newer}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::notice title=CI result left to a newer run::A newer run of this workflow exists on this pull request, so it sets CI result and this run (${failed# }) posts no failure."
              echo "state=" >> "${GITHUB_OUTPUT}"
              echo "failed=" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          if [ "${state}" = "failure" ] && [ "${PLAN_OUTCOME}" != "train-blocked" ]; then
            desc="CI failed: ${failed# }"
            echo "::error title=CI failed::${desc}"
          fi
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

          # #8188: a fork's token is read-only, so this run cannot write the status. fork-ci-result.yml writes it once this run
          # completes, from this job's conclusion as the API reports it, so the step exits by the state: a failure fails this job.
          # (A failure that a newer run replaced exited 0 above; the relay makes the same newer-run check before it writes.)
          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice title=CI result is relayed for a fork pull request::A fork's token is read-only, so this run cannot set the CI result status. The PR CI fork result workflow sets it from this job's conclusion ('${state}') once the run completes; success also needs a maintainer's approval of this commit."
            [ "${state}" = "success" ] && exit 0
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CI_RESULT_SHA}" -f state="${state}" -f context='CI result' \
            -f description="${desc:0:140}" -f target_url="${TARGET_URL}" > /dev/null
          # #7819: a run on the dev ref that planned every area also finishes `CI full suite`, which the hourly re-dispatch's skip
          # rule and the "dev is red" commit range read. A pull request never carries it, and a manual dispatch on another ref
          # sets only `CI result` on that branch's commit.
          if [ "${ON_DEV}" = "true" ] && [ "${FULL_SUITE}" = "true" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${CI_RESULT_SHA}" -f state="${state}" -f context='CI full suite' \
              -f description="${desc:0:140}" -f target_url="${TARGET_URL}" > /dev/null
          fi

      # #8202: a pull request whose green came from a rerun passed by luck once. The script reads every earlier attempt's
      # failed test legs for their [FAIL] lines and files one issue per test (or comments on the open one), before the merge
      # button is pressed. It reports only: the script exits 0 on its own failures and the step never fails the run.
      - name: File the tests an earlier attempt failed, when the run passed only on a rerun
        if: ${{ always() && github.event_name == 'pull_request' && steps.verdict.outputs.state == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.verdict.outputs.state }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          python -I .github/scripts/ci-verdict-issues.py rerun-passes --repo "${GITHUB_REPOSITORY}" --server-url "${GITHUB_SERVER_URL}" \
            --event "${GITHUB_EVENT_NAME}" --state "${STATE}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${RUN_ATTEMPT}" \
            --pr-number "${PR_NUMBER}" --head-sha "${HEAD_SHA}"

      # A dev run that turns red opens one "dev is red" issue, or comments on the open one. Only a green FULL run closes it
      # (#7819): a green push that ran the map's classes says nothing about the classes it did not run, and the hourly full
      # run is at most an hour away. A failed full run names the commits since the last full run that passed; a failed push
      # names those since the last green dev run. Only a failure opens it: a cancelled or skipped-by-cancel run says nothing
      # about the code. Only a run on the dev ref (a push, or a dispatch onto dev) touches the issue: a manual dispatch on
      # another branch tests that branch and must neither open nor close it.
      - name: Open, update or close the "dev is red" issue
        if: ${{ always() && github.ref == 'refs/heads/dev' && steps.verdict.outputs.state != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.verdict.outputs.state }}
          FAILED: ${{ steps.verdict.outputs.failed }}
          FULL_SUITE: ${{ needs.plan.outputs.full_suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANY_FAILURE: ${{ contains(needs.*.result, 'failure') }}
        run: |
          set -uo pipefail

          issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search '"dev is red" in:title' --json number,title \
            --jq '[.[] | select(.title == "dev is red")][0].number // empty')

          if [ "${FULL_SUITE}" = "true" ]; then
            kind="full suite"; context="CI full suite"
          else
            kind="push"; context="CI result"
          fi

          if [ "${STATE}" = "success" ]; then
            if [ -n "${issue}" ] && [ "${FULL_SUITE}" = "true" ]; then
              gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" --comment "dev is green again at ${GITHUB_SHA} (the full suite passed): ${RUN_URL}"
            elif [ -n "${issue}" ]; then
              echo "A green push run ran only the classes the map selected, so the dev is red issue waits for a green full run."
            fi
            exit 0
          fi
          if [ "${ANY_FAILURE}" != "true" ]; then
            echo "No job failed (the run was cancelled or skipped), so the dev is red issue is left as it is."
            exit 0
          fi

          # The body: the failure, the run, and every dev commit from this sha back to the last one whose `context` status is
          # success, each with its short sha, pull request number and title. The script writes the head of the body even
          # when the commit list cannot be read, so the issue is filed either way.
          python -I .github/scripts/ci-verdict-issues.py dev-red-body --repo "${GITHUB_REPOSITORY}" --red-sha "${GITHUB_SHA}" \n            --run-url "${RUN_URL}" --failed "${FAILED}" --kind "${kind}" --context "${context}" --out body.txt

          if [ -n "${issue}" ]; then
            gh issue comment "${issue}" --repo "${GITHUB_REPOSITORY}" --body-file body.txt
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "dev is red" --body-file body.txt
          fi
