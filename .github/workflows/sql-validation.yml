name: SQL Validation

on:
  push:
    branches: [dev]
    paths: ['install/**', '.github/sql/**', '.github/workflows/sql-validation.yml']
  pull_request:
    branches: [dev]
    paths: ['install/**', '.github/sql/**', '.github/workflows/sql-validation.yml']

# A re-push to a PR cancels that PR's superseded in-flight matrix, and a dev push cancels
# dev's superseded in-flight matrix — four SQL Server containers per run on the shared
# runner pool, validating code that is no longer the head. Newest-wins costs strictly
# nothing here (same policy and 2026-07-26 baseline as build.yml): this workflow uploads
# no artifacts at all, and it validates the FULL install/ tree at the SHA it checks out
# rather than a diff, so the superseding run's coverage is a superset of whatever the
# cancelled run was midway through. Any event this workflow ever grows beyond push and
# pull_request falls to a unique per-run group and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sql-validation-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('sql-validation-push-{0}', github.ref) || format('sql-validation-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    # Container pull + install scripts + seeded view execution runs in well under 15
    # minutes per version; a SQL Server container that never reaches healthy is the hang
    # this bounds, and there are four of these jobs per run on the shared pool.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # SQL Server 2016 is the documented minimum but cannot appear here: SQL Server on Linux
      # begins at 2017, so no 2016 container image exists for the ubuntu service-container shape.
      # 2016 gets the SAME install + seed + view-execution validation manually against the local
      # SQL2016 box as part of release testing (last full pass: 2026-07-26, 13.0.6300 - install
      # clean, 41 views executed, 0 failed).
      matrix:
        include:
          - version: '2017'
            image: mcr.microsoft.com/mssql/server:2017-latest
          - version: '2019'
            image: mcr.microsoft.com/mssql/server:2019-latest
          - version: '2022'
            image: mcr.microsoft.com/mssql/server:2022-latest
          - version: '2025'
            image: mcr.microsoft.com/mssql/server:2025-latest

    name: SQL Server ${{ matrix.version }}

    services:
      sqlserver:
        image: ${{ matrix.image }}
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI_Test#2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - name: Install sqlcmd
        run: |
          # Ubuntu 24.04 runners have Microsoft repo pre-configured; avoid Signed-By conflicts
          if ! grep -rql 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            source /etc/os-release
            echo "deb [arch=amd64,signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Run install scripts
        env:
          SA_PASSWORD: CI_Test#2026!
        run: |
          for script in install/[0-9]*.sql; do
            filename=$(basename "$script")

            # Skip scripts that require SQL Agent or are test/troubleshooting
            case "$filename" in
              45_*) echo "Skipping $filename (requires SQL Agent)"; continue;;
              97_*|98_*|99_*) echo "Skipping $filename (test/troubleshooting)"; continue;;
            esac

            echo "Running $filename..."
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -No -b -i "$script"
            echo "  OK"
          done

      - name: Validate installation
        env:
          SA_PASSWORD: CI_Test#2026!
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -No -b -i .github/sql/ci_validate_installation.sql

      # Existence alone let two view bugs ship (#1635, #1666): a view can compile yet throw only
      # when rows flow through its projection. Seed one representative row per source table
      # (history tables get a correlated pair so LAG/toggle paths emit rows), then materialize
      # every report.* view with SELECT * INTO - COUNT(*) would prune the projected columns and
      # skip exactly the per-row conversions this exists to catch (#1669).
      - name: Seed report view sources
        env:
          SA_PASSWORD: CI_Test#2026!
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -No -b -i .github/sql/ci_seed_report_sources.sql

      - name: Execute report views against seeded rows
        env:
          SA_PASSWORD: CI_Test#2026!
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -No -b -i .github/sql/ci_execute_report_views.sql
