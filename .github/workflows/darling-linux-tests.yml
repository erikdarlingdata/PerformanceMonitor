name: Darling Linux tests

# #9686: Darling runs on Linux (the container image, compose, Helm and the linux-x64 tarball), and every Darling test job
# runs on windows-latest against the Windows PostgreSQL runtime. This workflow runs two things on ubuntu-latest:
#
#   1. linux-suite: the Darling test suite, built without the WPF Viewer (-p:DarlingTestsWithoutViewer=true, see
#      Darling/Darling.Tests/Darling.Tests.csproj), against a Linux TimescaleDB container set up like the Windows test
#      store: UTC time zones, pg_stat_statements, the product's worker settings, a `darling` superuser with trust
#      authentication on loopback, and the `darlingtest`, `probe` and `darling` databases. Classes that only make sense on
#      Windows carry the Platform=Windows trait and are left out.
#   2. linux-systemd: the linux-x64 tarball installed by the steps of docs/darling/linux.md and run under systemd as the
#      darling user (.github/scripts/darling-linux-systemd-leg.sh).
#
# Both jobs are report-only (continue-on-error) until they have been green for a while: a red one is a finding to read,
# and it cannot fail the run that called it or block a merge. Nothing here is a required check.
#
# Triggers: the nightly (nightly.yml calls this as a reusable workflow), a manual dispatch, and a pull request that
# changes this file, the systemd script or the test project file, so a change to how the legs build or run proves itself.
# Never add `pull_request_target`: the jobs build and run the checked-out code and must not get a write token or secrets.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/darling-linux-tests.yml'
      - '.github/scripts/darling-linux-systemd-leg.sh'
      - 'Darling/Darling.Tests/Darling.Tests.csproj'

permissions:
  contents: read

# The store image Darling/compose/docker-compose.yml pins, so a new TimescaleDB release cannot turn this red on its own.
env:
  STORE_IMAGE: timescale/timescaledb:2.32.1-pg17

concurrency:
  group: darling-linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-suite:
    name: Darling suite on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The exact SDK version from global.json, not its feature band, as nightly.yml's linux job reads it.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}

      # The settings .github/scripts/start-test-pg.ps1 gives the Windows test store on port 5541, in a container: the
      # product's worker numbers, no durability (throwaway data), UTC, and the session id on every log line. A `docker run`
      # and not a `services:` entry, because a service container cannot be given the server's command line. The superuser is
      # `darling` with trust authentication, published on loopback only: acceptable on a throwaway runner with throwaway data.
      - name: Start the store (a TimescaleDB container)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name darling-test-store --shm-size=1g -p 127.0.0.1:5541:5432 \
            -e POSTGRES_USER=darling -e POSTGRES_DB=darling -e POSTGRES_HOST_AUTH_METHOD=trust \
            "${STORE_IMAGE}" \
            postgres -c shared_preload_libraries=timescaledb,pg_stat_statements \
              -c timescaledb.max_background_workers=74 -c max_worker_processes=85 \
              -c fsync=off -c full_page_writes=off -c timezone=UTC -c log_timezone=UTC \
              -c "log_line_prefix=%m [%p] %c "

          # The image starts a temporary server on the socket only, runs its init scripts, and starts the real one. A
          # pg_isready over TCP answers only from the real one, so wait for the init line first and then for TCP.
          ready=0
          for _ in $(seq 1 60); do
            # grep reads the whole log (no -q), so docker logs never writes to a closed pipe under pipefail (#9671).
            if docker logs darling-test-store 2>&1 | grep 'PostgreSQL init process complete' >/dev/null \
              && docker exec darling-test-store pg_isready -h 127.0.0.1 -U darling >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready}" != 1 ]; then
            echo "::error::The store did not become ready in 120 seconds."
            docker logs darling-test-store 2>&1 | tail -n 40
            exit 1
          fi

          # darlingtest holds the suite, darling is the database the role-provisioning classes name, probe is for a
          # hand-run query when a run is being diagnosed. The image made darling.
          docker exec darling-test-store psql -h 127.0.0.1 -U darling -d darling -v ON_ERROR_STOP=1 -q \
            -c "CREATE DATABASE darlingtest" -c "CREATE DATABASE probe"
          docker exec darling-test-store psql -h 127.0.0.1 -U darling -d darlingtest -At \
            -c "select 'time zone: ' || current_setting('timezone') || ', preload: ' || current_setting('shared_preload_libraries')"

      # No --locked-mode: the lock file beside the project describes the Windows package graph (see the project file).
      - name: Build the suite without the Viewer
        timeout-minutes: 30
        run: dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release -p:DarlingTestsWithoutViewer=true -v m -nologo

      # The whole suite in one test host. Only the failures and the summary are printed; the full output is in the artifact.
      - name: Run the suite
        timeout-minutes: 80
        shell: bash
        env:
          DARLING_TEST_PG: Host=127.0.0.1;Port=5541;Username=darling;Database=darlingtest
        run: |
          set -uo pipefail
          results="${RUNNER_TEMP}/darling-linux-suite"
          mkdir -p "${results}"
          dotnet Darling/Darling.Tests/bin/Release/net10.0/Darling.Tests.dll -noColor -trait- "Platform=Windows" \
            -xml "${results}/results.xml" > "${results}/output.log" 2>&1
          code=$?
          # grep exits 1 when nothing matches, which is the green run.
          grep -E '\[FAIL\]' "${results}/output.log" | head -n 200 || true
          grep -E 'Total: [0-9]+' "${results}/output.log" | tail -n 1 || true
          {
            echo '### Darling suite on Linux (report-only, #9686)'
            echo ''
            echo '```'
            grep -E 'Total: [0-9]+' "${results}/output.log" | tail -n 1 || echo "No summary line: the test host exited with ${code} before it finished."
            grep -E '\[FAIL\]' "${results}/output.log" | head -n 100 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${code}" != 0 ]; then
            echo "::error::The Darling suite on Linux exited with ${code}. The job is report-only (#9686)."
          fi
          exit "${code}"

      - name: Save the store log
        if: always()
        shell: bash
        run: docker logs darling-test-store > "${RUNNER_TEMP}/darling-linux-suite/store.log" 2>&1 || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: darling-linux-suite
          path: ${{ runner.temp }}/darling-linux-suite
          if-no-files-found: warn
          retention-days: 7
