name: Check pull request target branch
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
# This job only compares branch names. It checks out nothing and calls no API,
# so it gets no token permissions at all. It runs on pull_request, not
# pull_request_target: GitHub blocks pull_request_target by default in public
# repositories from 2026-12-02, and this job never needed its token.
permissions: {}
jobs:
  check-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ] && [ "$BASE_REF" == "main" ]; then
            echo "::error::Pull requests to main are only allowed from dev. Please target the dev branch instead."
            exit 1
          fi
