name: Diag 5596

# Temporary (#5596): finds what keeps the Darling.Tests process alive after the run returns. Runs the whole suite the
# way the whole-tree guards job does with DIAG_5596=1 (a module initializer in the test assembly then logs a heartbeat
# and the exit stages to a file), and when the runner prints "Waiting 10 seconds for foreground threads" takes a full
# memory dump with procdump (no diagnostics pipe needed) and prints every thread's managed stack. Removed before the
# fix PR merges.
on:
  push:
    branches: [fix/5596-foreground-threads]
    paths: ['.github/workflows/diag-5596.yml', 'Darling/Darling.Tests/Diag5596.cs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag (WPF switch ${{ matrix.wpfswitch }})
    strategy:
      fail-fast: false
      matrix:
        wpfswitch: [on, off]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore and build Darling.Tests
        run: |
          dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode
          dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore

      - name: Install dotnet-dump and procdump
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\diagtools" dotnet-dump
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\procdump" | Out-Null
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile "$env:RUNNER_TEMP\procdump.zip" -TimeoutSec 60
          Expand-Archive "$env:RUNNER_TEMP\procdump.zip" -DestinationPath "$env:RUNNER_TEMP\procdump" -Force
          Get-ChildItem "$env:RUNNER_TEMP\procdump" | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }

      - name: Run the suite and dump the process that lingers
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path Darling/Darling.Tests/bin/Release -Recurse -Filter Darling.Tests.exe | Select-Object -First 1).FullName
          Write-Host "exe: $exe"
          $out = Join-Path $env:RUNNER_TEMP 'suite-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'suite-err.txt'
          $beat = Join-Path $env:RUNNER_TEMP 'diag5596-heartbeat.txt'
          $env:DIAG_5596 = '1'
          if ('${{ matrix.wpfswitch }}' -eq 'off') {
              $rc = Join-Path (Split-Path $exe) 'Darling.Tests.runtimeconfig.json'
              (Get-Content $rc) | Where-Object { $_ -notmatch 'DoNotInvokeInWeakEventTableShutdownListener' } | Set-Content $rc
              Write-Host "switch removed from $rc (baseline run)"
          }
          Write-Host "runtimeconfig has switch: $((Get-Content (Join-Path (Split-Path $exe) 'Darling.Tests.runtimeconfig.json') -Raw) -match 'DoNotInvokeInWeakEventTableShutdownListener')"
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "started pid $($p.Id)"
          $dumped = $false
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $p.HasExited) {
              Start-Sleep -Milliseconds 100
              if (-not $dumped) {
                  $fs = [System.IO.File]::Open($out, 'Open', 'Read', 'ReadWrite')
                  $sr = New-Object System.IO.StreamReader($fs)
                  $text = $sr.ReadToEnd()
                  $sr.Dispose(); $fs.Dispose()
                  if ($text.Contains('Waiting 10 seconds for foreground threads')) {
                      $dumped = $true
                      Write-Host "wait line seen at $((Get-Date).ToUniversalTime().ToString('HH:mm:ss.fff')) UTC"
                      $dmp = Join-Path $env:RUNNER_TEMP 'lingering.dmp'
                      $pd = Start-Process -FilePath "$env:RUNNER_TEMP\procdump\procdump64.exe" -ArgumentList '-accepteula', '-ma', "$($p.Id)", $dmp -PassThru -NoNewWindow
                      if (-not $pd.WaitForExit(90000)) { Write-Host 'procdump timed out'; try { $pd.Kill() } catch {} }
                      Write-Host "procdump done at $((Get-Date).ToUniversalTime().ToString('HH:mm:ss.fff')) UTC, size $(if (Test-Path $dmp) { (Get-Item $dmp).Length } else { 'none' })"
                      if (Test-Path $dmp) {
                          Write-Host '::group::clrthreads and clrstack -all'
                          $da = Join-Path $env:RUNNER_TEMP 'analyze-out.txt'
                          $dae = Join-Path $env:RUNNER_TEMP 'analyze-err.txt'
                          $pa = Start-Process -FilePath "$env:RUNNER_TEMP\diagtools\dotnet-dump.exe" -ArgumentList 'analyze', $dmp, '-c', 'clrthreads', '-c', 'clrstack -all', '-c', 'exit' -PassThru -NoNewWindow -RedirectStandardOutput $da -RedirectStandardError $dae
                          if (-not $pa.WaitForExit(240000)) { Write-Host 'dotnet-dump analyze timed out'; try { $pa.Kill() } catch {} }
                          Get-Content $da -TotalCount 400 | ForEach-Object { Write-Host $_ }
                          Get-Content $dae -TotalCount 20 | ForEach-Object { Write-Host $_ }
                          Write-Host '::endgroup::'
                      }
                  }
              }
              if ($sw.Elapsed.TotalMinutes -gt 20) { Write-Host 'giving up'; Stop-Process -Id $p.Id -Force; break }
          }
          $p.WaitForExit()
          Write-Host "exit code $($p.ExitCode) after $($sw.Elapsed), now $((Get-Date).ToUniversalTime().ToString('HH:mm:ss.fff')) UTC"
          Get-Content $out | Select-String -Pattern 'Total:|\[FAIL\]|Waiting 10|FATAL' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Line }
          Get-Content $err -Tail 20 | ForEach-Object { Write-Host $_ }
          Write-Host '::group::heartbeat summary'
          if (Test-Path $beat) {
              $lines = Get-Content $beat
              $lines | Where-Object { $_ -notmatch 'handler: ' -and $_ -notmatch ' beat ' } | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
              Write-Host 'handlers by target:'
              $lines | Where-Object { $_ -match 'handler: ' } | ForEach-Object { ($_ -replace '^[0-9:.]+\s+','') } | Group-Object | Sort-Object Count -Descending | Select-Object -First 12 | ForEach-Object { Write-Host ("{0} x {1}" -f $_.Count, $_.Name) }
              Write-Host 'last beats:'
              $lines | Where-Object { $_ -match ' beat ' } | Select-Object -Last 4 | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min(300, $_.Length)) }
          } else { Write-Host 'no heartbeat file' }
          Write-Host '::endgroup::'
          exit 0
