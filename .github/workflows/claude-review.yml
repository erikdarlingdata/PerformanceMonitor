name: Claude Auto Review

# Reviews a pull request into dev, the one branch under `on:` below, but spends a full review only
# where one pays. A release pull request from dev into main gets no second review: its changes came
# into dev as pull requests, and those are where review happens. WHAT RUNS depends on the event, and
# the `decide` job makes that call once:
#   - opened, reopened, ready_for_review: a FULL review, at the tier described further down.
#   - a push (synchronize): at most ONE follow-up review after each full one. It runs on Sonnet
#     with 30 turns and covers only the commits since the commit the newest verdict reviewed. That
#     commit is compared with the pushed head FIRST, whatever kind the verdict is: only a head
#     that is ahead of it is skipped or given a follow-up (a follow-up after a full review, no
#     review after a follow-up). Everything else gets a FULL review: a push with no verdict yet
#     (the full review was cancelled or never ran), one whose reviewed commit is no longer an
#     ancestor of the head (a force-push), a re-run on the head the verdict already covers, a
#     verdict whose marker head does not fit its commit (below), and any read that fails. A
#     verdict with no `review-pass` line counts as full, so the push after it gets a follow-up.
#     Two more reads can change a push's answer. (1) A push that would get no review, because the
#     newest verdict is already a follow-up, gets a FULL one when another run of this workflow for
#     the pull request has not finished. After a follow-up only a full trigger (ready for review,
#     reopened, the label) starts a review, so that run may be a full review of an older head,
#     and its verdict would land with no later check to read it; this push's full review replaces
#     it through the concurrency group of the `review` job. A second push seconds after another
#     sees the first push's run unfinished and gets the full review as well; that cost is
#     accepted. (2) The step's last read: a push whose head is no longer the pull request's head
#     gets no review. A newer push replaced it and that push's run decides, and a review job from
#     this run could join the group after the newer one and cancel it. The other events skip that
#     read, because the review they asked for would be lost when the newer push answers with no
#     review.
#   - the `re-review` label: a FULL review on request. The review removes the label when it is
#     done. A push while the label is still on the pull request is also a full review, so a
#     request that a push cancelled is not lost and the label cannot get stuck.
#   - a draft, or any other label: no review, and no runner starts.
# Measured on 2026-10-02: a full-tier review (Opus, 120 turns) cost a median $7.53 and took 18
# minutes, a light-tier one about $0.64, and every push to every pull request, drafts included,
# started a full one. Rounds after the first found mostly comment accuracy, so the later pushes
# now get the cheap follow-up. Each review marks its kind and the head it reviewed in its body
# with a hidden `<!-- review-pass: full head=<sha> -->` or `<!-- review-pass: follow-up
# head=<sha> -->` line, which is what the next push reads. The head is the pull request's head
# when the run started. GitHub stamps a review with the head at the moment it is SUBMITTED (`gh pr
# review` sends no commit), so a review that runs while a push lands is stamped with the newer
# head, and a follow-up that started there would skip commits nobody reviewed. A verdict posted
# before the marker named a head has none, and its commit_id stands in. A marker's head is used
# only when the verdict's commit_id is that head or comes after it (a compare says identical or
# ahead). A head that is later than, diverged from or unknown beside the verdict's commit, or
# one that cannot be compared, does not fit it. The commit_id cannot stand in for that head
# either: it can name content that no review read (a force-push during the review, for one), so
# no commit is known to be reviewed, and the next push gets a FULL review, whatever kind the
# marker says.
#
# The review posts
# comments for its findings and ends every run with ONE formal verdict review (the VERDICT
# PROTOCOL in the prompt below): changes-requested when a finding is substantive, a comment
# review otherwise. The verdict's color lives in claude-review-guard.yml, not here: its verdict
# arm fails while the newest verdict is changes-requested, so a substantive finding shows as a
# failed check, which a branch rule can require, and not only as a comment (the #3470-#3473
# train shipped six findings in one night as comments that auto-merge outran; one was
# real). Since #3650 the job also fails ITSELF when the run submitted no verdict, with the cause and
# the result block's counts in its log -- a green here means a verdict exists, and the guard is the
# second line. The review keeps no transcript: the file the action writes stays on the runner, and
# the log carries only that file's result fields, never its message text, even with debug logging
# on (the review step pins ACTIONS_STEP_DEBUG to "false"). It no-ops cleanly until
# the CLAUDE_CODE_OAUTH_TOKEN repo secret is set, and on fork PRs (which do not receive secrets),
# so neither case shows a failed check.
#
# #3710: across several hundred PRs the verdict was LGTM on very nearly all of them, and every
# defect it missed that later surfaced (#3487, #3612, #3613, #3636, #3648, the Full-edition
# integer division) was found by behaviour, never by the review. The shape was structural, not
# lazy: the reviewer started every run with no memory of this repository's recurring defect
# shapes, read the diff beside the author's essay (so it checked consistency, not correctness),
# and could stop at "LGTM" with nothing to show for what it had checked. Four changes here, all
# in the prompt and the verdict check, none in the tool allowlist:
#   - .github/REVIEW-TRAPS.md -- one line per recurring shape with the PR that bit; the review
#     must say, for each trap the diff is near, whether it applies and why.
#   - A BLIND READ first: the prompt withholds the PR body (it interpolates only the repo, the PR
#     number and the tier; it never did carry the body) and forbids `gh pr view` until the
#     reviewer has read the diff, the changed files and their callers and written its own
#     account. Phase 2 reads the body and reports DIVERGENCE between the two accounts.
#   - The CALLERS RULE: every changed public signature or behaviour has its callers enumerated
#     with Grep, each judged still-holds or not.
#   - A STRUCTURED VERDICT: claims graded VERIFIED / UNVERIFIED / REFUTED, the riskiest lines and
#     the test that pins each, the traps considered, the divergence, a reviewer checklist, and a
#     one-line machine-readable ledger so a later pass can compute the miss rate against
#     post-merge defects. A bare "LGTM" is no longer a valid verdict: the verdict check below
#     fails the job when the newest verdict lacks the header or the ledger.
# Plus a model and a TIER: a paths-filter step routes changes to the shared libraries, the
# Darling Storage/Analysis/Service trees, Lite's service/MCP/database layers, install/ and every
# .sql file to a FULL pass (Opus, 1M context, 120 turns) and everything else (tests, docs, viewer
# XAML, wwwroot) to a LIGHT pass (Sonnet, 30 turns). Same prompt, same verdict contract, one
# review step -- the guard counts that step's conclusion and the bot's reviews, and neither
# accounting knows or cares which tier ran.
on:
  pull_request:
    # A draft gets no review: both jobs below skip while the pull request is a draft, and marking it
    # ready for review starts one. `labeled` is here for the `re-review` label alone; the decide job
    # skips every other label before a runner starts.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # Pull requests into dev only. A release pull request into main is not reviewed again.
    branches: [dev]

# No workflow-level `concurrency`, on purpose. A group at this level is entered by EVERY run the
# trigger above starts, including the ones that will skip, and with cancel-in-progress a skipping
# run cancels the review it found running: a `labeled` event for an unrelated label (this
# repository adds labels such as in-progress) would kill a paid review and then do nothing itself.
# The group lives on the `review` job instead, which only exists once the decision says a review
# is due. See there.

jobs:
  # THE ONE DECISION -- full, follow-up or skip -- is made here and nowhere else. The guard
  # (claude-review-guard.yml) does not repeat it: it reads what this run did (the review job ran, or
  # was skipped on purpose), and recomputing it there would be wrong anyway, because by the time the
  # guard looks, the review this run posted has changed the very history the decision reads. The
  # decision cannot move into a shared script, composite action or reusable workflow either:
  # claude-code-action runs only while THIS file matches the default branch's copy byte for byte, and
  # a file the pull request can edit would sit outside that check while steering the review job,
  # whose Claude step uses the OAuth token. The decision is a step of this file for that reason.
  decide:
    # No runner for a draft, or for a label other than re-review. The script below repeats both rules
    # in its first lines, so a dry run of it covers the whole table; this line only saves the runner.
    if: github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 're-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The one read of this workflow's own runs, which a push after a follow-up makes. Without
      # the scope that read is refused, and every such push would fall back to a full review.
      actions: read
      contents: read
      pull-requests: read
    env:
      # This job reads no secret. The flag only lets the step guard below skip cleanly when the
      # repository has no token (a fork pull request gets none either); the comparison is made
      # here, so the token's value never enters this job's environment.
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      pass: ${{ steps.pass.outputs.pass }}
      base: ${{ steps.pass.outputs.base }}
      # Set only for a follow-up, and only once the step has checked that `base` and `head` are both
      # 40-character hex SHAs: the review job puts the two into its claude_args.
      head: ${{ steps.pass.outputs.head }}
    steps:
      # Every input arrives through env:, never through a ${{ }} interpolation into the script text.
      # `re-review` appears as a literal in four places in this file (the decide job's `if`, the
      # HAS_LABEL expression below, the label-removal step, the RE_REVIEW value): rename it in all.
      - name: Decide the review pass
        id: pass
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The branch the head came from and this run's id, for the one read of the workflow's runs.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 're-review') }}
          RE_REVIEW: re-review
          # Author of every review the action leaves behind (the action's bot_name default).
          REVIEW_BOT: claude[bot]
        run: |
          set -euo pipefail
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # A read that fails must not turn into a SKIP: that is the direction that silently
          # under-reviews. It turns into a FULL review with the cause in the log, the same
          # fail-toward-thorough direction the tier step takes. The helper assigns to LOOKUP_OUT and
          # LOOKUP_ERR instead of being command-substituted, so a failing gh call cannot kill the step
          # under `set -e`, and stderr never lands in a value the callers compare.
          LOOKUP_OUT=''; LOOKUP_ERR=''
          lookup() {
            local errfile
            errfile=$(mktemp 2>/dev/null || echo /dev/null)
            if ! LOOKUP_OUT=$(gh api "$@" 2>"$errfile"); then
              LOOKUP_ERR=$(tr '\n' ' ' < "$errfile" 2>/dev/null || true)
              LOOKUP_ERR=${LOOKUP_ERR:-$LOOKUP_OUT}
              [ "$errfile" != /dev/null ] && rm -f "$errfile" || true
              return 1
            fi
            [ "$errfile" != /dev/null ] && rm -f "$errfile" || true
          }

          pass=''; base=''; reason=''; marker_note=''
          if [ "$DRAFT" = "true" ]; then
            pass=skip; reason="the pull request is a draft"
          elif [ "$ACTION" = "labeled" ] && [ "$LABEL" != "$RE_REVIEW" ]; then
            pass=skip; reason="the label '$LABEL' asks for nothing"
          elif [ "$ACTION" = "labeled" ]; then
            pass=full; reason="the '$RE_REVIEW' label asks for a full review"
          elif [ "$ACTION" != "synchronize" ]; then
            # opened, reopened and ready_for_review, and anything the trigger list may grow.
            pass=full; reason="the pull request was $ACTION"
          elif [ "$HAS_LABEL" = "true" ]; then
            # The label is a request that stays until a full review has answered it. A push that
            # cancelled the requested review must not lose it, and a stuck label cannot be added again.
            pass=full; reason="a push while the '$RE_REVIEW' label is still on the pull request"
          else
            # A push. Read the newest VERDICT by the review bot: a review with a body. The
            # inline-comment tool files each comment inside a review of its own with an EMPTY body, in
            # the same run and on the same commit as the verdict, so a run that died after posting
            # comments but before its verdict left carriers and no verdict, and that is not a
            # review of the pull request. The API returns reviews oldest-first and --paginate runs the
            # --jq once per page, so the newest is the last LINE of the stream.
            if ! lookup --paginate "repos/$R/pulls/$PR/reviews?per_page=100" \
                --jq '.[] | select(.user.login == env.REVIEW_BOT and .submitted_at != null
                                   and ((.body // "") | length) > 0)
                      | "\(.id)\t\(.commit_id // "")"'; then
              pass=full; reason="the reviews could not be read ($LOOKUP_ERR)"
            else
              newest=$(printf '%s\n' "$LOOKUP_OUT" | tail -n 1)
              if [ -z "$newest" ]; then
                # No verdict yet: its full review was cancelled or never ran.
                pass=full; reason="$REVIEW_BOT has posted no verdict on this pull request yet"
              else
                IFS=$'\t' read -r last_id last_commit <<<"$newest"
                if ! lookup "repos/$R/pulls/$PR/reviews/$last_id" --jq '.body // ""'; then
                  pass=full; reason="the newest verdict could not be read ($LOOKUP_ERR)"
                else
                  # The kind the verdict marked itself with, and the head it reviewed. The LAST matching
                  # line wins: the prompt puts it directly above the ledger at the end of the body. The
                  # reviewed commit is the marker's head when it has one and the verdict's commit_id
                  # fits it (below). GitHub stamps a review with the pull request's head at the moment
                  # it is submitted, so a review that ran while a push landed carries a commit_id newer
                  # than the head it read, and a follow-up that started there would skip commits nobody
                  # reviewed. A verdict posted before the marker named a head has none, and its
                  # commit_id stands in. A verdict with no marker at all (posted before the marker
                  # existed) counts as full.
                  #
                  # The verdict check in the review job fails a run whose marker is wrong, but the
                  # verdict stays on the pull request, so this step holds the marker's head against the
                  # one thing it can read: the verdict's own commit_id. The head is used only when that
                  # commit is the head or a descendant of it (compare says identical or ahead). A head
                  # later than the verdict's commit (behind) would leave the commits between the two out
                  # of every follow-up range, and one that diverged, is unknown to the repository, or
                  # cannot be compared (the read failed) names no commit this verdict can vouch for. The
                  # verdict's commit_id does not stand in for that head either: it can name content that
                  # no review read (after a force-push during the review, for one), and a read that fails
                  # is a full review. For each of those the reviewed commit is cleared, so the check
                  # below gives a full review whatever kind the marker says, and its reason is the
                  # marker note. A head equal to the commit_id needs no read, and a marker with no head
                  # keeps the handling above.
                  marker=$(printf '%s\n' "$LOOKUP_OUT" | tr -d '\r' \
                    | grep -E '^<!-- review-pass: (full|follow-up)( head=[0-9a-f]{40})? -->[[:space:]]*$' | tail -n 1 || true)
                  kind=''; reviewed=$last_commit
                  marker_re='^<!-- review-pass: (full|follow-up)( head=([0-9a-f]{40}))? -->'
                  if [[ "$marker" =~ $marker_re ]]; then
                    kind=${BASH_REMATCH[1]}
                    marker_head=${BASH_REMATCH[3]:-}
                    if [ -z "$marker_head" ]; then
                      : # no head in the marker: the commit_id stands in, and the kind is the marker's
                    elif [ "$marker_head" = "$last_commit" ]; then
                      reviewed=$marker_head
                    elif [ -z "$last_commit" ]; then
                      # Nothing to hold the head against. The reviewed commit stays empty, and the
                      # check below answers with a full review.
                      kind=full
                    elif ! lookup "repos/$R/compare/$marker_head...$last_commit?per_page=1" --jq '.status'; then
                      # The head cannot be held against the commit, so no commit is known to be reviewed.
                      # The check below answers with a full review, and the note is its reason.
                      kind=full; reviewed=''
                      marker_note="the marker's head ${marker_head:0:12} cannot be compared with the verdict's commit ${last_commit:0:12} ($LOOKUP_ERR), so no reviewed commit is known and this push gets a full review"
                    elif [ "$LOOKUP_OUT" = identical ] || [ "$LOOKUP_OUT" = ahead ]; then
                      reviewed=$marker_head
                    else
                      # Later than the verdict's commit, or diverged from it: the same answer.
                      kind=full; reviewed=''
                      marker_note="the marker's head ${marker_head:0:12} is not an ancestor of the verdict's commit ${last_commit:0:12} (compare says $LOOKUP_OUT), so no reviewed commit is known and this push gets a full review"
                    fi
                  fi
                  # The reviewed commit is compared with this head BEFORE the kind is looked at, so only a
                  # head that is ahead of it is ever skipped or given a follow-up.
                  if [ -z "$reviewed" ]; then
                    # The verdict names no commit, or its marker's head does not fit the commit it names
                    # (the marker note says so and is the reason). Either way no commit is known to be
                    # reviewed, so there is nothing for a follow-up to start from.
                    pass=full; reason="${marker_note:-the newest verdict names no commit}"
                  elif ! lookup "repos/$R/compare/$reviewed...$HEAD_SHA?per_page=1" --jq '.status'; then
                    # Unknown to the repository: a force-push dropped it.
                    pass=full; reason="the last-reviewed commit ${reviewed:0:12} cannot be compared with this head ($LOOKUP_ERR)"
                  elif [ "$LOOKUP_OUT" != "ahead" ]; then
                    # diverged (a force-push or rebase), behind, or identical (a re-run on a head that
                    # already has its verdict): not a range a follow-up can cover, and not one to skip
                    # either, whatever kind the verdict is. A re-run of a review that failed its shape
                    # check must produce a review, so identical is full.
                    pass=full; reason="the last-reviewed commit ${reviewed:0:12} is not an ancestor of this head (compare says $LOOKUP_OUT)"
                  elif [ "$kind" = follow-up ]; then
                    # At most ONE follow-up after each full review, so this push gets no review, unless
                    # another run of this workflow for this pull request has not finished. After a
                    # follow-up only a full trigger (ready for review, reopened, the label) starts a
                    # review, so that run may be a full review of an older head, and the verdict it posts
                    # would have no check left to read it. This push's full review replaces it through
                    # the concurrency group instead. A run is this pull request's when its list names the
                    # number; a run with none listed (the field is empty once a pull request closes) counts
                    # through the branch the query is limited to. This run is not counted. One page is
                    # enough: a run that has not finished is among the newest. A second push seconds after
                    # another sees that run too and gets a full review; that cost is accepted, so there is
                    # no waiting. A read that fails is a full review, as above.
                    if ! lookup -X GET "repos/$R/actions/workflows/claude-review.yml/runs" \
                        -f event=pull_request -f branch="$HEAD_REF" -f per_page=50 \
                        --jq '.workflow_runs[]
                              | select(.status != "completed" and (.id | tostring) != env.RUN_ID
                                       and (((.pull_requests // []) | length) == 0
                                            or any((.pull_requests // [])[]; (.number | tostring) == env.PR)))
                              | .status'; then
                      pass=full; reason="the runs of this workflow could not be read ($LOOKUP_ERR)"
                    elif [ -n "$LOOKUP_OUT" ]; then
                      IFS= read -r run_status <<<"$LOOKUP_OUT"
                      pass=full; reason="the newest verdict is already a follow-up, but another run of this workflow for this pull request has not finished ($run_status): it may be a full review of an older head, whose verdict would have no check left to read it, so this push gets a full review, which replaces it"
                    else
                      pass=skip; reason="the newest verdict is already a follow-up"
                    fi
                  else
                    pass=follow-up; base=$reviewed
                    reason="the newest verdict (${reviewed:0:12}) was a full review, so the commits since it get one follow-up"
                  fi
                fi
              fi
            fi
          fi

          # A push that a newer push has already replaced decides nothing. The newer push has a run of
          # its own, and that run decides; a review job from this run could join the concurrency group
          # after the newer one and cancel it. This is the step's last read, so the head it compares is
          # as fresh as the step can get. Pushes only: a newer push may answer with no review, and the
          # full review that opening, reopening, ready for review and the label asked for would be
          # lost with it. A read that fails keeps the decision.
          if [ "$ACTION" = "synchronize" ] && [ "$pass" != skip ]; then
            sha_re='^[0-9a-f]{40}$'
            if lookup "repos/$R/pulls/$PR" --jq '.head.sha'; then
              if [[ "$LOOKUP_OUT" =~ $sha_re ]] && [ "$LOOKUP_OUT" != "$HEAD_SHA" ]; then
                pass=skip; base=''
                reason="a newer push replaced this head (${HEAD_SHA:0:12}), and the run for ${LOOKUP_OUT:0:12} decides"
              fi
            else
              reason="$reason (the pull request's head could not be read again: $LOOKUP_ERR)"
            fi
          fi

          # The follow-up's two SHAs become the `git diff` forms the review job allows (its claude_args),
          # so they are checked here, in the step that produces them: both must be full 40-character hex
          # SHAs. The marker's head passed that test when it was read; the verdict's commit_id and this
          # run's head are checked now. A value that fails makes this a full review, which takes no range
          # and is allowed no `git diff`: the same fail-toward-thorough direction every read above takes.
          head_sha=''
          if [ "$pass" = follow-up ]; then
            sha_re='^[0-9a-f]{40}$'
            if [[ "$base" =~ $sha_re && "$HEAD_SHA" =~ $sha_re ]]; then
              head_sha=$HEAD_SHA
            else
              reason="the follow-up range (${base:0:12}..${HEAD_SHA:0:12}) is not two 40-character hex SHAs, so this push gets a full review"
              pass=full; base=''
            fi
          fi

          echo "review pass: $pass -- $reason"
          if [ "$pass" = skip ]; then
            echo "::notice title=No review - skipped on purpose::$reason."
          else
            echo "::notice title=Review pass - $pass::$reason."
          fi
          summary "### Review pass: $pass"
          summary "- $reason"
          if [ "$pass" = follow-up ]; then summary "- covers \`${base:0:12}..${HEAD_SHA:0:12}\`"; fi
          {
            echo "pass=$pass"
            echo "base=$base"
            echo "head=$head_sha"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: decide
    # Only a full or a follow-up pass reviews. A skipped decide job (a draft, another label, no
    # secret) leaves its outputs empty, so this job skips with it.
    if: needs.decide.outputs.pass == 'full' || needs.decide.outputs.pass == 'follow-up'
    # CONCURRENCY LIVES HERE, not on the workflow, so that only a run that reviews can cancel one:
    # a push cancels the review of the commits it supersedes. The group is unique for any other
    # pass, so even if a skipped job were to evaluate its group, it could not touch a running
    # review. The unique suffix is `cond && value || ''`, never `cond && '' || value`: the empty
    # string is falsy in an expression, and that form would hand every run the unique group.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}${{ needs.decide.outputs.pass != 'full' && needs.decide.outputs.pass != 'follow-up' && format('-skip-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Reviews are advisory and typically finish in minutes; a wedged run should release
    # its runner rather than sit on the default 6h timeout.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # The Claude step needs this scope. With no `github_token` input, claude-code-action asks the
      # runner for this run's OIDC token and exchanges it for the app token the review posts with
      # (claude[bot]); it stops when the token cannot be fetched (src/github/token.ts at v1).
      # Permissions are set per job, not per step, and this is the only job that has the scope.
      id-token: write
    env:
      # Only a flag reaches this job's environment. The step guards below use it to skip cleanly when
      # the repository has no token (a fork pull request gets none either), and the comparison is
      # made here, so the token's value is in no job-level environment. It reaches only the Claude
      # step, through that step's `claude_code_oauth_token` input.
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      # Both checkouts keep no credentials in .git/config (`persist-credentials: false`). Each fetches
      # with its own token input, and every later step that talks to GitHub carries a token of its own.
      - uses: actions/checkout@v7
        if: needs.decide.outputs.pass != 'follow-up'
        with:
          fetch-depth: 1
          persist-credentials: false

      # A follow-up diffs two commits and lists the ones between them, which a one-commit clone
      # cannot do. The whole history of the merge ref (the PR head is its second parent) holds both.
      - name: Check out the history a follow-up reads
        uses: actions/checkout@v7
        if: needs.decide.outputs.pass == 'follow-up'
        with:
          fetch-depth: 0
          persist-credentials: false

      # #3650: the verdict check at the bottom counts the bot's formal reviews submitted AFTER this
      # instant, so a verdict left by an earlier run on the same PR cannot vouch for this one. Read
      # once, here, before the action installs anything -- GitHub stamps submitted_at in the same
      # ISO-8601 UTC shape (2026-09-18T22:00:00Z), so the comparison below is a plain string one.
      - name: Open the verdict window
        id: window
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' }}
        run: echo "start=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      # #3710: which tier reviews this PR. The FULL set is where the traps file's defects live --
      # the shared libraries every product compiles against, the Darling store/analysis/service
      # trees (Compose and Mcp are under Service), Lite's service, MCP and database layers, the
      # install scripts, and every .sql file wherever it sits (upgrades/, tools/, fixtures) -- and
      # a change there gets Opus with the 1M context window, which the callers rule needs on a
      # large Storage diff. Everything else is the LIGHT tier. Same version-tag pinning as the
      # rest of this repo's actions (build.yml uses dorny/paths-filter@v4; nothing here is
      # SHA-pinned, so neither is this).
      #
      # Every pattern is `dir/**/!(*.md)`, the shape build.yml and darling-paths-filter.yml
      # already use and explain: dorny v4 evaluates each pattern as an INDEPENDENT predicate under
      # the default predicate-quantifier 'some', so a bare `!**/*.md` exclude would be its own rule
      # meaning "any non-markdown file anywhere" (PR #1714, run 30219202642: every area filter true
      # on a .gitignore edit). The markdown carve-out stays INSIDE the include, where quantifier
      # semantics cannot detach it. A README under Analysis/ is a light-tier change on purpose.
      #
      # continue-on-error, and the decision step below reads the OUTCOME: a filter that dies (an
      # API 503 listing the PR's files) must not silently become the light tier -- that is the
      # direction that under-reviews a Storage change. It degrades to FULL, with a warning naming
      # why. `all` is the counter the decision notice reports against; it can only ever be true.
      #
      # Only a FULL pass classifies: a follow-up always runs the light tier's model and turns (see
      # the tier step), because it reads a handful of new commits, not the pull request.
      - name: Classify the changed paths
        id: paths
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' && needs.decide.outputs.pass == 'full' }}
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            full:
              - 'PerformanceMonitor.Analysis/**/!(*.md)'
              - 'PerformanceMonitor.Collectors/**/!(*.md)'
              - 'PerformanceMonitor.Common/**/!(*.md)'
              # #3710 review: six of the traps file's own citations (#3612 #3618 #3625 #3628 #3636 #3644) live
              # in these two projects; a tier that reads them lightly would re-learn each one.
              - 'PerformanceMonitor.Alerting/**/!(*.md)'
              - 'PerformanceMonitor.Notifications/**/!(*.md)'
              - 'Darling/PerformanceMonitor.Darling.Storage/**/!(*.md)'
              - 'Darling/PerformanceMonitor.Darling.Analysis/**/!(*.md)'
              - 'Darling/PerformanceMonitor.Darling.Service/**/!(*.md)'
              - 'Lite/Services/**/!(*.md)'
              - 'Lite/Mcp/**/!(*.md)'
              - 'Lite/Database/**/!(*.md)'
              - 'install/**/!(*.md)'
              - '**/*.sql'
            all:
              - '**'

      # The ONE place the tier decision is made. The review step reads model, max_turns and tier
      # from here rather than repeating the expression three times, so the ledger line the prompt
      # asks for names the model that actually ran. Lists reach the notice through env:, never
      # through a ${{ }} interpolation into script text -- a PR author controls file names, and an
      # interpolated name is the pull_request script-injection footgun build.yml describes.
      #
      # The model ids are Claude Code's own catalog ids: `claude-opus-5[1m]` (the [1m] selector
      # opts into the 1M context window; claude-code-action's docs name Opus 5 and Sonnet 5 as
      # the models that carry it) and `claude-sonnet-5`, the Sonnet family's current id, spelled
      # out rather than left to the default so the ledger names it. No effort flag exists in
      # claude_args (#3710's ruling); the turn ceiling is the cost lever.
      - name: Decide the review tier
        id: tier
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' }}
        env:
          PASS: ${{ needs.decide.outputs.pass }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          FULL: ${{ steps.paths.outputs.full }}
          FULL_COUNT: ${{ steps.paths.outputs.full_count }}
          FULL_FILES: ${{ steps.paths.outputs.full_files }}
          ALL_COUNT: ${{ steps.paths.outputs.all_count }}
        run: |
          set -euo pipefail
          if [ "$PASS" = "follow-up" ]; then
            # The paths step did not run (only a full pass classifies), so its outcome says nothing
            # here. A follow-up reads a few new commits, and the cheap tier is what it is for.
            echo "::notice title=Follow-up review::A follow-up pass always runs the light tier's model and turns."
            tier=light
          elif [ "$PATHS_OUTCOME" != "success" ]; then
            echo "::warning title=Path classification failed - reviewing at the full tier::The paths-filter"\
              "step ended '$PATHS_OUTCOME', so this PR's files could not be classified. The review runs"\
              "at the FULL tier rather than guess light: under-reviewing a Storage change is the"\
              "expensive direction to be wrong in."
            tier=full
          elif [ "${FULL:-}" = "true" ]; then
            echo "::notice title=Full-tier review::${FULL_COUNT:-0} of ${ALL_COUNT:-0} changed files are in the full-tier set."
            echo "Changed files in the full-tier set: ${FULL_FILES:-[]}"
            tier=full
          else
            echo "::notice title=Light-tier review::None of the ${ALL_COUNT:-0} changed files are in the full-tier set (shared libraries, Darling Storage/Analysis/Service, Lite Services/Mcp/Database, install/, *.sql)."
            tier=light
          fi
          if [ "$tier" = full ]; then
            model='claude-opus-5[1m]'; max_turns=120
          else
            model='claude-sonnet-5'; max_turns=30
          fi
          echo "tier=$tier -- model=$model -- max_turns=$max_turns"
          {
            echo "tier=$tier"
            echo "model=$model"
            echo "max_turns=$max_turns"
          } >> "$GITHUB_OUTPUT"

      # The step NAME is read by claude-review-guard.yml (REVIEW_STEP) to tell a clean no-op from a
      # run that said nothing; renaming it blinds the guard. The id is for the steps below.
      #
      # The `|| 'full'` / `|| 'claude-opus-5[1m]'` / `|| '60'` fallbacks: if the tier step somehow
      # left an output empty, the review still runs, at the full tier -- the same fail-toward-
      # thorough direction the tier step takes -- instead of handing Claude Code `--model ""`.
      - name: Claude review
        id: review
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        # The action prints every message, tool results included, when ACTIONS_STEP_DEBUG is "true"
        # (base-action/src/parse-sdk-options.ts at v1). Pinned "false" here, the log keeps only the
        # result fields even on a run with debug logging turned on. show_full_output is left at its
        # default, "false".
        env:
          ACTIONS_STEP_DEBUG: 'false'
        with:
          # The one place the token's value is read: no other step, and no job-level environment,
          # holds it.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt interpolates the repo, the PR number, the tier and the model -- and NOT the
          # PR body or title. That is what makes the blind read blind: the body arrives only when
          # the reviewer runs `gh pr view` in Phase 2. Do not add the body here (#3710).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW PASS: ${{ needs.decide.outputs.pass }}
            REVIEW TIER: ${{ steps.tier.outputs.tier || 'full' }}
            MODEL: ${{ steps.tier.outputs.model || 'claude-opus-5[1m]' }}
            FOLLOW-UP RANGE: ${{ needs.decide.outputs.base && format('{0}..{1}', needs.decide.outputs.base, github.event.pull_request.head.sha) || 'none (this is a full review)' }}

            You are reviewing a pull request in a repository whose defects recur in known shapes and
            whose PR bodies are persuasive by design. The review runs in two phases, in this order,
            and the order is the point: you form your own account of the change BEFORE you read the
            author's, and the finding is where the two diverge.

            FOLLOW-UP PASS. This paragraph applies ONLY when REVIEW PASS above is `follow-up`; on a
            `full` pass skip it entirely. An earlier review already covered every commit up to the
            first SHA on the FOLLOW-UP RANGE line (BASE..HEAD, both full SHAs). The commits in that
            range are your ENTIRE scope: `git diff BASE HEAD` is the change (for one file's part of
            it, `git diff BASE HEAD -- <path>`; those two forms, with both SHAs written out in full
            and nothing else before the `--`, are the only `git diff` this run may use) and
            `gh pr view ${{ github.event.pull_request.number }} --json commits` lists the pull request's
            commits and their messages (find BASE in it by SHA; the commits after it are this range). The
            checkout holds the whole history, but its own HEAD is a merge of the pull request into
            its base branch, so always pass the two SHAs explicitly. Report defects in those
            commits, or defects they expose in code that did not change. Do NOT review unchanged
            code again. Do NOT repeat an earlier finding unless a new commit fails to fix it or makes
            it worse. Do NOT re-grade the PR body's claims about earlier commits. If the range
            includes a merge of the base branch, what that merge brought in is not the author's
            change: leave it alone unless a new commit interacts with it. This paragraph REPLACES
            PHASE 1 and PHASE 2 below: read the new diff and the files it changes in context, apply
            the CALLERS RULE and the traps file to what the new commits changed, and run
            `gh pr view ${{ github.event.pull_request.number }}` only for notes that explain them (and
            `gh pr view ${{ github.event.pull_request.number }} --comments` for the earlier reviews).
            Everything from POSTING on applies unchanged, and the verdict keeps the same shape, with
            its sections scoped to the new commits.

            PHASE 1 — BLIND READ. Do NOT run `gh pr view` in this phase: the PR body and the commit
            messages are the author's account, and you must form your own first. Allowed here: `gh pr diff ${{ github.event.pull_request.number }}` (and
            `--name-only`), Read, Grep, Glob. A full review runs no `git diff`: the checkout holds
            one commit, and `gh pr diff` is the diff. The PR branch is already checked out.
              1. Read the diff, then open every changed file and read each changed region in its
                 surrounding context — the whole method, class member or SQL statement, not the
                 hunk.
              2. CALLERS RULE. For every changed public signature, constant, SQL statement or
                 behaviour, Grep the repository for its callers and readers — both SKUs (Lite and
                 Darling) and both test projects — and, for each caller, decide whether it still
                 holds under the change. A caller you did not re-read is UNPINNED and is reported
                 as such.
              3. Read `.github/REVIEW-TRAPS.md`. For every trap whose layer or shape this diff is
                 near, decide whether it applies HERE and why. A trap that does not apply is stated
                 as not applying, with the file:line that proves it; a trap that applies is a
                 finding. Quote the trap in its own words.
              4. Write down, for yourself, before Phase 2: what the change does, what it could
                 break, the three riskiest changed lines, and which test (by name, found with Grep)
                 pins each of them — or that none does.
            Conventions to hold the code to: CONTRIBUTING.md, including its T-SQL style section (AS
            on table aliases, column_name = expression aliasing, OPTION(RECOMPILE) on collector
            queries); Lite/Darling parity — this repository ships two apps that must stay in
            parity, so a change to one without its counterpart is a finding; correctness at system
            boundaries (bugs, edge cases, null/error handling); security (input handling, SQL
            injection, secrets, file/network/process use); performance regressions. Do NOT suggest
            SQL Server missing-index DMV recommendations — they are folklore in this codebase and
            explicitly unwanted.

            PHASE 2 — THE AUTHOR'S ACCOUNT. Now run `gh pr view ${{ github.event.pull_request.number }}`
            for the title and body (and `gh pr view ${{ github.event.pull_request.number }} --json commits`
            for the commit messages if you want them).
            Extract every factual claim the body makes about the code — what changed, what did not,
            what was measured, what was tested, which test pins what — and grade each against what
            you found in Phase 1:
              - VERIFIED — you confirmed it from the tree; say how (file:line, test name, or the
                hunk).
              - UNVERIFIED — it could not be checked from a read-only tree (a live measurement, a
                rig result, a build); say what would have been needed.
              - REFUTED — the tree contradicts it; give the evidence.
            Then report DIVERGENCE: where the author's account and your blind read disagree, in
            either direction — a mechanism the body names that the diff does not implement, a
            change the diff makes that the body does not mention, a test the body cites that does
            not assert what the body says it does. Divergence is the finding; agreement between the
            body and the diff is not evidence of correctness.

            POSTING. Use `gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'EOF'` (the note, then a
            line with EOF) for top-level notes and
            `mcp__github_inline_comment__create_inline_comment` (with confirmed: true) for
            line-level findings. Only post GitHub comments and reviews — do not emit review text
            as plain messages.

            GH COMMANDS. Every `gh` command this run may use is one of these, exactly, where N is
            ${{ github.event.pull_request.number }}: `gh pr diff N`, `gh pr diff N --name-only`, `gh pr view N`,
            `gh pr view N --json commits`, `gh pr view N --comments`, and the three posts
            `gh pr comment N --body-file -`, `gh pr review N --comment --body-file -` and
            `gh pr review N --request-changes --body-file -`, each followed by a quoted heredoc
            (`<<'EOF'`). Any other flag, a body given with `--body`, or an unquoted heredoc is
            refused.

            VERDICT PROTOCOL — ALWAYS POST a verdict, in the STRUCTURED SHAPE below. After every
            comment is posted, end the review by submitting exactly ONE formal GitHub review whose
            body is the block below, filled in. A bare "LGTM" is not a verdict: the job checks the
            newest review for the `## Verdict:` header and the ledger line and fails without them.
            - Any substantive finding — a correctness bug, a security hole, a data-integrity risk,
              a REFUTED claim, a trap that applies, or a violation of a contract the code is
              supposed to keep — means:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file - <<'EOF'
                ...the block, with `## Verdict: CHANGES REQUESTED` and `verdict=CHANGES_REQUESTED`...
                EOF
            - Otherwise:
                gh pr review ${{ github.event.pull_request.number }} --comment --body-file - <<'EOF'
                ...the block, with `## Verdict: LGTM` and `verdict=LGTM`...
                EOF
            Substantive explicitly does NOT include style nits, observations you yourself label
            non-blocking, or tradeoffs the code or the PR body already documents as deliberate:
            those stay comments, and the verdict is the clean one. Never use --approve — this token
            cannot approve without an org setting this repo does not enable, and no gate needs it.
            The guard's rule is newest-verdict-wins: on a re-review after new commits, review the
            NEW diff and submit a fresh verdict, and a clean fresh verdict clears an earlier
            changes-requested by itself.

            THE REVIEW BODY, exactly this shape. The `## Verdict:` line is the first line; the
            `### ` headings are read by a machine and appear in this order; the ledger is the LAST
            line and is ONE line, and the review-pass line sits directly above it. Replace every
            <...>; keep every heading even when its section is empty, and say so under it.

            ## Verdict: LGTM
            ### Claims
            - VERIFIED — <claim from the PR body> — <how: file:line, test name, or the hunk>
            - UNVERIFIED — <claim> — <why it could not be checked from a read-only tree>
            - REFUTED — <claim> — <evidence>
            ### Riskiest lines
            1. <file:line> — <why this line> — pinned by <test name> | UNPINNED
            2. <file:line> — <why> — pinned by <test name> | UNPINNED
            3. <file:line> — <why> — pinned by <test name> | UNPINNED
            ### Traps near this diff
            - <the trap, quoted from .github/REVIEW-TRAPS.md> — applies | does not apply — <why, with file:line>
            ### Divergence (blind read vs PR body)
            <where the two accounts disagree, or: None — the body's account matches the diff on every claim graded above.>
            ### Reviewer checklist
            - [ ] <what a human should check by hand that a read-only tree could not: a live read, a build, a rig, a production page>
            <!-- review-pass: ${{ needs.decide.outputs.pass }} head=${{ github.event.pull_request.head.sha }} -->
            <!-- review-ledger: verdict=LGTM verified=<N> unverified=<N> refuted=<N> traps=<N> tier=${{ steps.tier.outputs.tier || 'full' }} model=${{ steps.tier.outputs.model || 'claude-opus-5[1m]' }} -->

            Ledger arithmetic: verified / unverified / refuted are the bullet counts under Claims
            in each state; traps is the bullet count under Traps near this diff; verdict matches
            the header (`LGTM`, or `CHANGES_REQUESTED` for a changes-requested review); tier and
            model are the REVIEW TIER and MODEL lines at the top of this prompt, verbatim. The
            review-pass line is the REVIEW PASS value from the top of this prompt and the head SHA
            this review started on, written exactly as the shape above writes it, `head=` included:
            the next push reads it to decide what it gets, and a follow-up starts after that SHA,
            so a wrong or missing one costs a review or hides one, and the verdict check fails the
            job when the line differs.
          # #3650: the prompt above says the branch is checked out and asks for a correctness,
          # parity and security review -- an invitation to read code -- while the allowlist used to
          # permit only the four gh verbs and the inline-comment tool. Every Read, Grep, Glob and
          # git call the reviewer reached for was a permission denial, and the swallowed runs' own
          # result blocks put the ratio on record: 50 turns / 18 denials, 39 / 21, 18 / 17, each
          # ending subtype=success with NOTHING posted. After enough denials the session ends
          # without ever reaching the verdict protocol, so a paid run leaves no trace (three PRs,
          # about thirteen runs, one night). Read-only tools are enough: the reviewer needs to open
          # the files the diff touches, find a symbol's other callers and read a parity twin, and
          # nothing about reviewing needs a write. Nothing here can edit, commit, push or post
          # outside the gh forms listed (see the gh rules below); the one git verb is `git diff`, and
          # it takes only a follow-up's range (see the git rules below).
          #
          # #3710 adds no tool. The callers rule is Grep; the traps file is Read; the blind read is
          # an ORDERING of the gh verbs already here, enforced by instruction and by the prompt
          # withholding the body. The structured verdict is posted through `gh pr review
          # --body-file -` with a quoted heredoc -- one of the exact `gh pr review` forms the
          # allowlist grants, and no Write tool is needed to stage a body file. --model and
          # --max-turns are the tier's; both are plain claude_args per claude-code-action's
          # docs/configuration.md ("Custom Model", "Limiting Conversation Turns").
          #
          # The gh rules are exact commands with this pull request's number, the forms the prompt
          # names: the diff, with or without --name-only; the view, its commits and its comments; and
          # the three posts, which read their body from standard input (`--body-file -` with a quoted
          # heredoc). A rule with no `*` matches only that command, so no other flag or argument
          # reaches gh. The number is the event's own integer.
          #
          # The git rules take only the forms the review runs. A full review needs no `git diff` (it
          # reads `gh pr diff` and works from a one-commit checkout), so it gets none. A follow-up gets
          # two forms, with its range written into them by the expression in --allowedTools:
          # `git diff BASE HEAD`, which takes no argument after it, and `git diff BASE HEAD -- *`,
          # where every argument after `--` is a pathspec. The two SHAs fill the first two arguments.
          # Both come from the decide job, which sets them only when each is a 40-character hex SHA.
          # The allowlist has no `git log` or `git show` rule: `gh pr view --json commits` carries the
          # commit messages, and Read reads the checked-out files. The other two values interpolated
          # here, the model and the turn limit, are constants the tier step writes.
          #
          # --disallowedTools: Claude Code's permissions page ("Read and Edit") documents `Read` deny
          # rules with a path: `Read(./secrets/**)`, and `//path` for an absolute one. They apply to
          # the Read tool and, as a best effort, to Grep and Glob, and a deny rule wins over an allow
          # rule. The CLI reference and the settings reference say `--disallowedTools` carries such
          # rules, and the action passes the flag through (base-action/src/parse-sdk-options.ts at
          # v1 comma-splits the values and merges them into the SDK's disallowedTools). `./` is the
          # directory Claude runs in: the action's run step sets no working directory, so that is the
          # workspace root, where actions/checkout puts the tree. So the file tools do not read the
          # checkout's .git directory or /proc, though the allowlist grants Read, Grep and Glob.
          claude_args: |
            --model "${{ steps.tier.outputs.model || 'claude-opus-5[1m]' }}"
            --max-turns ${{ steps.tier.outputs.max_turns || '120' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff ${{ github.event.pull_request.number }}),Bash(gh pr diff ${{ github.event.pull_request.number }} --name-only),Bash(gh pr view ${{ github.event.pull_request.number }}),Bash(gh pr view ${{ github.event.pull_request.number }} --json commits),Bash(gh pr view ${{ github.event.pull_request.number }} --comments),Bash(gh pr comment ${{ github.event.pull_request.number }} --body-file -),Bash(gh pr review ${{ github.event.pull_request.number }} --comment --body-file -),Bash(gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file -),Read,Grep,Glob${{ needs.decide.outputs.base && needs.decide.outputs.head && format(',Bash(git diff {0} {1}),Bash(git diff {0} {1} -- *)', needs.decide.outputs.base, needs.decide.outputs.head) || '' }}"
            --disallowedTools "Read(./.git/**),Read(//proc/**)"

      # #3650: a review that posted nothing used to finish GREEN. The prompt mandates one formal
      # review per run -- changes-requested on a substantive finding, a clean comment review
      # otherwise -- so on this repo a run that submitted no verdict has broken its contract every
      # time; a clean review is never silent, and a zero here is never legitimate. This step turns
      # that into the job's own colour, with the diagnosis in the log, so the guard (#2229/#3492, the
      # check that enforces newest-verdict-wins and the drift arm) becomes the second line rather
      # than the first. Counted: reviews by the bot, submitted inside this run's
      # window, with a NON-EMPTY body. The body test is load-bearing: the inline-comment tool files
      # each comment inside a review of its own with an empty body (#3647 carried four bot reviews,
      # two of them bodiless carriers), and both verdict shapes must carry one (gh and the API both
      # refuse a bodiless comment/changes-requested review) -- so "posted inline notes, never a
      # verdict" is the #3470 shape and fails here, as it should.
      # Two runs end with zero verdicts and both are defects on this repo, told apart by whether
      # Claude ran at all: the action exits SUCCESS in seconds without running when this file
      # differs from the default branch's copy (cause 1 in the guard's header), and then it sets no
      # execution_file and writes no transcript. Expected on a PR that edits this file; a repo-wide
      # outage otherwise -- the guard grades which, because it can read the PR's file list from a
      # workflow that is free to change. The step's own outcome is left to speak for itself when it
      # is not success (a failed step already reds the job; a cancelled one is a superseded push).
      # A gh lookup failure is NOT a verdict on the review (#2309): it warns and stands down rather
      # than forcing a paid re-run of the whole job to clear a transient API error -- the guard's
      # own tally, a separate and free-to-rerun workflow, stays the enforcement.
      #
      # #3710: a verdict that EXISTS is no longer enough; it has to have the structured shape. The
      # bare "LGTM — <one line>" this prompt used to ask for was the whole problem the issue names:
      # a verdict with no record of what was checked, indistinguishable from one that checked
      # nothing, and useless to a later pass computing the miss rate. So the newest verdict in the
      # window (last line of the stream -- the API returns oldest-first and --paginate runs --jq per
      # page, so the newest is the last LINE, as the guard's scan already relies on) is fetched by
      # id and its body must carry (a) the `## Verdict: LGTM | CHANGES REQUESTED` header, (b) the
      # `<!-- review-ledger: ... -->` line, and (c) a ledger verdict that AGREES with the review's
      # API state -- `verdict=CHANGES_REQUESTED` on a CHANGES_REQUESTED review, `verdict=LGTM` on a
      # COMMENTED one. (c) is the one that protects the gate: the guard reads the STATE, so a body
      # that says "CHANGES REQUESTED" inside a review submitted with --comment is a substantive
      # finding the guard would wave through. A review lacking any of the three fails this job
      # with the missing piece named; the guard's own verdict arm is untouched and still keys on
      # the state, so the two checks stay compatible by construction -- this one is stricter about
      # the body, the guard is authoritative about the state. The section headings are listed in
      # the log for the record and not graded: a mark that fails on a heading's wording is one
      # people learn to ignore, and the ledger is what the later pass computes from.
      - name: Verify the review posted a verdict
        if: ${{ always() && env.HAS_OAUTH_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.window.outputs.start }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          # Set by the action only after Claude actually ran; empty when it refused at validation.
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          # Author of every artifact the review leaves behind (the action's bot_name default).
          REVIEW_BOT: claude[bot]
          # What the tier step decided, to cross-check the ledger's own tier claim (a warning,
          # not a failure: a mislabelled tier does not compromise the verdict, only the ledger).
          TIER: ${{ steps.tier.outputs.tier }}
          # The pass the decide job chose and the head this run started on; the verdict's review-pass
          # line must say both, because the next push reads that line to decide what it gets and where
          # its follow-up starts.
          PASS: ${{ needs.decide.outputs.pass }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "$REVIEW_OUTCOME" != "success" ]; then
            echo "::notice title=Verdict check skipped::The review step ended '$REVIEW_OUTCOME'; its own"\
              "outcome carries the story, so this step has nothing to add."
            exit 0
          fi

          transcript="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"

          errfile=$(mktemp 2>/dev/null || echo /dev/null)
          if ! matched=$(gh api --paginate "repos/$R/pulls/$PR/reviews?per_page=100" \
              --jq ".[] | select(.user.login == env.REVIEW_BOT
                              and .submitted_at != null
                              and .submitted_at >= env.SINCE
                              and ((.body // \"\") | length) > 0)
                     | \"\\(.state)\\t\\(.submitted_at)\\t\\(.id)\\t\\(.html_url)\"" 2>"$errfile"); then
            err=$(cat "$errfile" 2>/dev/null || true)
            [ "$errfile" != /dev/null ] && rm -f "$errfile" || true
            echo "::warning title=Verdict check could not read the PR's reviews::gh api"\
              "repos/$R/pulls/$PR/reviews failed: ${err:-no stderr}. A lookup failure is not a"\
              "review verdict (#2309), so the review is UNCONFIRMED here; the guard's own tally"\
              "decides, or read the PR by eye."
            summary "- Verdict check: lookup failed; review UNCONFIRMED (#2309)."
            exit 0
          fi
          [ "$errfile" != /dev/null ] && rm -f "$errfile" || true

          count=$(printf '%s' "$matched" | grep -c . || true)
          echo "verdict reviews by $REVIEW_BOT on PR #$PR since $SINCE: $count"
          if [ -n "$matched" ]; then printf '%s\n' "$matched"; fi

          if [ "$count" -gt 0 ]; then
            summary "### Claude review posted $count verdict review(s) since $SINCE"

            # #3710: THE SHAPE CHECK, on the newest verdict in the window. A single-review fetch
            # rather than carrying bodies through the TSV above: bodies hold tabs and newlines. A
            # failure of THIS lookup is the #2309 shape too -- warn and stand down, the verdict
            # exists and the guard has the state.
            newest=$(printf '%s\n' "$matched" | tail -n 1)
            IFS=$'\t' read -r verdict_state _ verdict_id verdict_url <<<"$newest"
            errfile=$(mktemp 2>/dev/null || echo /dev/null)
            if ! body=$(gh api "repos/$R/pulls/$PR/reviews/$verdict_id" --jq '.body // ""' 2>"$errfile"); then
              err=$(cat "$errfile" 2>/dev/null || true)
              [ "$errfile" != /dev/null ] && rm -f "$errfile" || true
              echo "::warning title=Verdict shape check could not read the verdict::gh api"\
                "repos/$R/pulls/$PR/reviews/$verdict_id failed: ${err:-no stderr}. The verdict"\
                "exists ($verdict_url) and the guard reads its state; its SHAPE is UNCONFIRMED here (#2309)."
              summary "- Verdict shape: lookup failed; UNCONFIRMED (#2309). $verdict_url"
              exit 0
            fi
            [ "$errfile" != /dev/null ] && rm -f "$errfile" || true

            # CRs stripped: a body typed through a Windows client can carry them, and the anchors
            # below are line-anchored.
            body=$(printf '%s' "$body" | tr -d '\r')
            header=$(printf '%s\n' "$body" | grep -E -m1 '^## Verdict: (LGTM|CHANGES REQUESTED)[[:space:]]*$' || true)
            ledger=$(printf '%s\n' "$body" | grep -E -m1 '^<!-- review-ledger: verdict=(LGTM|CHANGES_REQUESTED) verified=[0-9]+ unverified=[0-9]+ refuted=[0-9]+ traps=[0-9]+ tier=(full|light) model=[^[:space:]]+ -->[[:space:]]*$' || true)
            sections=$(printf '%s\n' "$body" | grep -E '^### ' | tr '\n' ';' || true)
            marker=$(printf '%s\n' "$body" | grep -E '^<!-- review-pass: (full|follow-up)( head=[0-9a-f]{40})? -->[[:space:]]*$' | tail -n 1 | sed -E 's/[[:space:]]+$//' || true)
            expected_marker="<!-- review-pass: $PASS head=$HEAD_SHA -->"
            echo "newest verdict: $verdict_state $verdict_url"
            echo "  header: ${header:-<missing>}"
            echo "  ledger: ${ledger:-<missing>}"
            echo "  pass marker: ${marker:-<missing>} (expected: $expected_marker)"
            echo "  sections: ${sections:-<none>}"

            missing=''
            [ -z "$header" ] && missing="$missing the '## Verdict: LGTM | CHANGES REQUESTED' header;"
            [ -z "$ledger" ] && missing="$missing the '<!-- review-ledger: ... -->' line;"
            [ "$marker" != "$expected_marker" ] && missing="$missing the '$expected_marker' line (found: ${marker:-none});"
            if [ -n "$header" ] && [ -n "$ledger" ]; then
              ledger_verdict=$(printf '%s' "$ledger" | sed -E 's/.*verdict=([A-Z_]+).*/\1/')
              case "$verdict_state:$ledger_verdict" in
                CHANGES_REQUESTED:CHANGES_REQUESTED|COMMENTED:LGTM) ;;
                *) missing="$missing a ledger verdict ($ledger_verdict) that agrees with the review's state ($verdict_state);" ;;
              esac
              ledger_tier=$(printf '%s' "$ledger" | sed -E 's/.*tier=([a-z]+).*/\1/')
              if [ -n "$TIER" ] && [ "$ledger_tier" != "$TIER" ]; then
                echo "::warning title=Ledger tier disagrees with the tier step::The ledger says"\
                  "tier=$ledger_tier; this run decided tier=$TIER. The verdict stands; the ledger's"\
                  "tier is wrong for the later pass that reads it."
              fi
            fi

            if [ -z "$missing" ]; then
              echo "::notice title=Structured verdict present::$verdict_state -- $verdict_url"
              summary "- newest verdict: $verdict_state, structured (header + ledger agree with the state) -- $verdict_url"
              exit 0
            fi

            echo "::error title=Review posted an unstructured verdict::The newest verdict by"\
              "$REVIEW_BOT on PR #$PR ($verdict_url) lacks:$missing The prompt promises a"\
              "structured verdict every run -- claims graded VERIFIED/UNVERIFIED/REFUTED, the"\
              "riskiest lines and their pins, the traps considered, the divergence from the PR body,"\
              "and a one-line ledger -- because a bare LGTM is what this review posted on several"\
              "hundred PRs while every defect it missed was found by behaviour (#3710). An"\
              "unstructured verdict is a contract breach, not a clean review: it records nothing"\
              "about what was checked and cannot be told from a review that checked nothing. Do"\
              "NOT read this PR as reviewed; re-run the review workflow. The guard reads the"\
              "verdict's STATE and is not affected by this failure."
            summary "- newest verdict is UNSTRUCTURED: missing$missing Not reviewed (#3710). $verdict_url"
            exit 1
          fi

          summary '### Claude review posted NO verdict'

          if [ -z "$EXECUTION_FILE" ] && [ ! -s "$transcript" ]; then
            echo "::error title=Claude never ran::claude-code-action exited success without running"\
              "Claude -- no execution file, no transcript. That is what it does when this branch's"\
              ".github/workflows/claude-review.yml differs from the default branch's copy (#2229,"\
              "cause 1). Expected on a PR that edits this file; on any other PR it means the file"\
              "has drifted and EVERY PR in the repo is going unreviewed -- see the guard's verdict"\
              "on this PR. Either way, do not read this PR as reviewed."
            summary '- Claude never ran (workflow validation refused). Not reviewed.'
            exit 1
          fi

          echo "::error title=Review ran and posted no verdict::The review ran and posted no"\
            "verdict: $REVIEW_BOT submitted no formal review on PR #$PR since $SINCE, and the"\
            "prompt promises one every run even when clean. Real money was spent and the output"\
            "vanished (#3650; the #2229 failure shape). Do NOT read this PR as reviewed. The"\
            "review keeps no transcript; the counts from its result block follow."
          summary '- The review ran and submitted no formal review. Not reviewed (#3650).'
          if [ -s "$transcript" ]; then
            # Result fields only (type, subtype, counts, the names of the denied tools): no message
            # text and no tool input is printed, and nothing is uploaded; the file holds the whole
            # conversation and stays on the runner. The file's result message carries the denials as a
            # list (the action's own log derives the count from it), so the count is taken from it here.
            echo "--- result block of $transcript (fields only) ---"
            jq -c '.[-1] | {type, subtype, is_error, num_turns,
                            permission_denials_count: ((.permission_denials // []) | length),
                            total_cost_usd, duration_ms,
                            denied: [.permission_denials[]? | .tool_name]}' "$transcript" \
              2>/dev/null || true
          else
            echo "(no transcript at $transcript)"
          fi
          exit 1

      # The `re-review` label is a request, and a request that has been answered goes away: a stuck
      # label cannot be added again, so it could never ask twice. Removed only after a FULL review
      # whose verdict passed the shape check above (success() covers every step before this one), and
      # only when the label is on the pull request. The job's existing pull-requests: write covers
      # DELETE /issues/{n}/labels/{name} (GitHub lists it under the Pull requests permission), so no
      # permission is added. A label that is already gone is a 404 and not a failure.
      - name: Clear the re-review label
        if: ${{ success() && needs.decide.outputs.pass == 'full' && (github.event.label.name == 're-review' || contains(github.event.pull_request.labels.*.name, 're-review')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          errfile=$(mktemp 2>/dev/null || echo /dev/null)
          if gh api -X DELETE "repos/$R/issues/$PR/labels/re-review" --silent 2>"$errfile"; then
            echo "::notice title=re-review label cleared::The full review is done, so the request is answered."
          else
            err=$(cat "$errfile" 2>/dev/null || true)
            echo "::warning title=re-review label not cleared::gh api DELETE labels/re-review failed: ${err:-no stderr}. Remove the label by hand if it is still on the pull request."
          fi
          [ "$errfile" != /dev/null ] && rm -f "$errfile" || true
