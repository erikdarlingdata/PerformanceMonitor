name: PR CI fork result

# #8188: a pull request from a fork runs PR CI with a read-only token, so its CI verdict job cannot write `CI result`, the commit
# status the dev branch rule requires, and the pull request stays blocked however green its run is. This workflow runs in this
# repository's context when a PR CI run completes, or when a maintainer dispatches it with a run id, reads that run's facts from
# the API, and writes `CI result` on the run's head commit.
#
# The design limit, stated once: a fork's run builds and runs the fork's own tests, so its verdict is the fork's own by
# construction. The relay vouches that the fork's own run concluded success and that a maintainer approved that exact commit; it
# does not vouch for the tests being honest. So `success` needs both, a green run without an approval is `pending`, and a push
# after an approval needs a new approval (the review must be on the head commit itself).
#
# What keeps a fork's code away from the write token:
# - the only checkout is this repository's default branch at github.sha (the commit GitHub started this workflow from), never the
#   pull request's head; nothing of the run is downloaded, built or executed;
# - every fact comes from the GitHub API (fork-ci-result.py): the finished run's jobs and conclusion, the open pull requests at its
#   head commit, their changed files, the newer runs at that commit, the reviews, and each approving reviewer's permission on this
#   repository. Nothing the run wrote (logs, artifacts, outputs) is read;
# - the status is written only for a pull_request run of pr.yml from a fork whose head commit is still the pull request's head,
#   that changes no file the run executes or reads to decide what runs (a run takes the pull request's own copies of PR CI, the
#   CI scripts, the path filters, the build pins and the project files, so such a verdict is the fork's own and is not vouched for;
#   the list is in fork-ci-result.py), and that no newer PR CI run has replaced. `failure` for any conclusion but success, of
#   the verdict job or of the run; `success` only with a maintainer's approval of that commit; `pending` otherwise;
# - untrusted fields (the branch name, the head repository) reach no `run:` line: the script reads them from the event payload
#   and passes them to gh as arguments, and the write step takes the sha, the state and the run id from the script's outputs, not
#   the event, and checks each against a fixed pattern.
#
# GitHub starts a workflow_run workflow from the default branch's copy of this file, so the relay works once main carries it.
# The dispatch is for the usual order of events: CI finishes green, the relay writes `pending`, a maintainer reviews and approves
# the head commit, then runs this workflow with the PR CI run's id and the relay writes `success`. Only a user with write access
# can dispatch, and the dispatched workflow is the default branch's copy too.

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of the completed PR CI run to relay (the number in its URL)
        required: true
        type: string

permissions:
  contents: read # the checkout of this repository's default branch, for the decision script
  statuses: write # the one write: `CI result` on the head commit
  pull-requests: read # the open pull requests at the run's head commit, their changed files and their reviews
  actions: read # the finished run, its jobs, and whether a newer run exists

jobs:
  relay:
    name: Relay the fork's CI result
    # A run from this repository writes its own CI result; the script repeats this check and the rest of the decision.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No ref: on workflow_run, github.sha is the default branch's commit, so this is this repository's code, never the fork's.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide from the finished run's facts
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I .github/scripts/fork-ci-result.py --event "${GITHUB_EVENT_PATH}" --github-output "${GITHUB_OUTPUT}"

      - name: Set CI result on the head commit
        if: steps.decide.outputs.write == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.decide.outputs.sha }}
          STATE: ${{ steps.decide.outputs.state }}
          DESCRIPTION: ${{ steps.decide.outputs.description }}
          RUN_ID: ${{ steps.decide.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error title=CI result not set::The decision named no commit sha."; exit 1; }
          [[ "${STATE}" =~ ^(success|failure|pending)$ ]] || { echo "::error title=CI result not set::The decision named no state."; exit 1; }
          [[ "${RUN_ID}" =~ ^[0-9]{1,20}$ ]] || { echo "::error title=CI result not set::The decision named no run id."; exit 1; }
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="${STATE}" -f context='CI result' \
            -f description="${DESCRIPTION:0:140}" -f target_url="${target_url}" > /dev/null
          echo "CI result set to ${STATE} on ${SHA}."
