name: Build

# Throwaway proof workflow for #5603 (closed unmerged). The setup steps below are copied from the
# darling-pg job of .github/workflows/build.yml: same runner, same PostgreSQL 18 + TimescaleDB runtime,
# same cluster settings. Then a CPU burner runs for the job's life and AggregateJobQuiesceLiveTests runs
# 10 times per shard, counting passes and failures.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  proof:
    name: Proof ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Same cache key the release job and nightly.yml use (the fetch script's own content hash), so
      # a warm cache from any of the three means no ~340MB EDB/TimescaleDB download here.
      - name: Cache Darling pg-runtime.zip
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip (cache miss only)
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Extract pg-runtime
        shell: pwsh
        run: |
          $zip  = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime.zip"
          $dest = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          if (-not (Test-Path "$dest\pgsql\bin\pg_ctl.exe")) { throw "pg-runtime missing pgsql\bin\pg_ctl.exe" }

      - name: Restore Darling.Tests
        run: dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode

      - name: Build Darling.Tests
        run: dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore

      - name: Initialize and start throwaway PostgreSQL
        shell: pwsh
        run: |
          $bin     = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          $dataDir = "$env:RUNNER_TEMP\darling-pgdata"
          $logFile = "$env:RUNNER_TEMP\darling-pg.log"
          & "$bin\initdb.exe" -D $dataDir -U darling -A trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw "initdb failed ($LASTEXITCODE)" }
          Add-Content -Path "$dataDir\postgresql.conf" -Value "shared_preload_libraries = 'timescaledb,pg_stat_statements'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "port = 5541"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "listen_addresses = '127.0.0.1'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "timescaledb.max_background_workers = 74"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "max_worker_processes = 85"
          # #5549: the session id (%c) on every line. A PID alone cannot say whether two lines came from one
          # session (a pooled connection reused by the next test) or from two (Windows reuses a PID quickly).
          Add-Content -Path "$dataDir\postgresql.conf" -Value "log_line_prefix = '%m [%p] %c '"
          & "$bin\pg_ctl.exe" -D $dataDir -l $logFile -w start
          if ($LASTEXITCODE -ne 0) { if (Test-Path $logFile) { Get-Content $logFile -Tail 50 }; throw "pg_ctl start failed ($LASTEXITCODE)" }
          & "$bin\createdb.exe" -h 127.0.0.1 -p 5541 -U darling darling
          if ($LASTEXITCODE -ne 0) { throw "createdb failed ($LASTEXITCODE)" }

      - name: Start the CPU burners (one per logical processor, for the job's life)
        shell: pwsh
        run: |
          $n = [Environment]::ProcessorCount
          Write-Host "logical processors: $n"
          $pids = @()
          for ($i = 0; $i -lt $n; $i++) {
            $p = Start-Process -FilePath pwsh -ArgumentList '-NoProfile','-Command','$x = 1; while ($true) { $x = ($x * 31 + 7) % 1000003 }' -PassThru -WindowStyle Hidden
            $pids += $p.Id
          }
          $pids -join ',' | Out-File -FilePath "$env:RUNNER_TEMP\burner-pids.txt" -Encoding ascii
          Write-Host "burner pids: $($pids -join ',')"

      - name: Run AggregateJobQuiesceLiveTests 10 times
        shell: pwsh
        timeout-minutes: 35
        env:
          DARLING_TEST_PG: "Host=127.0.0.1;Port=5541;Username=darling;Database=darling"
          DARLING_TEST_PGRUNTIME: ${{ github.workspace }}\Darling\artifacts\pg-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $passes = 0; $failures = 0
          for ($i = 1; $i -le 10; $i++) {
            $log = "TestResults/iteration-$i.log"
            dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- -class "*AggregateJobQuiesceLiveTests" *> $log
            $code = $LASTEXITCODE
            $total = (Select-String -Path $log -Pattern 'Total:\s*(\d+)' | Select-Object -Last 1)
            $ran = if ($total) { $total.Line.Trim() } else { '(no Total line)' }
            if ($code -eq 0) {
              $passes++
              Write-Host "shard ${{ matrix.shard }} iteration ${i}: PASS ($ran)"
            } else {
              $failures++
              Write-Host "::error title=shard ${{ matrix.shard }} iteration ${i} FAILED::exit code $code ($ran)"
              $hits = @(Select-String -Path $log -Pattern '\[FAIL\]')
              if ($hits.Count -eq 0) { Get-Content $log -Tail 40 }
              foreach ($hit in $hits) {
                Write-Host "FAILED TEST: $($hit.Line.Trim())"
                Get-Content $log | Select-Object -Skip $hit.LineNumber -First 14 | ForEach-Object { Write-Host "    $_" }
              }
            }
          }
          Write-Host "RESULT shard ${{ matrix.shard }}: $passes passed, $failures failed, of 10 iterations"
          "RESULT shard ${{ matrix.shard }}: $passes passed, $failures failed, of 10 iterations" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($failures -gt 0) { exit 1 }

      - name: Stop the CPU burners
        if: always()
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\burner-pids.txt"
          if (Test-Path $f) { foreach ($id in ((Get-Content $f) -split ',')) { Stop-Process -Id ([int]$id) -Force -ErrorAction SilentlyContinue } }

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          $dataDir = "$env:RUNNER_TEMP\darling-pgdata"
          if ((Test-Path "$bin\pg_ctl.exe") -and (Test-Path $dataDir)) { & "$bin\pg_ctl.exe" -D $dataDir -m fast -w stop }
          exit 0
