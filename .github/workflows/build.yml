name: Build

# The RELEASE pipeline only (#6656 PR 3b). Pull requests and pushes to dev run pr.yml; the test jobs that
# used to live here were deleted with the push trigger. What is left is what a published release needs:
# the Windows build and SignPath signing (`build`), the Linux package (`darling-linux`) and its publish
# (`darling-linux-publish`). A release run waits on SignPath's manual approval gate and is never cancelled,
# so there is no concurrency group.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # #6497: a runner whose processes cannot start (0xC0000142 STATUS_DLL_INIT_FAILED) would otherwise fail one
      # step at a time and pay each job's own timeout. This is the first step, so such a runner fails here in seconds.
      - name: Check the runner can start a process
        timeout-minutes: 2
        shell: bash
        run: dotnet --version

      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        with:
          # On push events, compare against the previous commit on this branch
          # (github.event.before). Without this, the action defaults to comparing
          # against the default branch on non-default branch pushes, which would
          # match every accumulated change and defeat the filter.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          # Emit the matched file list so the fast-path step can NAME what it classified
          # as documentation. A fast path that silently under-builds is the failure mode
          # worth guarding against, so the reason is always printed, never inferred.
          #
          # json, for the reason the two Darling jobs' filters give: the list reaches the
          # step through `env:` rather than a `${{ }}` interpolation into script text, and a
          # runtime parameter expansion does not honour the `shell` format's backslash
          # escapes. Eight tracked paths under Screenshots/ carry spaces and that whole
          # directory is on the allowlist below, so the docs notice is the one that meets a
          # spaced path first. A JSON array is self-delimiting and prints verbatim.
          list-files: json
          filters: |
            # A change to a root build file (the solution, restore config, or THIS workflow) can
            # affect every product, so it forces a full build/test/publish.
            root:
              - 'PerformanceMonitor.sln'
              # #3222: every project in the tree inherits the product version from here, so a
              # release bump touches this file and NOTHING else. Absent this entry that bump
              # matches no area filter at all and the job that stamps the artifacts never builds
              # them: the enumerated-list failure this file's other comments keep describing.
              # Spelled without the angle brackets on purpose. ProductVersionDeclarationTests
              # treats that spelling as a version READ and would score this comment as one.
              - 'Directory.Build.props'
              - 'global.json'
              - 'nuget.config'
              - 'NuGet.config'
              - '.github/workflows/build.yml'
            # The shared PerformanceMonitor.* core libraries feed Lite, the Full Dashboard, AND
            # Darling (verified via ProjectReference), so a change here fans out to all three.
            # NOT the CLI Installer — it references only Installer.Core.
            #
            # Every area pattern says `dir/**/!(*.md)` — any non-markdown file under the
            # area — instead of the old `dir/**` include plus a bare `!**/*.md` exclude.
            # That is not style: dorny v4 evaluates each pattern as an INDEPENDENT
            # predicate under the default predicate-quantifier 'some' (a filter is true
            # when any changed file matches at least one rule), so a bare `!**/*.md` line
            # is not a subtraction — it is its own rule meaning "any file that is not
            # markdown", which silently made every area filter true for ANY non-markdown
            # change anywhere in the repo. Measured proof: a single root .gitignore edit
            # built and tested all four products and ran the full Darling PG suite
            # (PR #1714, run 30219202642, filter log: "Filter darling = true, Matching
            # files: .gitignore"). The extglob keeps the markdown carve-out INSIDE the
            # include, where quantifier semantics cannot detach it.
            core:
              - 'PerformanceMonitor.Alerting/**/!(*.md)'
              - 'PerformanceMonitor.Analysis/**/!(*.md)'
              - 'PerformanceMonitor.Collectors/**/!(*.md)'
              - 'PerformanceMonitor.Common/**/!(*.md)'
              - 'PerformanceMonitor.Notifications/**/!(*.md)'
              - 'PerformanceMonitor.PlanAnalysis/**/!(*.md)'
              - 'PerformanceMonitor.Ui/**/!(*.md)'
            # Installer.Core is shared by the CLI Installer AND the Full Dashboard's integrated
            # installer — a change rebuilds both, and nothing else.
            installer_core:
              - 'deprecated/Installer.Core/**/!(*.md)'
            dashboard:
              - 'deprecated/Dashboard/**/!(*.md)'
              - 'deprecated/Dashboard.Tests/**/!(*.md)'
              # ThemeParityTests compares the Dashboard's theme files with Lite's, so a change to Lite's
              # themes alone must run it too. #4658 changed a Lite theme color, its CI skipped the test,
              # and the next run that included it failed on dev (#4668).
              - 'Lite/Themes/**/!(*.md)'
            lite:
              - 'Lite/**/!(*.md)'
              - 'Lite.Tests/**/!(*.md)'
              # #5616: the Lite shard script and its packer are test inputs (Lite.Tests CrossAppGuardCiGateTests parses the script), so an edit to either has to reach the Lite suite.
              - '.github/scripts/run-lite-shard.ps1'
              - '.github/scripts/lite-shard-pack.py'
              # #5656: Lite.Tests pins read install/ scripts as source (CpuSchedulerStatsCollectorDefinitionTests reads install/17,
              # DmvResourceDatabaseSentinelTests reads install/56). A PR that edits only an install script fires `installer`
              # and `sql-validation`, neither of which runs Lite.Tests, so the nightly would be the first to catch drift.
              - 'install/**/!(*.md)'
              # Lite.Tests.csproj compiles tools/ui-smoke-wpf/LiteSeedGuard.cs into its own assembly and tests it, so an edit to that tree has to reach the Lite suite.
              - 'tools/ui-smoke-wpf/**/!(*.md)'
              # #5669: the Lite path gate the shard legs and lite-scope read; see that file's header.
              - '.github/lite-paths-filter.yml'
              # #2489, changed by Erik's 2026-09-24 ruling that docs-only changes skip CI:
              # README.md and Lite/README.md used to sit here so LiteRuntimePrerequisiteDocsTests
              # (which reads these two READMEs against the built runtimeconfig and this file's
              # publish shapes) could still run on a README-only change. That guard now runs on
              # every CODE pull request and in the nightly instead - both of which build Lite -
              # so a README edit alone no longer has to pay the Lite suite to keep it exercised.
              # A README-only PR takes the docs fast path below and does not build or test
              # anything; the trade is deliberate and is Erik's call, not an oversight.
              # Same silently-stops-guarding reason as the darling filter's Lite entries below:
              # Lite.Tests/ThemeParityLiteDarlingTests.cs READS the Darling viewer's theme
              # dictionaries to assert the two apps' shared brush keys still resolve to the same
              # colors. A Darling-theme-only edit is exactly the drift that guard exists to catch,
              # so it has to reach the suite.
              #
              # WIDENED from Themes/*.xaml to the whole Viewer tree (#2839): Lite.Tests reads eight
              # other Viewer files as source - MainWindow.xaml, SettingsWindow.xaml.cs,
              # CollectorSchedulePresets.cs, ViewerDataService.AlertSettings.cs,
              # ViewerDataService.Fleet.cs, AvailabilityGroupsTab.xaml, ViewerServerTab.xaml and
              # AddServerDialog.xaml.cs - so the Themes-only pattern left every guard reading any of
              # them unable to run on the edit it exists to catch.
              - 'Darling/PerformanceMonitor.Darling.Viewer/**/!(*.md)'
              # #2839, and the one that actually broke dev: Lite.Tests/QueryStoreSliceTieBreakSourceTests.cs
              # reads DARLING'S counterpart guard as source and asserts on the site total declared
              # there. #2830 raised that total 12 -> 18 touching only Darling/**, which fires `darling`
              # but not `lite`, so the mirror half was skipped and the merge went green before the
              # nightly failed on it. A guard that compares the two apps CANNOT live behind a filter
              # that only fires for one of them.
              - 'Darling/Darling.Tests/**/!(*.md)'
              # Same reason again, and a whole tree this time: WatermarkPolicyTests'
              # TheCatchUpHorizon_IsWrittenDownInExactlyOnePlace (#2468) scans the Darling SERVICE for
              # comments that restate the catch-up horizon's number instead of pointing at
              # WatermarkPolicy.MaxCatchup. Three of the twelve sites it was written for live here, so a
              # Darling-only PR reintroducing one would fire `darling` but not `lite` and skip the step
              # that runs the guard — caught a day later by the nightly, which is exactly the silent
              # drift the pin exists to close. A diff that reaches only these three Darling trees runs just
              # the Lite.Tests classes tagged Reads=Darling, in one shard (the lite-tests job's scope step).
              - 'Darling/PerformanceMonitor.Darling.Service/**/!(*.md)'
            installer:
              - 'deprecated/Installer/**/!(*.md)'
              - 'deprecated/Installer.Tests/**/!(*.md)'
              - 'install/**/!(*.md)'
              - 'upgrades/**/!(*.md)'
            darling:
              - 'Darling/**/!(*.md)'
              # nightly.yml is not a build input, but Darling.Tests PARSES it: the #1888
              # guard reads both workflows' throwaway-cluster settings and compares them
              # against the product's worker-sizing formula. Without this, a nightly-only
              # edit would change a file the guard asserts on while never running the
              # guard — a guard that silently stops guarding, which is the exact failure
              # mode the source-parsing tests here exist to prevent.
              - '.github/workflows/nightly.yml'
              # Same reason, Lite side: the #1949 pin in Darling.Tests asserts every twinned
              # query grid carries the SAME column sequence in both front ends, so it reads
              # these six Lite files. A Lite-only XAML edit has to reach the suite or the
              # parity half of that guard stops guarding.
              - 'Lite/Controls/ServerTab.xaml'
              - 'Lite/Controls/FinOpsTab.xaml'
              - 'Lite/Windows/WaitDrillDownWindow.xaml'
              - 'Lite/Windows/ProcedureHistoryWindow.xaml'
              - 'Lite/Windows/QueryStatsHistoryWindow.xaml'
              - 'Lite/Windows/QueryStoreHistoryWindow.xaml'
              # #2114: XamlStaticResourceHygieneTests scans EVERY Lite XAML file — a StaticResource
              # regression in one outside the six named above must still trigger the Darling job
              # that runs the guard, or it slips to the nightly.
              - 'Lite/**/*.xaml'
              # #2839, mirror of the lite filter's Darling entries: Darling.Tests reads Lite .cs
              # source too, not just XAML - Lite/Analysis, Lite/Mcp/McpHealthTools.cs and
              # Lite/Services. Naming only *.xaml meant a Lite .cs-only edit skipped the Darling
              # job that runs those parity guards. Derived (**/*.cs) rather than the three
              # directories, for the same reason #2114 added the *.xaml catch-all above an
              # enumerated six: an enumerated list stops covering the next file added.
              - 'Lite/**/*.cs'
              # #3222, same reason again and a project file this time: ProductVersionDeclarationTests
              # enumerates every csproj/props/targets in the tree to assert that exactly one place
              # declares a product version. Lite's project file is in that population, so adding a
              # version property back to it must run the Darling guard that would catch it. Derived
              # rather than the one path, for the reason the two entries above are derived.
              - 'Lite/**/*.csproj'
              # #5641: Darling.Tests compiles this Lite.Tests file in (Linked\AlertLegendParityTests.cs), so an edit to it has to reach the Darling suite.
              - 'Lite.Tests/AlertLegendParityTests.cs'
              # #5750: Darling.Tests compiles this Lite.Tests file in (Linked\NotificationRouteParityFixture.cs), so an edit to it has to reach the Darling suite.
              - 'Lite.Tests/NotificationRouteParityFixture.cs'
              # #5644: Darling.Tests compiles this Lite.Tests file in (Linked\DefaultTraceEventSequenceWatermarkTests.cs), so an edit to it has to reach the Darling suite.
              - 'Lite.Tests/DefaultTraceEventSequenceWatermarkTests.cs'
              # #5616: the two shard scripts are run by the shard jobs and parsed by Darling.Tests pins.
              - '.github/scripts/run-darling-pg-shard.ps1'
              - '.github/scripts/darling-shard-pack.py'
              - '.github/scripts/darling-shard-weights.json'
              - '.github/scripts/run-lite-shard.ps1'
            # #5459 cut 3a: the part of `darling` that is NOT a Lite file. A diff that reaches `darling` through
            # these (or core, root, a release) runs the whole Darling suite; a diff that reaches it only through the
            # Lite entries above runs the Stage=Guard classes and the classes that read a Lite file, which
            # `ci-select.py reads-classes` derives from the test sources (#5961: no Reads trait). The decision lives in
            # .github/scripts/ci-select.py.
            darling_full:
              - 'Darling/**/!(*.md)'
              - '.github/workflows/nightly.yml'
              # #5616: the two shard scripts are run by the shard jobs and parsed by Darling.Tests pins.
              - '.github/scripts/run-darling-pg-shard.ps1'
              - '.github/scripts/darling-shard-pack.py'
              - '.github/scripts/darling-shard-weights.json'
              - '.github/scripts/run-lite-shard.ps1'
            # The DOCUMENTATION allowlist: files that cannot affect a build under any
            # job in this workflow. Deliberately an allowlist of non-executable content,
            # not a "everything that isn't code" subtraction — a new file type defaults
            # to being treated as code, which is the safe direction to be wrong in.
            #
            # NOT here, on purpose: *.sql (the installer and sql-validation compile it),
            # *.yml (workflows), *.csproj / *.props / packages.lock.json (build inputs),
            # and *.cs regardless of how comment-only the change looks — an XML doc
            # comment still recompiles, and the compiler is what proves it still builds.
            #
            # The docs/ and Screenshots/ entries are extension-explicit rather than bare
            # directory globs for the same reason: everything in them today is markdown,
            # SVG, or a screenshot image, and a .sql or script dropped into either
            # directory tomorrow should default to being code, not inherit a free pass
            # from its parent directory.
            docs:
              - '**/*.md'
              - 'LICENSE'
              - 'CITATION.cff'
              - '.gitignore'
              - '.gitattributes'
              # The exact root path, not '**/*.txt': a .txt file elsewhere in the tree can be a test
              # INPUT, not documentation, and a bare extension glob would wave its edit through the
              # fast path unbuilt and untested.
              - 'llms.txt'
              # The changelog archive census, an exact path for the same reason as llms.txt. Every
              # changelog splice regenerates it beside CHANGELOG.md and docs/changelog/<version>.md, and
              # without it a splice paid about 17 minutes of Guard tests and whole-tree guards. It gives up
              # ChangelogIndexAndArchiveTests on a splice PR, which already does not run on a
              # CHANGELOG.md-only change: the splice lane runs that class before it pushes, and the nightly
              # runs the full suite (#5614).
              - 'tools/changelog/archive-census.txt'
              - 'docs/**/*.{md,svg,png,jpg,jpeg,gif}'
              - 'Screenshots/**/*.{md,svg,png,jpg,jpeg,gif}'
            # Catch-all COUNTER, not a boolean gate: the classify step below decides
            # "documentation-only" by comparing all_count to docs_count — they are equal
            # exactly when every changed file sits on the docs allowlist. Stated as a
            # count comparison because the previous shape ('**' plus '!' exclusions,
            # a code: filter) could never be false under predicate-quantifier 'some' —
            # every file matches '**', so the #1712 fast path shipped unable to engage
            # (throwaway PR #1714: a .gitignore-only diff still paid setup + restore and,
            # via the predicate bug above, a full build).
            all:
              - '**'

      # Decides the docs fast path ONCE, in one place, and says so out loud. Guards keep
      # it off every path where a skipped restore would be a real loss:
      #   release  — the filter step does not even run there, and a release must always
      #              compile and publish from a cold, fully restored tree.
      #   areas    — belt and suspenders: even when the counts say docs-only, any lit
      #              area filter vetoes the fast path, because an area=true with restore
      #              skipped would run `dotnet build --no-restore` against nothing. The
      #              two classifications are built from the same allowlist so they cannot
      #              disagree today; this guard is for the day someone edits one and not
      #              the other.
      # Everything else — including push and merge_group, per Erik's 2026-09-24 ruling —
      # is eligible, and engages only when EVERY changed file is on the documentation
      # allowlist (all_count == docs_count). push/merge_group used to force the restore
      # back on unconditionally as "cheap insurance" against NuGet drift that a lock-file
      # diff would not show; that insurance buys nothing on a docs-only commit specifically
      # BECAUSE it is docs-only — no lock file, Directory.Packages.props, or global.json is
      # among the changed files (all of those are `root`, which is off the docs allowlist
      # and vetoes the fast path via the areas guard above), so nothing this restore
      # validates could have moved since the push that last validated it.
      - name: Classify change for the docs fast path
        id: fastpath
        shell: bash
        env:
          ALL_COUNT: ${{ steps.filter.outputs.all_count }}
          DOCS_COUNT: ${{ steps.filter.outputs.docs_count }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          AREAS: 'root=${{ steps.filter.outputs.root }} core=${{ steps.filter.outputs.core }} installer_core=${{ steps.filter.outputs.installer_core }} dashboard=${{ steps.filter.outputs.dashboard }} lite=${{ steps.filter.outputs.lite }} installer=${{ steps.filter.outputs.installer }} darling=${{ steps.filter.outputs.darling }}'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "engaged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full build::Release event - the docs fast path never applies to a release."
            exit 0
          fi

          echo "Changed files: ${ALL_COUNT:-0} total, ${DOCS_COUNT:-0} on the documentation allowlist. Areas: ${AREAS}"

          if [ "${ALL_COUNT:-0}" -gt 0 ] && [ "${ALL_COUNT:-0}" -eq "${DOCS_COUNT:-0}" ] && [[ "${AREAS}" != *"=true"* ]]; then
            echo "engaged=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=DOCS FAST PATH ENGAGED::All ${ALL_COUNT} changed files are on the documentation allowlist, so .NET setup, restore and versioning are skipped. This job still reports its result."
            echo "Documentation files classified in this change: ${DOCS_FILES:-[]}"
          else
            echo "engaged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full build::At least one changed file is off the documentation allowlist (${DOCS_COUNT:-0} of ${ALL_COUNT:-0} classified as documentation)."
          fi

      # Every web-dashboard module must parse and link (#4666, #4672). The C# tests only READ the
      # dashboard's JavaScript, so a syntax error, a missing file or a missing named export passes
      # every other check and blanks the whole dashboard in the browser. A step INSIDE build, not a
      # job of its own: a failing job that build `needs:` would SKIP build, and a skipped build reads
      # as success, so the gate would fail open. It runs on every change the docs fast path does not
      # engage for (about two seconds), so a docs-only change stays fast.
      - name: Parse and link every wwwroot/js module
        if: steps.fastpath.outputs.engaged != 'true'
        shell: bash
        run: bash .github/scripts/check-web-js.sh

      # The exact SDK version from global.json, not its feature band. Given a band, setup-dotnet resolves the newest
      # patch through aka.ms links, and on 2026-10-25 those links sent every run to a download that failed with HTTP 409.
      # With an exact version the install script downloads from the release feed and never asks aka.ms.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        if: steps.fastpath.outputs.engaged != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        if: steps.fastpath.outputs.engaged != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Central package management pins the DIRECT versions in Directory.Packages.props; the committed
      # packages.lock.json files pin the TRANSITIVE closure, which is the half no diff shows and no review
      # reads. This step is where a change that moves one without the other is rejected, so two things have to
      # hold of it, and neither did (#3143).
      #
      # `shell: bash` with errexit, not the runner default. A multi-line run block executes under pwsh on
      # Windows, which does not abandon the block on a native command's non-zero exit and reports the block's
      # exit code as the LAST command's — so under the default shell any restore but the last is unable to
      # fail this step. Measured on the Dependabot pull requests #3143 was filed from: the required `build`
      # check passed carrying `error NU1004` in its own log, and the only job that went red was
      # darling-tree-guards, whose restore is a single-command step.
      #
      # Every project with a committed lock file bar one is reached from this list, directly or through a
      # ProjectReference — a locked-mode restore validates the lock file of every project in the graph it
      # walks, not only the one it was handed. The exception is deprecated/Installer, and it is deliberate.
      # That project is the only one publishing single-file, so the SDK adds an implicit
      # Microsoft.NET.ILLink.Tasks reference at the SDK's OWN version, and its lock file is the only one
      # carrying that entry; global.json rolls forward across patches, so a runner on 10.0.303 wants
      # [10.0.11, ) where a file written under 10.0.302 records [10.0.10, ). No restore line makes that file
      # right for both, and nothing references the project, so nothing else reaches it either: a restore
      # pointed at it reports NU1004 from dev today, with no dependency change involved (#3143). Whether it
      # should carry a lock file at all, and whether global.json should pin the SDK exactly, are decisions.
      #
      # LockedModeRestoreCoverageTests derives both requirements — from the lock files on disk and the
      # reference edges between projects — so a tenth lock file makes its restore mandatory rather than
      # remembered, and re-spelling this block in a shell that swallows failures fails the suite. It derives
      # the exception from the SDK coupling too, and ratchets its membership, so pinning the SDK exactly
      # makes this restore mandatory and a second project taking an SDK-coupled reference fails rather than
      # joining the exemption quietly.
      - name: Restore dependencies
        if: steps.fastpath.outputs.engaged != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # NU1004 offers two remedies and one of them is dropping locked mode, which trades the closure pin
          # rather than restoring it. Dependabot moves Directory.Packages.props and does not regenerate the
          # lock files that belong with it, so its weekly pull request lands on this step; naming the command
          # that reconciles them is the difference between a red check that gets acted on and one that gets
          # waited out. The message rides an ERR trap rather than a following step, so nothing can report
          # green beside a red restore.
          trap 'echo "::error title=Lock files disagree with Directory.Packages.props::Regenerate with '"'"'dotnet restore PerformanceMonitor.sln --force-evaluate'"'"' and commit every packages.lock.json it rewrites. Do not remove --locked-mode: the lock files are the only pin on the transitive closure, and the props diff does not show it moving."' ERR

          dotnet restore Lite/PerformanceMonitorLite.csproj --locked-mode
          dotnet restore Lite.Tests/Lite.Tests.csproj --locked-mode
          dotnet restore deprecated/Installer.Tests/Installer.Tests.csproj --locked-mode
          dotnet restore deprecated/Dashboard.Tests/Dashboard.Tests.csproj --locked-mode
          dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode
          dotnet restore Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj --locked-mode
          dotnet restore tools/ui-smoke-wpf/UiSmokeWpf.csproj --locked-mode

      - name: Build Lite.Tests
        if: steps.filter.outputs.lite == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build Lite.Tests/Lite.Tests.csproj -c Release --no-restore

      - name: Build Installer.Tests
        if: steps.filter.outputs.installer == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build deprecated/Installer.Tests/Installer.Tests.csproj -c Release --no-restore

      # The 'dashboard' path filter was defined when the Full Dashboard moved to deprecated/ (#1612) but
      # never wired to a step, so its build and tests silently stopped running — which is how a batch of
      # compiler warnings and three broken ThemeParityTests accumulated unnoticed (#1643). Deprecated means
      # bug-fix-only, not unverified: it still compiles warning-free and its tests still guard cross-app
      # parity (the theme palettes it checks are LITE's too).
      # installer_core too: the Dashboard references Installer.Core, and the filter's own comment says a
      # change there rebuilds both products, which only held for the CLI Installer until now.
      - name: Build Dashboard.Tests
        if: steps.filter.outputs.dashboard == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build deprecated/Dashboard.Tests/Dashboard.Tests.csproj -c Release --no-restore

      - name: Build Darling
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: |
          dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore
          dotnet build Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release --no-restore

      # RELEASE-ONLY here since #3887; on pull requests and pushes the suite runs in the lite-tests
      # matrix job below, four shards cut over CLASS NAMES (balanced by recorded duration since #5208,
      # the class-name hash otherwise), because this one step had grown to
      # ~9½ of the build job's ~15 minutes — 62% of the PR wall's critical path. The name cut is the
      # deliberate opposite of the SEMANTIC split this step's history retired: it was split into
      # fast / analysis-heavy halves when the seven analysis classes rebuilt the full DuckDB schema
      # inside every test and their subset alone cost ~9 minutes; after the shared class fixtures
      # (#1693, #1698) and batched seeding (#1694) that subset ran in ~1 minute, so the split — and
      # the narrower lite_analysis path gate that let non-analysis Lite changes skip it — stopped
      # earning its second test-host spin-up and its FILTER-DRIFT RISK. A cut over class names
      # cannot drift: every class lands in exactly one shard (by arithmetic for the hash, by a
      # proof for the duration cut), a class added tomorrow included, and no list anywhere has
      # to be maintained. Releases keep this single unsharded
      # pass so the artifact-producing run still executes the suite whole, in one log.
      - name: Run Lite tests
        if: github.event_name == 'release'
        run: dotnet run --project Lite.Tests/Lite.Tests.csproj -c Release --no-build -- -xml TestResults/lite-timing-release.xml

      # #5208: per-test timings of the unsharded release pass, same shape as the lite-tests shards.
      - name: Lite test timing summary
        if: always() && github.event_name == 'release'
        continue-on-error: true
        run: python .github/scripts/lite-timing-top.py TestResults

      - name: Upload Lite test timings
        if: always() && github.event_name == 'release'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: lite-tests-timing-release
          path: |
            TestResults/lite-timing-*.xml
            TestResults/lite-timing-*.xml.cpu.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Installer tests
        if: steps.filter.outputs.installer == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project deprecated/Installer.Tests/Installer.Tests.csproj -c Release --no-build -- -class- "Installer.Tests.VersionDetectionTests" -class- "Installer.Tests.IdempotencyTests" -class- "Installer.Tests.AdversarialTests"

      - name: Run Dashboard tests
        if: steps.filter.outputs.dashboard == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project deprecated/Dashboard.Tests/Dashboard.Tests.csproj -c Release --no-build

      # #5459 cut 3b: the PostgreSQL shards run EVERY Darling.Tests class, with a live store, whenever the Darling
      # gate matches (the same .github/darling-paths-filter.yml the darling-pg job reads). This no-store pass would
      # repeat their non-live classes, so while the shards run it keeps only the Stage=Guard classes. Where the gate
      # does not match (a Lite-only change, a root build file) and on a release it still runs the whole suite.
      # .github/scripts/ci-select.py holds the rule (darling_scope); the replay of the failure corpus checks it.
      - name: Detect the Darling PostgreSQL gate
        id: darling-gate
        if: github.event_name != 'release' && (steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true')
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: .github/darling-paths-filter.yml

      - name: Decide the Darling test scope
        id: darling-scope
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GATE: ${{ steps.darling-gate.outputs.darling }}
          FULL: ${{ steps.filter.outputs.darling_full }}
          CORE: ${{ steps.filter.outputs.core }}
          ROOT: ${{ steps.filter.outputs.root }}
        run: |
          set -euo pipefail
          python .github/scripts/ci-select.py darling-scope --event "${EVENT_NAME}" --gate "${GATE:-false}"             --full "${FULL:-false}" --core "${CORE:-false}" --root "${ROOT:-false}" | tee -a "$GITHUB_OUTPUT"

      - name: Run Darling tests
        id: darling-tests
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        env:
          DARLING_SCOPE_FILTER: ${{ steps.darling-scope.outputs.filter }}
          DARLING_SCOPE: ${{ steps.darling-scope.outputs.scope }}
          # #5459 change 5: the slow-skip lookup reads the pull request's file list through the API.
          GH_TOKEN: ${{ github.token }}
          SLOW_EVENT: ${{ github.event_name }}
          SLOW_PR: ${{ github.event.pull_request.number }}
          SLOW_REPO: ${{ github.repository }}
          # #5459: a pull request into main runs everything, Cost=Slow classes too (ci-select.py narrows).
          SLOW_BASE_REF: ${{ github.base_ref }}
        shell: pwsh
        run: |
          # An empty filter is the whole suite; `-trait Stage=Guard` is the Guard stage alone.
          $scopeArgs = @($env:DARLING_SCOPE_FILTER -split ' ' | Where-Object { $_ })
          # #5459 change 5: the whole-suite pass on a pull request leaves out the Cost=Slow classes the change does
          # not reach (ci-select.py slow_skip). The Guard-only pass has none of them (a Guard class is never Slow).
          $slowArgs = @()
          if ($env:SLOW_EVENT -eq 'pull_request' -and $scopeArgs.Count -eq 0) {
              $slowArgs = @(python .github/scripts/ci-select.py slow-skip --suite darling --event $env:SLOW_EVENT "--base-ref=$env:SLOW_BASE_REF" --repo $env:SLOW_REPO --pr $env:SLOW_PR | Where-Object { $_ } | ForEach-Object { '-class-'; "*.$_" })
          }
          # #5961: the `-trait Reads=Lite` part of a scope is the classes ci-select.py's source scan says read a Lite path, run
          # by `-class`. xunit ANDs filters of different kinds, so it is a second run (without the Guard classes the first
          # run already ran). An EMPTY scan skips it: a runner given no -class argument runs the whole suite, and the
          # empty trait filter it replaces ran nothing.
          $readsLite = $false
          $restArgs = @()
          for ($i = 0; $i -lt $scopeArgs.Count; $i++) {
              if ($scopeArgs[$i] -eq '-trait' -and ($i + 1) -lt $scopeArgs.Count -and $scopeArgs[$i + 1] -eq 'Reads=Lite') { $readsLite = $true; $i++ }
              else { $restArgs += $scopeArgs[$i] }
          }
          $exitCode = 0
          if (-not $readsLite -or $restArgs.Count -gt 0) {
              dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- @restArgs @slowArgs
              if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          }
          if ($readsLite) {
              $readsArgs = @(python .github/scripts/ci-select.py reads-classes --suite darling --args | Where-Object { $_ })
              if ($LASTEXITCODE -ne 0) { Write-Host 'ci-select.py reads-classes failed'; exit 1 }
              if ($readsArgs.Count -gt 0) {
                  Write-Host "Lite-reads scan: $($readsArgs.Count / 2) Darling.Tests classes read a Lite path"
                  dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- @readsArgs -trait- Stage=Guard
                  if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
              }
              else { Write-Host '::warning title=Lite-reads scan is empty::No Darling.Tests class reads a Lite path, so only the Guard stage runs here.' }
          }
          if ($exitCode -ne 0) { exit $exitCode }

      # #5320: the statement-filter release gate. StatementCensus_PendingEntries_BlockARelease fails
      # while any statement-column census entry or watched writer is pending, in every normal Darling
      # test run (the step above), so a pull request that adds an unjudged column fails on its own.
      # This step stays as the release-time backstop: it sets DARLING_RELEASE_CUT=1 and runs the one
      # test by name, ahead of every publish and package step below, and only on the release event,
      # so a release cannot ship an unhooked column even if the step above was skipped.
      # ReleaseStatementGateWorkflowTests pins both halves, and that no other workflow sets the
      # variable. Darling.Tests is already built (Release) by the build step above, so this runs
      # the one test by name and nothing else.
      - name: Statement filter release gate
        if: github.event_name == 'release'
        env:
          DARLING_RELEASE_CUT: '1'
        shell: pwsh
        run: |
          # A -method filter that matches nothing exits 0 with "Total: 0", so a renamed test would pass this gate
          # without running. Fail unless the runner's own summary shows exactly the one test, with nothing failed,
          # errored, skipped or not run. ReleaseStatementGateWorkflowTests binds the name to the test with nameof.
          dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- -method "*StatementCensus_PendingEntries_BlockARelease*" 2>&1 | Tee-Object -FilePath statement-gate.log
          if ($LASTEXITCODE -ne 0) { throw "The statement filter release gate failed (exit $LASTEXITCODE)." }
          if (-not (Select-String -Path statement-gate.log -Pattern 'Total: 1, Errors: 0, Failed: 0, Skipped: 0, Not Run: 0' -SimpleMatch -Quiet)) {
            throw "The statement filter release gate did not run exactly one passing test; the summary above is not 'Total: 1, Errors: 0, Failed: 0, Skipped: 0, Not Run: 0'."
          }

      - name: Get version
        if: steps.fastpath.outputs.engaged != 'true'
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Read no version from Directory.Build.props." }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # #2501: -r win-x64 --self-contained, and it makes the portable ZIP SMALLER, not bigger.
      # The RID-agnostic framework-dependent publish this replaced copied every platform its
      # packages ship - 537 MB of runtimes\ on a 565 MB tree, of which only the 52 MB win-x64
      # folder can ever load on Windows (DuckDB.NET.Bindings.Full is most of it, SkiaSharp and
      # SqlClient behind it). Pinning the RID drops ~485 MB of unloadable native payload, which
      # is far more than the bundled .NET/WPF/ASP.NET runtime adds back. Measured on the same
      # commit and SDK: 565 MB tree / 212.7 MB zipped becomes 277 MB / 114.2 MB.
      #
      # The size was the secondary reason. The primary one is #2489: a framework-dependent ZIP
      # unzipped onto a stock Windows Server dies on the .NET host's own "You must install .NET
      # to run this application" before a line of our code runs, so Lite cannot report it, and
      # #2499 could only ship a READ-ME-FIRST.txt next to the exe. Self-contained there is
      # nothing to install and nothing to fail. That matters most for the nightly ZIP, which is
      # the UAT download and is not offered as a Setup.exe at all.
      #
      # Lite/PerformanceMonitorLite.csproj declares RuntimeIdentifiers so the committed lock
      # file covers this RID; see the comment there before removing either half.
      - name: Publish Lite
        if: steps.filter.outputs.lite == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Lite/PerformanceMonitorLite.csproj -c Release -r win-x64 --self-contained -o publish/Lite

      - name: Publish Lite (self-contained for Velopack)
        if: github.event_name == 'release'
        run: dotnet publish Lite/PerformanceMonitorLite.csproj -c Release -r win-x64 --self-contained -o publish/Lite-velopack

      # #6471: the Windows service and the viewer\ folder inside the Darling zip are self-contained, as Lite and
      # the viewer Setup.exe already are, so a stock Windows Server needs no .NET Runtime, ASP.NET Core Runtime or
      # Desktop Runtime before install-darling.ps1 runs. Runtime patches now arrive with Darling releases. The Linux
      # tarball and the Docker image keep their own framework-dependent publishes (the linux job below, and
      # Darling/Dockerfile); neither uses these two steps.
      - name: Publish Darling Service
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj -c Release -r win-x64 --self-contained -o publish/DarlingService

      - name: Publish Darling Viewer
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release -r win-x64 --self-contained -o publish/DarlingViewer

      - name: Publish Darling Viewer (self-contained for Velopack)
        if: github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release -r win-x64 --self-contained -o publish/DarlingViewer-velopack

      # Darling bundles a PostgreSQL 18 + TimescaleDB runtime (pg-runtime.zip) that ships beside
      # the service exe; DarlingManagedPostgres extracts it on first run. The fetch script pulls
      # ~340MB of pinned EDB/TimescaleDB archives, so this is release-only and cached. The key is
      # the fetch script's own content hash (the SHA256 pins live inside it): a re-release with
      # unchanged pins restores the assembled zip and skips both the download and the assembly,
      # and any pin/version bump edits the script and invalidates the cache automatically.
      - name: Cache Darling pg-runtime.zip
        if: github.event_name == 'release'
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip
        if: github.event_name == 'release' && steps.cache-pg-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Package release artifacts
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path releases

          # Lite ZIP - portable artifact for advanced/air-gapped users. The README points end
          # users at Setup.exe (Velopack); this ZIP is the explicit fallback.
          Compress-Archive -Path 'publish/Lite/*' -DestinationPath "releases/PerformanceMonitorLite-$version.zip" -Force

      # upload-artifact is deliberately HELD at v6 (#1653): every signing step below consumes
      # `steps.upload-*.outputs.artifact-id`, and v7 changes artifact archiving semantics (the
      # `archive` parameter). The signing path only executes on `release: [published]`, so a broken
      # bump surfaces at release time — bump only alongside a validated real signing run.
      # Dependabot is configured to skip this major (see .github/dependabot.yml).
      - name: Upload Lite for signing
        if: github.event_name == 'release'
        id: upload-lite
        uses: actions/upload-artifact@v6
        with:
          name: Lite-unsigned
          path: publish/Lite/

      - name: Stage Darling for signing
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $stage = 'publish/Darling-signing'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage/viewer" | Out-Null
          Copy-Item 'publish/DarlingService/*' $stage -Recurse
          Copy-Item 'publish/DarlingViewer/*' "$stage/viewer" -Recurse

      - name: Upload Darling for signing
        if: github.event_name == 'release'
        id: upload-darling
        uses: actions/upload-artifact@v6
        with:
          name: Darling-unsigned
          path: publish/Darling-signing/

      # v3 of this action talks to SignPath's Pipeline Connector, which needs the SignPath
      # GitHub App installed on this repository (v2's connector did not). Without it every
      # attempt fails with "Failed to retrieve GitHub App token" (erikdarlingdata/PerformanceStudio#569,
      # which hit this on that repo's first v3 release run). The app has been installed here
      # since 2026-09-24. SignPath signs only a run's first 3 attempts: if signing keeps
      # failing, fix the cause and start a fresh release run instead of re-running this one.
      - name: Sign Lite
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Lite'
          github-artifact-id: '${{ steps.upload-lite.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Lite'

      - name: Sign Darling
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Darling'
          github-artifact-id: '${{ steps.upload-darling.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Darling'

      - name: Replace with signed artifacts
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # Re-zip signed files into release archives
          Remove-Item "releases/PerformanceMonitorLite-$version.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path 'signed/Lite/*' -DestinationPath "releases/PerformanceMonitorLite-$version.zip" -Force

      - name: Package Darling (signed)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # One product, one zip (mirrors the one-zip-per-product convention above). signed/Darling
          # already holds the signed tree in its final layout — the service at the archive root (its
          # darling.sample.json alongside), the viewer in a viewer\ subfolder. Drop pg-runtime.zip
          # beside the service exe, exactly where DarlingManagedPostgres looks (AppContext.BaseDirectory)
          # and extracts it on first run. The EDB PostgreSQL binaries inside pg-runtime.zip are shipped
          # as opaque data and were never signed.
          Copy-Item 'Darling/artifacts/pg-runtime.zip' 'signed/Darling'

          Remove-Item "releases/PerformanceMonitorDarling-$version.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path 'signed/Darling/*' -DestinationPath "releases/PerformanceMonitorDarling-$version.zip" -Force

      # #6480: the Darling MSI, built from the same signed tree the zip above holds (signed/Darling: the service at the
      # root, viewer\, the three signed scripts, pg-runtime.zip), the way darling-msi.yml builds it. It goes to
      # build/msi/, never releases/: the checksum step and the upload read only releases/, so building the package here
      # publishes nothing. It is built on every release so a package that no longer builds fails the release at once
      # and not on the day signing is switched on. WiX's ICE validation runs as part of the build and any error fails it.
      #
      # An MSI is signed as a whole, and the three steps after this one (upload for signing, SignPath, the copy into
      # releases/) run only when the repository variable DARLING_MSI_SIGNING is 'true'. It has been set to 'true' since
      # 2026-10-23, so each release signs the MSI (SignPath artifact configuration 'DarlingMsi', the MSI file at the
      # root) and ships it. Unsetting the variable skips the MSI: nothing is submitted and no MSI ships. The signature
      # step below fails the job if an .msi reaches releases/ without a Valid SignPath Foundation signature.
      - name: Build Darling MSI
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          dotnet build Darling/msi/PerformanceMonitor.Darling.Msi.wixproj -c Release -m:1 -p:UseSharedCompilation=false "-p:PayloadDir=${{ github.workspace }}\signed\Darling"
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path build/msi | Out-Null
          Move-Item Darling/msi/bin/Release/*.msi build/msi
          Get-ChildItem build/msi -Filter *.msi | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload Darling MSI for signing
        if: github.event_name == 'release' && vars.DARLING_MSI_SIGNING == 'true'
        id: upload-darling-msi
        uses: actions/upload-artifact@v6
        with:
          name: DarlingMsi-unsigned
          path: build/msi/*.msi

      - name: Sign Darling MSI
        if: github.event_name == 'release' && vars.DARLING_MSI_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'DarlingMsi'
          github-artifact-id: '${{ steps.upload-darling-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/DarlingMsi'

      # The release asset is PerformanceMonitorDarling-<version>.msi, the MSI's own file name. Exactly one signed MSI
      # must come back; anything else fails here rather than shipping the wrong file.
      - name: Add the signed Darling MSI to the release assets
        if: github.event_name == 'release' && vars.DARLING_MSI_SIGNING == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $signed = @(Get-ChildItem signed/DarlingMsi -Filter *.msi -File -ErrorAction SilentlyContinue)
          if ($signed.Count -ne 1) { throw "Expected one signed MSI in signed/DarlingMsi, found $($signed.Count)." }
          Copy-Item $signed[0].FullName "releases/PerformanceMonitorDarling-$version.msi" -Force

      # The Velopack path packs a SEPARATE self-contained build (publish/Lite-velopack,
      # publish/DarlingViewer-velopack -- the "self-contained for Velopack" steps above), and
      # these rounds sign that payload before `vpk pack` consumes it. They are what puts a
      # signature on lib/app/<App>.exe inside each .nupkg and on current/<App>.exe inside each
      # Portable.zip; `vpk pack` below reads the signed output, not the raw publish directory.
      - name: Upload Lite (Velopack) for signing
        if: github.event_name == 'release'
        id: upload-lite-velopack
        uses: actions/upload-artifact@v6
        with:
          name: Lite-Velopack-unsigned
          path: publish/Lite-velopack/

      - name: Upload Darling Viewer (Velopack) for signing
        if: github.event_name == 'release'
        id: upload-darlingviewer-velopack
        uses: actions/upload-artifact@v6
        with:
          name: DarlingViewer-Velopack-unsigned
          path: publish/DarlingViewer-velopack/

      - name: Sign Lite (Velopack)
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Lite'
          github-artifact-id: '${{ steps.upload-lite-velopack.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Lite-Velopack'

      # The remote-seat viewer (#1555) has its OWN 'DarlingViewer' artifact configuration — the
      # co-located-zip 'Darling' slug signs a service+viewer\ tree layout, which does not match
      # this self-contained viewer-at-root publish. Every artifact configuration named in this
      # workflow lives outside the repo on signpath.io, and a step naming a slug that does not
      # exist fails the release — the standing #1340 SignPath prerequisite.
      - name: Sign Darling Viewer (Velopack)
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'DarlingViewer'
          github-artifact-id: '${{ steps.upload-darlingviewer-velopack.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/DarlingViewer-Velopack'

      - name: Create Velopack releases (Lite + Darling Viewer)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Pin vpk to the Velopack library version (keep in sync with the Velopack
          # PackageVersion in Directory.Packages.props; a vpk older than the library logs
          # "Velopack library version is greater than vpk version").
          dotnet tool install -g vpk --version 1.2.161
          New-Item -ItemType Directory -Force -Path releases/velopack-lite
          New-Item -ItemType Directory -Force -Path releases/velopack-darlingviewer

          # #6506: `vpk download github` logs "No releases found" and EXITS 0 when the GitHub
          # releases API answers with an empty list. v3.11.0 hit that for the lite channel (the
          # darlingviewer call 18 seconds later got 19 releases), so `vpk pack` found no previous
          # package, built only a full package, and the release shipped with no Lite delta. A first
          # release for a channel legitimately downloads nothing, so tell the two apart: retry an
          # empty download, then fail the step if an earlier release already carries the channel's
          # releases.<channel>.json. vpk reads only the 10 newest releases, so the check looks at
          # the same window.
          function Invoke-VpkChannelDownload([string]$Channel, [string]$Dir) {
            $repo = '${{ github.repository }}'
            $feed = "releases.$Channel.json"
            $attempts = 4
            for ($i = 1; $i -le $attempts; $i++) {
              vpk download github --repoUrl "https://github.com/$repo" --channel $Channel -o $Dir --token $env:GH_TOKEN
              $vpkExit = $LASTEXITCODE
              if (@(Get-ChildItem -LiteralPath $Dir -File -Filter '*.nupkg').Count -gt 0) { return }
              Write-Host "vpk download for channel '$Channel' fetched no package (attempt $i of $attempts, exit $vpkExit)."
              if ($i -lt $attempts) { Start-Sleep -Seconds (15 * $i) }
            }
            $json = gh api "repos/$repo/releases?per_page=10"
            if ($LASTEXITCODE -ne 0) { throw "Cannot tell whether channel '$Channel' has an earlier release: listing releases failed (gh exit $LASTEXITCODE). Failing rather than publishing without a delta." }
            $withFeed = (@($json | ConvertFrom-Json | Where-Object { -not $_.prerelease -and -not $_.draft -and ($_.assets.name -contains $feed) } | ForEach-Object { $_.tag_name }) -join ', ')
            if ($withFeed) { throw "vpk download found no previous package for channel '$Channel' after $attempts attempts, but earlier release(s) carry $feed ($withFeed). Failing so the release does not ship without a delta (#6506)." }
            Write-Host "No earlier release carries $feed, so '$Channel' is a first release: continuing with a full package only."
          }

          # Lite: download previous + pack (from the SIGNED velopack output, not the raw publish dir)
          Invoke-VpkChannelDownload 'lite' 'releases/velopack-lite'
          vpk pack -u PerformanceMonitorLite -v $env:VERSION -p signed/Lite-Velopack -e PerformanceMonitorLite.exe -o releases/velopack-lite --channel lite
          if ($LASTEXITCODE -ne 0) { throw "vpk pack for channel 'lite' failed (exit $LASTEXITCODE)." }

          # Darling Viewer remote-seat installer (#1555): download previous + pack (from the SIGNED
          # velopack output). Its own 'darlingviewer' channel/delta feed, separate from the co-located
          # viewer inside PerformanceMonitorDarling-*.zip (which stays plain-zip only).
          Invoke-VpkChannelDownload 'darlingviewer' 'releases/velopack-darlingviewer'
          vpk pack -u PerformanceMonitorDarlingViewer -v $env:VERSION -p signed/DarlingViewer-Velopack -e PerformanceMonitor.Darling.Viewer.exe -o releases/velopack-darlingviewer --channel darlingviewer
          if ($LASTEXITCODE -ne 0) { throw "vpk pack for channel 'darlingviewer' failed (exit $LASTEXITCODE)." }

      # #3288: Velopack GENERATES three executables during `vpk pack` — the portable launcher
      # stub, Update.exe (Squirrel.exe under its internal name) and Setup.exe — so no pre-pack
      # round can reach them. They are signed here, in one more Action request covering both
      # products.
      #
      # It has to be an Action step. SignPath's open-source signing policy requires origin
      # verification through a trusted build system, so a request is accepted only through
      # signpath/github-action-submit-signing-request, which attests repository, branch, commit
      # and build-job URL. `vpk pack --signTemplate` would have to reach SignPath from inside
      # packing, where no workflow step can run, and a raw API-token submission is answered
      # "the selected signing policy requires that the signing request is submitted via a
      # trusted build system" with 403.
      #
      # This reaches the two standalone assets and not the .nupkg interior. releases.<channel>.json
      # records a SHA256 and a Size for each .nupkg and for nothing else, and the delta patches
      # against those bytes, so the copies of the stub and Squirrel.exe inside the .nupkg stay
      # unsigned — allowlisted by member path AND container in verify_release_signatures.py, so
      # the same two names anywhere else still fail the guard below.
      #
      # Both products go in one request, so this costs one approval however many files it
      # carries. The staging layout gives each product its own subdirectory because both
      # portable archives contain an Update.exe and a flat batch would collide.
      - name: Collect the executables Velopack generates
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          python3 .github/scripts/postpack_signing.py collect --stage postpack/unsigned --manifest postpack/manifest.json --product lite=releases/velopack-lite --product darlingviewer=releases/velopack-darlingviewer

      - name: Upload the Velopack-generated executables for signing
        if: github.event_name == 'release'
        id: upload-postpack
        uses: actions/upload-artifact@v6
        with:
          name: Velopack-generated-unsigned
          path: postpack/unsigned/

      # 'SignTemplate' is the artifact configuration for a flat set of PE files at arbitrary
      # paths, declared on signpath.io as `**/*.exe` and `**/*.dll` with min-matches="0" on
      # both. min-matches="0" means an EMPTY submission would succeed and sign nothing, which
      # the per-product configurations refuse with min-matches="1"; postpack_signing.py's
      # collect mode asserts a non-empty staging set for exactly that reason.
      - name: Sign the executables Velopack generates
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'SignTemplate'
          github-artifact-id: '${{ steps.upload-postpack.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'postpack/signed'

      # Setup.exe is overwritten; each Portable.zip is rebuilt member by member so every entry
      # it does not replace keeps its local header, name, extra field and raw compressed bytes,
      # and the rebuild is verified against a snapshot of the original before it replaces it.
      - name: Write the signed Velopack executables back
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          python3 .github/scripts/postpack_signing.py apply --signed postpack/signed --manifest postpack/manifest.json

      # After the write-back, so it records the bytes that ship. Its census is `releases/*.zip` and
      # `releases/*.msi` (#6480; there is an MSI only when DARLING_MSI_SIGNING is 'true'), which is not
      # recursive: it covers the two plain product archives and the MSI and does not reach the
      # Velopack assets in releases/velopack-*/, so Setup.exe and Portable.zip carry no entry
      # here. releases.<channel>.json is the integrity record for the .nupkg files, and nothing
      # publishes a checksum for the two files the step above signs.
      - name: Generate checksums
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $checksums = Get-ChildItem releases/* -Include *.zip, *.msi -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF and no BOM, written explicitly (#2383). Out-File on Windows emits CRLF whatever
          # the encoding, and `shasum -c` on macOS/Linux then takes the trailing \r as part of
          # the FILENAME - every entry reports "No such file or directory / FAILED open or
          # read", which is precisely what a tampered download looks like. The hashes were
          # always right; the file just could not be used by the tool it exists for, on the two
          # platforms where that tool is the default. A BOM breaks the first line the same way.
          #
          # There is a SECOND copy of this step in nightly.yml. #2384 fixed only this one, and the
          # nightly went on publishing CRLF for another day; keep them in step.
          [IO.File]::WriteAllText(
            "$PWD/releases/SHA256SUMS.txt",
            (($checksums -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false))
          Write-Host "Checksums:"
          $checksums | ForEach-Object { Write-Host $_ }

      # #3288's guard. It walks the artifacts on disk -- including the executables INSIDE the
      # zips and nupkgs, which is where the launcher stub and Update.exe live -- so it needs no
      # network and no published release. Two nupkg members are allowlisted by member path and
      # container; everything else must carry a certificate table, and an empty census is a
      # failure rather than a pass.
      # It also checks the PowerShell scripts (#5796): every script must end with a signature block, a
      # Darling zip must be there, and it must hold install-, uninstall- and upgrade-darling.ps1 at its
      # root (status 2 when one is missing, when there is no Darling zip, or when a file cannot be read).
      - name: Assert every published executable is signed
        if: github.event_name == 'release'
        shell: pwsh
        run: python3 .github/scripts/verify_release_signatures.py --verify-dir releases

      # #5796: the guard above sees that each script ends with a signature block. Only Windows can say whether
      # that signature is Valid (chain, digest, timestamp), and this job runs on Windows, so ask it, for the three
      # scripts at the Darling zip's root. Valid alone means any trusted signer, so the signer must also be the
      # SignPath Foundation certificate the release is signed with. Anything else, or a script that is not there,
      # fails the release. Each script's signer, thumbprint and timestamper are printed for the log.
      - name: Assert the Darling scripts carry a valid Authenticode signature
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem -Path releases -Filter '*.zip' -File |
            Where-Object { $_.Name -match 'darling' -and $_.Name -notmatch 'darlingviewer' })
          if ($zips.Count -ne 1) {
            Write-Host "::error::Expected one Darling zip in releases/, found $($zips.Count): $($zips.Name -join ', ')"
            exit 1
          }
          $dest = Join-Path ([IO.Path]::GetTempPath()) ('darling-scripts-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = 0
          $zip = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            foreach ($name in 'install-darling.ps1', 'uninstall-darling.ps1', 'upgrade-darling.ps1') {
              $entry = $zip.GetEntry($name)
              if ($null -eq $entry) {
                Write-Host "${name}: Missing (not at the root of $($zips[0].Name))"
                $failed++
                continue
              }
              $path = Join-Path $dest $name
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $path)
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              $subject = "$($signature.SignerCertificate.Subject)"
              $stamper = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { '(none)' }
              Write-Host "${name}: $($signature.Status) ($($signature.StatusMessage))"
              Write-Host "  signer: $(if ($subject) { $subject } else { '(none)' })"
              Write-Host "  thumbprint: $(if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { '(none)' })"
              Write-Host "  timestamper: $stamper"
              if ($signature.Status -ne 'Valid') {
                $failed++
              } elseif ($subject -notmatch '(^|,\s*)O=SignPath Foundation(,|$)') {
                Write-Host "  not signed by the SignPath Foundation certificate"
                $failed++
              }
            }
          } finally {
            $zip.Dispose()
          }
          if ($failed) {
            Write-Host "::error::$failed of the Darling zip's three scripts do not carry a Valid Authenticode signature by the SignPath Foundation certificate (#5796)."
            exit 1
          }

      # #6480: the backstop for the MSI. Any releases\*.msi must be Valid and signed by the SignPath Foundation
      # certificate, the test the scripts above get; an unsigned one, another signer or a broken signature fails the
      # release, and no .msi passes (the MSI ships only when DARLING_MSI_SIGNING is 'true'). The check is
      # .github/scripts/assert-msi-signatures.ps1, which darling-msi.yml also runs against an unsigned MSI and
      # expects to fail, so the gate is exercised on a runner before a release depends on it.
      - name: Assert any Darling MSI carries a valid Authenticode signature
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          ./.github/scripts/assert-msi-signatures.ps1 -ReleasesDir releases
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::A Darling MSI in releases/ does not carry a Valid Authenticode signature by the SignPath Foundation certificate (#6480)."
            exit 1
          }

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # The MSI is only there when DARLING_MSI_SIGNING is 'true' (#6480), so the list is built, not globbed.
          $assets = @(Get-ChildItem releases/* -Include *.zip, *.msi -File | ForEach-Object { $_.FullName }) + @("$PWD/releases/SHA256SUMS.txt")
          gh release upload ${{ github.event.release.tag_name }} @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }

      - name: Upload Lite Velopack artifacts
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload the Velopack channel feed with gh, not `vpk upload github --merge`.
          # vpk's Octokit uploader dies mid-transfer on the large .nupkg (SslStream write,
          # exhausts its own retries) and is NOT idempotent -- once releases.lite.json exists
          # on the release it hard-fails ("merging release files is not supported"), so a
          # re-run can't recover (#3520). vpk download+pack has already assembled the complete
          # channel feed locally; gh just transfers it and --clobber makes a retry idempotent.
          # Upload the nupkgs (including the downloaded prior full that the on-disk
          # releases.lite.json references -- the index and every package it names must land
          # together), the Setup and Portable, and the channel index. Skip the inert
          # assets.lite.json / RELEASES-lite, which the Velopack client never fetches.
          $dir = "releases/velopack-lite"
          $files = @(Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '\.nupkg$' -or $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Portable.zip' -or $_.Name -eq 'releases.lite.json' }).FullName
          gh release upload "${{ github.event.release.tag_name }}" $files --clobber

      - name: Upload Darling Viewer Velopack artifacts
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # See the Lite step above for why this uses gh instead of `vpk upload github --merge`.
          $dir = "releases/velopack-darlingviewer"
          $files = @(Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '\.nupkg$' -or $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Portable.zip' -or $_.Name -eq 'releases.darlingviewer.json' }).FullName
          gh release upload "${{ github.event.release.tag_name }}" $files --clobber

  # ── Linux service build + container image (#1804) ────────────────────────────────────────────────
  # The Darling service is cross-platform .NET on purpose, but until this job nothing PROVED it on
  # every PR — the linux-x64 publish and the container image both built for the first time at release
  # time or never. Same path-filter shape as darling-pg above: only runs the expensive work when
  # Darling/service code (or this workflow, or the Dockerfile) changed, always reports a result so it
  # can be a required check. No tests run here — the test projects are net10.0-windows (they reference
  # the WPF apps); the cross-platform behavior they pin is exercised by the Windows jobs, and the
  # container smoke lives in the compose quickstart. On PRs/pushes this job answers exactly two
  # questions: does the service still publish for linux-x64, and does the image still build.
  #
  # On the RELEASE event this job PACKAGES the Linux release and the darling-linux-publish job below
  # PUBLISHES it: before them, a stable release shipped Windows zips and Setup.exes while the linux
  # tar.gz and the ghcr image existed only at nightly quality (nightly.yml, tag :nightly) — the compose
  # quickstart pointed released users at a nightly image. This job tars the linux-x64 publish into
  # PerformanceMonitorDarling-linux-x64-<v>.tar.gz and the Compose files into PerformanceMonitorDarling-compose-<v>.tar.gz (#6123), writes SHA256SUMS-linux.txt over both and hands them to the publish
  # job as this run's darling-linux-release artifact; it publishes nothing itself, so it needs only read
  # access (#5804). Linux binaries are NOT SignPath-signed (SignPath signs Windows PEs); the checksums
  # file is the integrity story, same as the nightly.
  darling-linux:
    name: Darling Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          # json rather than shell. The lists reach the notice through `env:` and never through a
          # `${{ }}` interpolation into the script text, which is the pull_request script-injection
          # footgun — and a runtime parameter expansion does not honour shell's backslash escapes, so
          # the `shell` format's `a\ b.md` field-splits into two entries that name no file. Eight
          # tracked paths under Screenshots/ carry spaces, and that directory is on the documentation
          # allowlist, so it is the shape a screenshot PR reaches rather than a hypothetical. A JSON
          # array is self-delimiting, so the notice prints it verbatim and reads unambiguously for any
          # filename without parsing it at all.
          list-files: json
          # The same gate the darling-pg job above reads. The list of shared libraries that reaches
          # Darling belongs to both jobs, and holding it twice is how the copies came to differ: the
          # copy here named three of the seven, missing PerformanceMonitor.Alerting and
          # PerformanceMonitor.PlanAnalysis, which the service this job publishes references directly.
          filters: .github/darling-paths-filter.yml

      # Reports the decision and the files behind it, for the same reason the PG job's notice does.
      - name: Report the Linux gate decision
        shell: bash
        env:
          DARLING: ${{ steps.filter.outputs.darling }}
          DARLING_COUNT: ${{ steps.filter.outputs.darling_count }}
          # A list goes into the environment only up to 1,000 files. Linux refuses to start a process whose
          # single environment string passes 128 KiB, so the 2,843-file dev-to-main release PR failed here
          # before the script ran ("Argument list too long"). The counts always print; the Detect changed
          # paths step above lists every file either way.
          DARLING_FILES: ${{ fromJSON(steps.filter.outputs.darling_count || '0') <= 1000 && steps.filter.outputs.darling_files || '"(more than 1,000 files, listed in the Detect changed paths step)"' }}
          ALL_COUNT: ${{ steps.filter.outputs.all_count }}
          ALL_FILES: ${{ fromJSON(steps.filter.outputs.all_count || '0') <= 1000 && steps.filter.outputs.all_files || '"(more than 1,000 files, listed in the Detect changed paths step)"' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "::notice title=Darling Linux packaging::Release event - packaging the versioned linux tar.gz. The Darling Linux publish job uploads it and pushes the ghcr image once the Windows build, signature guards included, has passed."
            exit 0
          fi

          if [ "${DARLING:-}" = "true" ]; then
            echo "::notice title=Darling Linux build running::${DARLING_COUNT:-0} of ${ALL_COUNT:-0} changed files are in the Darling gate (.github/darling-paths-filter.yml)."
            echo "Changed files in the gate: ${DARLING_FILES:-[]}"
          else
            echo "::notice title=Darling Linux build skipped::None of the ${ALL_COUNT:-0} changed files are in the Darling gate (.github/darling-paths-filter.yml), so the linux-x64 publish and the image build did not run on this commit."
            echo "Changed files, none of them in the gate: ${ALL_FILES:-[]}"
          fi

      # The exact SDK version from global.json, not its feature band. Given a band, setup-dotnet resolves the newest
      # patch through aka.ms links, and on 2026-10-25 those links sent every run to a download that failed with HTTP 409.
      # With an exact version the install script downloads from the release feed and never asks aka.ms.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        if: github.event_name == 'release' || steps.filter.outputs.darling == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        if: github.event_name == 'release' || steps.filter.outputs.darling == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish service (linux-x64)
        if: github.event_name == 'release' || steps.filter.outputs.darling == 'true'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj -c Release -r linux-x64 --self-contained false -o publish/DarlingService-linux

      - name: Build container image
        if: github.event_name != 'release' && steps.filter.outputs.darling == 'true'
        run: docker build -f Darling/Dockerfile -t performancemonitor-darling:pr .

      # #5366: the test project runs on Windows, so the Unix file checks behind the password key (owner, link count, file
      # identity) and the Linux crypto path run here instead, inside the image the service ships in. The hidden verb runs
      # the real code in a fresh temporary directory and opens a committed, labelled test vector made on Windows. Any
      # failure exits non-zero and fails the job. The vector is mounted read-only.
      - name: Check the password key on Linux (self-check verb in the built image)
        if: github.event_name != 'release' && steps.filter.outputs.darling == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vector="${GITHUB_WORKSPACE}/Darling/Darling.Tests/Fixtures/PasswordSeal/linux-self-check-vector.json"
          test -f "${vector}"
          docker run --rm \
            -v "${vector}:/vector/linux-self-check-vector.json:ro" \
            performancemonitor-darling:pr \
            --self-check-password-key /vector/linux-self-check-vector.json

      # ── Release-only publishing (mirrors nightly.yml's linux job, versioned instead of :nightly) ──

      - name: Get version
        if: github.event_name == 'release'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          [ -n "${version}" ] || { echo "::error::Read no version from Directory.Build.props."; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Package linux artifact + checksum
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          mkdir -p releases
          tar -C publish/DarlingService-linux -czf "releases/PerformanceMonitorDarling-linux-x64-${version}.tar.gz" .
          # #5796: the PowerShell scripts ship signed in the Windows zip only. The service csproj leaves them out
          # of a Linux publish; this fails the job if one comes back. Same check as nightly.yml's linux job.
          listing="$(tar -tzf "releases/PerformanceMonitorDarling-linux-x64-${version}.tar.gz")"
          if grep -iE '\.(ps1|psm1|psd1|ps1xml)$' <<<"${listing}"; then
            echo "::error::The Linux tarball holds the PowerShell scripts listed above. They ship signed in the Windows zip only (#5796)."
            exit 1
          fi
          # #6123: the Compose files are their own release asset, because no other download holds Darling/compose/.
          # The packed copy names THIS release's image tag instead of :latest, so a release's files pull that
          # release's image (darling-linux-publish pushes the ghcr :<version> tag). Only tracked files ship:
          # the checkout has no local secrets. The archive opens into one folder so a user can extract it and
          # cd into it. Line endings are made LF, because .gitattributes checks text out as CRLF.
          compose_dir="PerformanceMonitorDarling-compose-${version}"
          compose_stage="$(mktemp -d)"
          mkdir -p "${compose_stage}/${compose_dir}"
          cp -R Darling/compose/. "${compose_stage}/${compose_dir}/"
          find "${compose_stage}/${compose_dir}" -type f -exec sed -i 's/\r$//' {} +
          compose_file="${compose_stage}/${compose_dir}/docker-compose.yml"
          sed -i "s|\(image: ghcr\.io/erikdarlingdata/performancemonitor-darling\):latest|\1:${version}|" "${compose_file}"
          if [ "$(grep -c "image: ghcr\.io/erikdarlingdata/performancemonitor-darling:${version}$" "${compose_file}")" != "1" ] || grep -q "performancemonitor-darling:latest" "${compose_file}"; then
            echo "::error::The packed compose file does not name the darling image at :${version}."
            exit 1
          fi
          # #6140: setup.sh is the quickstart's first step, so it must open with its execute bit. The checkout holds it as
          # mode 755 already, and chmod makes that certain. The tar listing below must show it executable and the
          # script must parse under a POSIX shell, so a bad pack fails this job and not the user's first command.
          chmod 755 "${compose_stage}/${compose_dir}/setup.sh"
          sh -n "${compose_stage}/${compose_dir}/setup.sh"
          tar -C "${compose_stage}" -czf "releases/PerformanceMonitorDarling-compose-${version}.tar.gz" "${compose_dir}"
          tar -tzf "releases/PerformanceMonitorDarling-compose-${version}.tar.gz"
          if ! tar -tvzf "releases/PerformanceMonitorDarling-compose-${version}.tar.gz" | grep -Eq '^-rwxr-xr-x .* '"${compose_dir}"'/setup\.sh$'; then
            echo "::error::setup.sh is missing from the compose archive or lacks its execute bit (#6140)."
            exit 1
          fi
          (cd releases && sha256sum "PerformanceMonitorDarling-linux-x64-${version}.tar.gz" "PerformanceMonitorDarling-compose-${version}.tar.gz" > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      # #5804: the tarball and its checksums leave this job as a same-run artifact rather than as release
      # assets. darling-linux-publish uploads them only after the Windows build job, whose release steps
      # assert every published executable is signed, has succeeded, so a failed guard leaves no Linux
      # asset or :latest image behind. Seven days of retention: the publish job reads it minutes later,
      # and a "Re-run failed jobs" of a release up to a week later still finds it.
      - name: Hand the linux artifact to the publish job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: darling-linux-release
          path: releases/
          if-no-files-found: error
          retention-days: 7

  # ── Linux release publish (#5804) ─────────────────────────────────────────────────────────────────
  # Release only. Before #5804 darling-linux published the Linux release in parallel with the Windows
  # build job, so a release whose Windows signature guard failed ("Assert every published executable
  # is signed") still shipped the Linux tarball, its checksums and the ghcr :<version> and :latest
  # images while the Windows zips never uploaded: a half-published release. This job needs BOTH jobs
  # and starts only when both succeeded, so every blocking check runs before anything is published.
  # The cost is wall clock: the Linux publish now starts after the Windows build finishes instead of
  # alongside it. The steps after the download
  # are the ones darling-linux ran, unchanged; Get version reads the same Directory.Build.props from
  # the same commit, so steps.version.outputs.VERSION names the version they always did.
  darling-linux-publish:
    name: Darling Linux publish
    needs: [build, darling-linux]
    if: ${{ !cancelled() && github.event_name == 'release' && needs.build.result == 'success' && needs.darling-linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Sigstore keyless signing + GitHub provenance (proven on the nightly first): id-token yields
      # the OIDC identity Fulcio certifies against; attestations stores the tarball's provenance.
      id-token: write
      attestations: write

    steps:
      # The image builds from the checkout (Darling/Dockerfile), as it did in darling-linux.
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          [ -n "${version}" ] || { echo "::error::Read no version from Directory.Build.props."; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      # This run's own artifact (no run-id), so it reads nothing another run left behind.
      - name: Download the linux artifact
        uses: actions/download-artifact@v8
        with:
          name: darling-linux-release
          path: releases

      # The artifact must be the tarball this version names, and its checksum must still match.
      - name: Check the downloaded linux artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          test -f "releases/PerformanceMonitorDarling-linux-x64-${version}.tar.gz"
          test -f "releases/PerformanceMonitorDarling-compose-${version}.tar.gz"
          (cd releases && sha256sum -c SHA256SUMS-linux.txt)

      - name: Upload linux artifact to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} releases/PerformanceMonitorDarling-linux-x64-*.tar.gz releases/SHA256SUMS-linux.txt releases/PerformanceMonitorDarling-compose-*.tar.gz --clobber

      - name: Build and push container image (ghcr, versioned + latest)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          image="ghcr.io/${{ github.repository_owner }}/performancemonitor-darling"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f Darling/Dockerfile -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"

      # Keyless Sigstore signature on the released image — the same steps the nightly runs (verified
      # end-to-end from a client 2026-08-06: cosign validated the claims, the Rekor log entry, and the
      # workflow identity). SignPath's cosign support is edition-gated, and this path needs no keys or
      # subscription at all. Verify:
      #   cosign verify ghcr.io/erikdarlingdata/performancemonitor-darling:<version> \
      #     --certificate-identity-regexp 'github.com/erikdarlingdata/PerformanceMonitor' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless, Sigstore)
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          image="ghcr.io/${{ github.repository_owner }}/performancemonitor-darling"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${version}")"
          cosign sign --yes "${digest}"

      # GitHub-native SLSA provenance for the released tarball: gh attestation verify <file> -R <repo>.
      - name: Attest the linux tarball (GitHub provenance)
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            releases/PerformanceMonitorDarling-linux-x64-*.tar.gz
            releases/PerformanceMonitorDarling-compose-*.tar.gz

