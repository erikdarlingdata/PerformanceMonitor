name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  # Merge-queue runs. Inert until a queue ruleset is enabled on a branch (a repo setting),
  # but the required checks must handle the event BEFORE that click, or every queued PR
  # stalls on checks that never report. dorny/paths-filter v4.0.1+ resolves merge_group
  # diffs from the payload's base_sha/head_sha whenever the base input is empty — exactly
  # what the filter steps pass for non-push events — so path classification works
  # unchanged in a queue run.
  merge_group:

permissions:
  contents: write
  id-token: write
  actions: read

# A re-push to a PR cancels that PR's superseded in-flight run, and a push to dev/main
# cancels that BRANCH's superseded in-flight run — newest SHA wins. Finishing a build of
# code that is no longer the head helps nobody, and the shared Windows runner pool is what
# serializes everyone's CI (#1697 sat queued behind two dev builds; on 2026-07-26 a
# ~20-merge train left 13 of the day's 30 dev-push runs finishing SHAs a newer merge had
# already replaced — ~60 reclaimable runner-minutes in one evening). Cancelling a
# superseded PUSH run is safe because a push run produces nothing any other run consumes:
# every upload-artifact step in this workflow is gated to the release event (the SignPath
# signing path) or to failure() (darling-pg diagnostics), nothing in the repo downloads
# cross-run artifacts (no download-artifact, gh run download, or workflow_run consumer
# exists), nightly.yml builds its own tree from its own checkout, and a release compiles
# fresh on the release event. The accepted trade: push builds are diff-scoped, so a
# cancelled run's areas are not re-verified until the next change touches them — the
# nightly and the all-areas dev->main release PR are the backstops. Release and
# merge-queue runs deliberately keep a UNIQUE group per run (run_id) and are NEVER
# cancelled: a release build waits on SignPath's manual approval gate, and a queue
# validation is the last check before its result lands on dev.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('build-push-{0}', github.ref) || format('build-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        with:
          # On push events, compare against the previous commit on this branch
          # (github.event.before). Without this, the action defaults to comparing
          # against the default branch on non-default branch pushes, which would
          # match every accumulated change and defeat the filter.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          # Emit the matched file list so the fast-path step can NAME what it classified
          # as documentation. A fast path that silently under-builds is the failure mode
          # worth guarding against, so the reason is always printed, never inferred.
          list-files: shell
          filters: |
            # A change to a root build file (the solution, restore config, or THIS workflow) can
            # affect every product, so it forces a full build/test/publish.
            root:
              - 'PerformanceMonitor.sln'
              - 'global.json'
              - 'nuget.config'
              - 'NuGet.config'
              - '.github/workflows/build.yml'
            # The shared PerformanceMonitor.* core libraries feed Lite, the Full Dashboard, AND
            # Darling (verified via ProjectReference), so a change here fans out to all three.
            # NOT the CLI Installer — it references only Installer.Core.
            #
            # Every area pattern says `dir/**/!(*.md)` — any non-markdown file under the
            # area — instead of the old `dir/**` include plus a bare `!**/*.md` exclude.
            # That is not style: dorny v4 evaluates each pattern as an INDEPENDENT
            # predicate under the default predicate-quantifier 'some' (a filter is true
            # when any changed file matches at least one rule), so a bare `!**/*.md` line
            # is not a subtraction — it is its own rule meaning "any file that is not
            # markdown", which silently made every area filter true for ANY non-markdown
            # change anywhere in the repo. Measured proof: a single root .gitignore edit
            # built and tested all four products and ran the full Darling PG suite
            # (PR #1714, run 30219202642, filter log: "Filter darling = true, Matching
            # files: .gitignore"). The extglob keeps the markdown carve-out INSIDE the
            # include, where quantifier semantics cannot detach it.
            core:
              - 'PerformanceMonitor.Alerting/**/!(*.md)'
              - 'PerformanceMonitor.Analysis/**/!(*.md)'
              - 'PerformanceMonitor.Collectors/**/!(*.md)'
              - 'PerformanceMonitor.Common/**/!(*.md)'
              - 'PerformanceMonitor.Notifications/**/!(*.md)'
              - 'PerformanceMonitor.PlanAnalysis/**/!(*.md)'
              - 'PerformanceMonitor.Ui/**/!(*.md)'
            # Installer.Core is shared by the CLI Installer AND the Full Dashboard's integrated
            # installer — a change rebuilds both, and nothing else.
            installer_core:
              - 'deprecated/Installer.Core/**/!(*.md)'
            dashboard:
              - 'deprecated/Dashboard/**/!(*.md)'
              - 'deprecated/Dashboard.Tests/**/!(*.md)'
            lite:
              - 'Lite/**/!(*.md)'
              - 'Lite.Tests/**/!(*.md)'
              # #2489: LiteRuntimePrerequisiteDocsTests derives Lite's .NET runtime prerequisites
              # from the BUILT runtimeconfig and from the publish shapes in this very file, then
              # asserts these two READMEs say so - which artifact is self-contained, which needs two
              # runtimes. Naming them here is not optional. Every area filter carves markdown out
              # (dir/**/!(*.md)), and a docs-only PR additionally engages the fast path above, which
              # skips .NET setup and restore outright - so without these two entries the guard could
              # not run on a README-only change, i.e. on exactly the edit that would undo the fix.
              # The cost is that a root-README edit now runs the Lite suite; that is the same trade
              # the Darling entries below already take, and the alternative is a guard that quietly
              # stops guarding.
              - 'README.md'
              - 'Lite/README.md'
              # Same silently-stops-guarding reason as the darling filter's Lite entries below:
              # Lite.Tests/ThemeParityLiteDarlingTests.cs READS the Darling viewer's theme
              # dictionaries to assert the two apps' shared brush keys still resolve to the same
              # colors. A Darling-theme-only edit is exactly the drift that guard exists to catch,
              # so it has to reach the suite.
              - 'Darling/PerformanceMonitor.Darling.Viewer/Themes/*.xaml'
              # Same reason again, and a whole tree this time: WatermarkPolicyTests'
              # TheCatchUpHorizon_IsWrittenDownInExactlyOnePlace (#2468) scans the Darling SERVICE for
              # comments that restate the catch-up horizon's number instead of pointing at
              # WatermarkPolicy.MaxCatchup. Three of the twelve sites it was written for live here, so a
              # Darling-only PR reintroducing one would fire `darling` but not `lite` and skip the step
              # that runs the guard — caught a day later by the nightly, which is exactly the silent
              # drift the pin exists to close. The cost is that Darling service PRs now also run the Lite
              # suite; that is the same trade the `darling` filter already takes for Lite/**/*.xaml.
              - 'Darling/PerformanceMonitor.Darling.Service/**/!(*.md)'
            installer:
              - 'deprecated/Installer/**/!(*.md)'
              - 'deprecated/Installer.Tests/**/!(*.md)'
              - 'install/**/!(*.md)'
              - 'upgrades/**/!(*.md)'
            darling:
              - 'Darling/**/!(*.md)'
              # nightly.yml is not a build input, but Darling.Tests PARSES it: the #1888
              # guard reads both workflows' throwaway-cluster settings and compares them
              # against the product's worker-sizing formula. Without this, a nightly-only
              # edit would change a file the guard asserts on while never running the
              # guard — a guard that silently stops guarding, which is the exact failure
              # mode the source-parsing tests here exist to prevent.
              - '.github/workflows/nightly.yml'
              # Same reason, Lite side: the #1949 pin in Darling.Tests asserts every twinned
              # query grid carries the SAME column sequence in both front ends, so it reads
              # these six Lite files. A Lite-only XAML edit has to reach the suite or the
              # parity half of that guard stops guarding.
              - 'Lite/Controls/ServerTab.xaml'
              - 'Lite/Controls/FinOpsTab.xaml'
              - 'Lite/Windows/WaitDrillDownWindow.xaml'
              - 'Lite/Windows/ProcedureHistoryWindow.xaml'
              - 'Lite/Windows/QueryStatsHistoryWindow.xaml'
              - 'Lite/Windows/QueryStoreHistoryWindow.xaml'
              # #2114: XamlStaticResourceHygieneTests scans EVERY Lite XAML file — a StaticResource
              # regression in one outside the six named above must still trigger the Darling job
              # that runs the guard, or it slips to the nightly.
              - 'Lite/**/*.xaml'
            # The DOCUMENTATION allowlist: files that cannot affect a build under any
            # job in this workflow. Deliberately an allowlist of non-executable content,
            # not a "everything that isn't code" subtraction — a new file type defaults
            # to being treated as code, which is the safe direction to be wrong in.
            #
            # NOT here, on purpose: *.sql (the installer and sql-validation compile it),
            # *.yml (workflows), *.csproj / *.props / packages.lock.json (build inputs),
            # and *.cs regardless of how comment-only the change looks — an XML doc
            # comment still recompiles, and the compiler is what proves it still builds.
            #
            # The docs/ and Screenshots/ entries are extension-explicit rather than bare
            # directory globs for the same reason: everything in them today is markdown,
            # SVG, or a screenshot image, and a .sql or script dropped into either
            # directory tomorrow should default to being code, not inherit a free pass
            # from its parent directory.
            docs:
              - '**/*.md'
              - 'LICENSE'
              - 'CITATION.cff'
              - '.gitignore'
              - '.gitattributes'
              - 'docs/**/*.{md,svg,png,jpg,jpeg,gif}'
              - 'Screenshots/**/*.{md,svg,png,jpg,jpeg,gif}'
            # Catch-all COUNTER, not a boolean gate: the classify step below decides
            # "documentation-only" by comparing all_count to docs_count — they are equal
            # exactly when every changed file sits on the docs allowlist. Stated as a
            # count comparison because the previous shape ('**' plus '!' exclusions,
            # a code: filter) could never be false under predicate-quantifier 'some' —
            # every file matches '**', so the #1712 fast path shipped unable to engage
            # (throwaway PR #1714: a .gitignore-only diff still paid setup + restore and,
            # via the predicate bug above, a full build).
            all:
              - '**'

      # Decides the docs fast path ONCE, in one place, and says so out loud. Guards keep
      # it off every path where a skipped restore would be a real loss:
      #   release  — the filter step does not even run there, and a release must always
      #              compile and publish from a cold, fully restored tree.
      #   push     — dev/main pushes are the integration signal for what just merged, so
      #              they restore unconditionally even for a docs-only commit. Cheap
      #              insurance: this only forces the restore back on, it does not force
      #              the per-product build/test steps, which stay path-gated as before.
      #   merge_group — a queue run is the LAST validation before its result lands on dev,
      #              so it takes the same always-restore path as a push.
      #   areas    — belt and suspenders: even when the counts say docs-only, any lit
      #              area filter vetoes the fast path, because an area=true with restore
      #              skipped would run `dotnet build --no-restore` against nothing. The
      #              two classifications are built from the same allowlist so they cannot
      #              disagree today; this guard is for the day someone edits one and not
      #              the other.
      # Everything else (pull_request) is eligible, and engages only when EVERY changed
      # file is on the documentation allowlist (all_count == docs_count).
      - name: Classify change for the docs fast path
        id: fastpath
        shell: bash
        env:
          ALL_COUNT: ${{ steps.filter.outputs.all_count }}
          DOCS_COUNT: ${{ steps.filter.outputs.docs_count }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          AREAS: 'root=${{ steps.filter.outputs.root }} core=${{ steps.filter.outputs.core }} installer_core=${{ steps.filter.outputs.installer_core }} dashboard=${{ steps.filter.outputs.dashboard }} lite=${{ steps.filter.outputs.lite }} installer=${{ steps.filter.outputs.installer }} darling=${{ steps.filter.outputs.darling }}'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "engaged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full build::Release event - the docs fast path never applies to a release."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "engaged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full build::${{ github.event_name }} on '${{ github.ref_name }}' - integration runs always restore, even for a docs-only change."
            exit 0
          fi

          echo "Changed files: ${ALL_COUNT:-0} total, ${DOCS_COUNT:-0} on the documentation allowlist. Areas: ${AREAS}"

          if [ "${ALL_COUNT:-0}" -gt 0 ] && [ "${ALL_COUNT:-0}" -eq "${DOCS_COUNT:-0}" ] && [[ "${AREAS}" != *"=true"* ]]; then
            echo "engaged=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=DOCS FAST PATH ENGAGED::All ${ALL_COUNT} changed files are on the documentation allowlist, so .NET setup, restore and versioning are skipped. This job still reports its result."
            echo "Documentation files classified in this change:"
            for f in ${DOCS_FILES}; do echo "  - ${f}"; done
          else
            echo "engaged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full build::At least one changed file is off the documentation allowlist (${DOCS_COUNT:-0} of ${ALL_COUNT:-0} classified as documentation)."
          fi

      - name: Setup .NET 10.0
        if: steps.fastpath.outputs.engaged != 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        if: steps.fastpath.outputs.engaged != 'true'
        run: |
          dotnet restore Lite/PerformanceMonitorLite.csproj --locked-mode
          dotnet restore Lite.Tests/Lite.Tests.csproj --locked-mode
          dotnet restore deprecated/Installer.Tests/Installer.Tests.csproj --locked-mode
          dotnet restore deprecated/Dashboard.Tests/Dashboard.Tests.csproj --locked-mode
          dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode
          dotnet restore Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj --locked-mode

      - name: Build Lite.Tests
        if: steps.filter.outputs.lite == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build Lite.Tests/Lite.Tests.csproj -c Release --no-restore

      - name: Build Installer.Tests
        if: steps.filter.outputs.installer == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build deprecated/Installer.Tests/Installer.Tests.csproj -c Release --no-restore

      # The 'dashboard' path filter was defined when the Full Dashboard moved to deprecated/ (#1612) but
      # never wired to a step, so its build and tests silently stopped running — which is how a batch of
      # compiler warnings and three broken ThemeParityTests accumulated unnoticed (#1643). Deprecated means
      # bug-fix-only, not unverified: it still compiles warning-free and its tests still guard cross-app
      # parity (the theme palettes it checks are LITE's too).
      - name: Build Dashboard.Tests
        if: steps.filter.outputs.dashboard == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet build deprecated/Dashboard.Tests/Dashboard.Tests.csproj -c Release --no-restore

      - name: Build Darling
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: |
          dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore
          dotnet build Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release --no-restore

      # One step for the whole Lite suite. It was split into fast / analysis-heavy halves when the
      # seven analysis classes rebuilt the full DuckDB schema inside every test and their subset
      # alone cost ~9 minutes; after the shared class fixtures (#1693, #1698) and batched seeding
      # (#1694) that subset runs in ~1 minute, so the split — and the narrower lite_analysis path
      # gate that let non-analysis Lite changes skip it — stopped earning its second test-host
      # spin-up and its filter-drift risk.
      - name: Run Lite tests
        if: steps.filter.outputs.lite == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project Lite.Tests/Lite.Tests.csproj -c Release --no-build

      - name: Run Installer tests
        if: steps.filter.outputs.installer == 'true' || steps.filter.outputs.installer_core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project deprecated/Installer.Tests/Installer.Tests.csproj -c Release --no-build -- -class- "Installer.Tests.VersionDetectionTests" -class- "Installer.Tests.IdempotencyTests" -class- "Installer.Tests.AdversarialTests"

      - name: Run Dashboard tests
        if: steps.filter.outputs.dashboard == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project deprecated/Dashboard.Tests/Dashboard.Tests.csproj -c Release --no-build

      - name: Run Darling tests
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build

      - name: Get version
        if: steps.fastpath.outputs.engaged != 'true'
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Lite/PerformanceMonitorLite.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      # #2501: -r win-x64 --self-contained, and it makes the portable ZIP SMALLER, not bigger.
      # The RID-agnostic framework-dependent publish this replaced copied every platform its
      # packages ship - 537 MB of runtimes\ on a 565 MB tree, of which only the 52 MB win-x64
      # folder can ever load on Windows (DuckDB.NET.Bindings.Full is most of it, SkiaSharp and
      # SqlClient behind it). Pinning the RID drops ~485 MB of unloadable native payload, which
      # is far more than the bundled .NET/WPF/ASP.NET runtime adds back. Measured on the same
      # commit and SDK: 565 MB tree / 212.7 MB zipped becomes 277 MB / 114.2 MB.
      #
      # The size was the secondary reason. The primary one is #2489: a framework-dependent ZIP
      # unzipped onto a stock Windows Server dies on the .NET host's own "You must install .NET
      # to run this application" before a line of our code runs, so Lite cannot report it, and
      # #2499 could only ship a READ-ME-FIRST.txt next to the exe. Self-contained there is
      # nothing to install and nothing to fail. That matters most for the nightly ZIP, which is
      # the UAT download and is not offered as a Setup.exe at all.
      #
      # Lite/PerformanceMonitorLite.csproj declares RuntimeIdentifiers so the committed lock
      # file covers this RID; see the comment there before removing either half.
      - name: Publish Lite
        if: steps.filter.outputs.lite == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Lite/PerformanceMonitorLite.csproj -c Release -r win-x64 --self-contained -o publish/Lite

      - name: Publish Lite (self-contained for Velopack)
        if: github.event_name == 'release'
        run: dotnet publish Lite/PerformanceMonitorLite.csproj -c Release -r win-x64 --self-contained -o publish/Lite-velopack

      - name: Publish Darling Service
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj -c Release -o publish/DarlingService

      - name: Publish Darling Viewer
        if: steps.filter.outputs.darling == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.root == 'true' || github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release -o publish/DarlingViewer

      - name: Publish Darling Viewer (self-contained for Velopack)
        if: github.event_name == 'release'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release -r win-x64 --self-contained -o publish/DarlingViewer-velopack

      # Darling bundles a PostgreSQL 18 + TimescaleDB runtime (pg-runtime.zip) that ships beside
      # the service exe; DarlingManagedPostgres extracts it on first run. The fetch script pulls
      # ~340MB of pinned EDB/TimescaleDB archives, so this is release-only and cached. The key is
      # the fetch script's own content hash (the SHA256 pins live inside it): a re-release with
      # unchanged pins restores the assembled zip and skips both the download and the assembly,
      # and any pin/version bump edits the script and invalidates the cache automatically.
      - name: Cache Darling pg-runtime.zip
        if: github.event_name == 'release'
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip
        if: github.event_name == 'release' && steps.cache-pg-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Package release artifacts
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path releases

          # Lite ZIP - portable artifact for advanced/air-gapped users. The README points end
          # users at Setup.exe (Velopack); this ZIP is the explicit fallback.
          Compress-Archive -Path 'publish/Lite/*' -DestinationPath "releases/PerformanceMonitorLite-$version.zip" -Force

      # upload-artifact is deliberately HELD at v6 (#1653): every signing step below consumes
      # `steps.upload-*.outputs.artifact-id`, and v7 changes artifact archiving semantics (the
      # `archive` parameter). The signing path only executes on `release: [published]`, so a broken
      # bump surfaces at release time — bump only alongside a validated real signing run.
      # Dependabot is configured to skip this major (see .github/dependabot.yml).
      - name: Upload Lite for signing
        if: github.event_name == 'release'
        id: upload-lite
        uses: actions/upload-artifact@v6
        with:
          name: Lite-unsigned
          path: publish/Lite/

      - name: Stage Darling for signing
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $stage = 'publish/Darling-signing'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage/viewer" | Out-Null
          Copy-Item 'publish/DarlingService/*' $stage -Recurse
          Copy-Item 'publish/DarlingViewer/*' "$stage/viewer" -Recurse

      - name: Upload Darling for signing
        if: github.event_name == 'release'
        id: upload-darling
        uses: actions/upload-artifact@v6
        with:
          name: Darling-unsigned
          path: publish/Darling-signing/

      - name: Sign Lite
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Lite'
          github-artifact-id: '${{ steps.upload-lite.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Lite'

      - name: Sign Darling
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Darling'
          github-artifact-id: '${{ steps.upload-darling.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Darling'

      - name: Replace with signed artifacts
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # Re-zip signed files into release archives
          Remove-Item "releases/PerformanceMonitorLite-$version.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path 'signed/Lite/*' -DestinationPath "releases/PerformanceMonitorLite-$version.zip" -Force

      - name: Package Darling (signed)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # One product, one zip (mirrors the one-zip-per-product convention above). signed/Darling
          # already holds the signed tree in its final layout — the service at the archive root (its
          # darling.sample.json alongside), the viewer in a viewer\ subfolder. Drop pg-runtime.zip
          # beside the service exe, exactly where DarlingManagedPostgres looks (AppContext.BaseDirectory)
          # and extracts it on first run. The EDB PostgreSQL binaries inside pg-runtime.zip are shipped
          # as opaque data and were never signed.
          Copy-Item 'Darling/artifacts/pg-runtime.zip' 'signed/Darling'

          Remove-Item "releases/PerformanceMonitorDarling-$version.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path 'signed/Darling/*' -DestinationPath "releases/PerformanceMonitorDarling-$version.zip" -Force

      # The Velopack (Setup.exe) path publishes a SEPARATE self-contained build
      # (publish/Dashboard-velopack, publish/Lite-velopack -- see the "self-contained
      # for Velopack" steps above) that previously went straight into `vpk pack`
      # without ever being uploaded to SignPath. Only the framework-dependent trees
      # used for the legacy ZIPs were signed, so every Setup.exe shipped unsigned
      # since Velopack packaging was introduced. These steps close that gap by
      # mirroring the exact upload/sign pattern used for Dashboard/Lite/Installer
      # above, and vpk pack below now reads from the signed output.
      - name: Upload Lite (Velopack) for signing
        if: github.event_name == 'release'
        id: upload-lite-velopack
        uses: actions/upload-artifact@v6
        with:
          name: Lite-Velopack-unsigned
          path: publish/Lite-velopack/

      - name: Upload Darling Viewer (Velopack) for signing
        if: github.event_name == 'release'
        id: upload-darlingviewer-velopack
        uses: actions/upload-artifact@v6
        with:
          name: DarlingViewer-Velopack-unsigned
          path: publish/DarlingViewer-velopack/

      - name: Sign Lite (Velopack)
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'Lite'
          github-artifact-id: '${{ steps.upload-lite-velopack.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/Lite-Velopack'

      # The remote-seat viewer Setup.exe (#1555) is signed with its OWN 'DarlingViewer' artifact
      # configuration — the co-located-zip 'Darling' slug signs a service+viewer\ tree layout, which
      # does not match this self-contained viewer-at-root publish. Like the 'Darling' slug, the
      # 'DarlingViewer' config (which files get signed) lives outside this repo on signpath.io; until
      # Erik creates the slug this step fails the release — the standing #1340 SignPath prerequisite.
      - name: Sign Darling Viewer (Velopack)
        if: github.event_name == 'release'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '7969f8b6-d946-4a74-9bac-a55856d8b8e0'
          project-slug: 'PerformanceMonitor'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'DarlingViewer'
          github-artifact-id: '${{ steps.upload-darlingviewer-velopack.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/DarlingViewer-Velopack'

      - name: Create Velopack releases (Lite + Darling Viewer)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Pin vpk to the Velopack library version (keep in sync with the Velopack
          # PackageReference in PerformanceMonitorLite.csproj).
          dotnet tool install -g vpk --version 1.2.0
          New-Item -ItemType Directory -Force -Path releases/velopack-lite
          New-Item -ItemType Directory -Force -Path releases/velopack-darlingviewer

          # Lite: download previous + pack (from the SIGNED velopack output, not the raw publish dir)
          vpk download github --repoUrl https://github.com/${{ github.repository }} --channel lite -o releases/velopack-lite --token $env:GH_TOKEN
          vpk pack -u PerformanceMonitorLite -v $env:VERSION -p signed/Lite-Velopack -e PerformanceMonitorLite.exe -o releases/velopack-lite --channel lite

          # Darling Viewer remote-seat installer (#1555): download previous + pack (from the SIGNED
          # velopack output). Its own 'darlingviewer' channel/delta feed, separate from the co-located
          # viewer inside PerformanceMonitorDarling-*.zip (which stays plain-zip only).
          vpk download github --repoUrl https://github.com/${{ github.repository }} --channel darlingviewer -o releases/velopack-darlingviewer --token $env:GH_TOKEN
          vpk pack -u PerformanceMonitorDarlingViewer -v $env:VERSION -p signed/DarlingViewer-Velopack -e PerformanceMonitor.Darling.Viewer.exe -o releases/velopack-darlingviewer --channel darlingviewer

      - name: Generate checksums
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $checksums = Get-ChildItem releases/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF and no BOM, written explicitly (#2383). Out-File on Windows emits CRLF whatever
          # the encoding, and `shasum -c` on macOS/Linux then takes the trailing \r as part of
          # the FILENAME - every entry reports "No such file or directory / FAILED open or
          # read", which is precisely what a tampered download looks like. The hashes were
          # always right; the file just could not be used by the tool it exists for, on the two
          # platforms where that tool is the default. A BOM breaks the first line the same way.
          #
          # There is a SECOND copy of this step in nightly.yml. #2384 fixed only this one, and the
          # nightly went on publishing CRLF for another day; keep them in step.
          [IO.File]::WriteAllText(
            "$PWD/releases/SHA256SUMS.txt",
            (($checksums -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false))
          Write-Host "Checksums:"
          $checksums | ForEach-Object { Write-Host $_ }

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} releases/*.zip releases/SHA256SUMS.txt --clobber

      - name: Upload Lite Velopack artifacts
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel lite -o releases/velopack-lite --releaseName "v$env:VERSION" --tag "v$env:VERSION" --merge --token $env:GH_TOKEN

      - name: Upload Darling Viewer Velopack artifacts
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel darlingviewer -o releases/velopack-darlingviewer --releaseName "v$env:VERSION" --tag "v$env:VERSION" --merge --token $env:GH_TOKEN

  # #1587: gated-live Darling coverage BEFORE merge, not only in the nightly. Darling.Tests has
  # live-PostgreSQL tests (the *_AgainstDevPostgres classes) gated on DARLING_TEST_PG, which the
  # build job above never sets — so those tests only ever ran post-merge in nightly.yml. That is
  # exactly how #1586's alter_job(bigint) bug merged AND deployed clean: the test that catches it is
  # gated-live, and PR CI did not run it. This job stands up a throwaway PostgreSQL + TimescaleDB
  # from the bundled pg-runtime and runs the FULL Darling suite against it — but ONLY when Darling
  # code (or this workflow) changed, so a Lite/Dashboard-only PR pays nothing. On a non-Darling
  # change every step below no-ops via the path filter and the job still reports SUCCESS, so it can
  # be made a required check without blocking unrelated PRs (the same always-runs-reports-a-result
  # shape the build job uses for doc-only changes). Mirrors the nightly darling-pg job step-for-step;
  # the one live-SQL-Server E2E stays skipped (DARLING_TEST_SQL unset — no SQL Server on the runner).
  darling-pg:
    name: Darling PostgreSQL tests
    runs-on: windows-latest
    # Max observed on a warm cache is ~3m40s; a cold pg-runtime cache adds a ~340MB fetch.
    # 30 minutes is 3x headroom over the cold path — past that, something is hung (pg_ctl -w
    # waiting on a cluster that will never come up), and the default 6h timeout would hold a
    # shared-pool Windows runner hostage for the duration. The build job above deliberately
    # has NO timeout: on release it waits on SignPath's manual approval gate, which can
    # legitimately take hours.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Only do the expensive TimescaleDB work when Darling code changed — or when THIS workflow
      # changed, so a change to the gate itself is exercised by the gate (this is what makes the PR
      # that introduces this job validate itself end-to-end). Doc-only Darling edits don't trigger
      # it. Skipped entirely on release: the dev push that produced the release commit already ran
      # it, so the filter step doesn't run and every step below no-ops.
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        with:
          # On push, compare against the previous commit on this branch (mirrors the build job);
          # on pull_request, an empty base makes the action diff against the PR base branch.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          # `Darling/**/!(*.md)` instead of a `Darling/**` include plus a `!Darling/**/*.md`
          # exclude: dorny v4 treats each pattern as an independent predicate under the
          # default quantifier, so the old bare negation was itself a match-all-non-Darling-md
          # rule — this job ran the full TimescaleDB suite on every PR, including md-only
          # ones (run 30218459544: "Filter darling = true, Matching files: CHANGELOG.md").
          filters: |
            darling:
              - 'Darling/**/!(*.md)'
              - '.github/workflows/build.yml'
              # Same reason as the build job's darling filter: the #1888 cluster-sizing
              # guard parses nightly.yml, so an edit to it has to reach the suite.
              - '.github/workflows/nightly.yml'

      # This job's gate was already correct for documentation — a docs-only change leaves
      # 'darling' false and every step below no-ops. What it lacked was SAYING so: a job
      # that reports success having quietly run nothing looks identical to one that tested
      # everything. Costs one step; buys a log you can point at when asking "did this
      # actually get tested?".
      - name: Report the Darling PG gate decision
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "::notice title=Darling PG tests skipped::Release event - the dev push that produced this commit already ran them."
          elif [ "${{ steps.filter.outputs.darling }}" = "true" ]; then
            echo "::notice title=Darling PG tests running::Darling code (or this workflow) changed."
          else
            echo "::notice title=Darling PG tests skipped::No Darling code changed - documentation-only Darling edits do not trigger the TimescaleDB suite."
          fi

      - name: Setup .NET 10.0
        if: steps.filter.outputs.darling == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Same cache key the release job and nightly.yml use (the fetch script's own content hash), so
      # a warm cache from any of the three means no ~340MB EDB/TimescaleDB download here.
      - name: Cache Darling pg-runtime.zip
        if: steps.filter.outputs.darling == 'true'
        id: cache-pg-runtime
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip (cache miss only)
        if: steps.filter.outputs.darling == 'true' && steps.cache-pg-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Extract pg-runtime
        if: steps.filter.outputs.darling == 'true'
        shell: pwsh
        run: |
          $zip  = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime.zip"
          $dest = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          if (-not (Test-Path "$dest\pgsql\bin\pg_ctl.exe")) { throw "pg-runtime missing pgsql\bin\pg_ctl.exe" }

      - name: Restore Darling.Tests
        if: steps.filter.outputs.darling == 'true'
        run: dotnet restore Darling/Darling.Tests/Darling.Tests.csproj --locked-mode

      - name: Build Darling.Tests
        if: steps.filter.outputs.darling == 'true'
        run: dotnet build Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-restore

      # Throwaway cluster from the bundled runtime. initdb TRUST auth is acceptable ONLY here: an
      # ephemeral CI runner, loopback-only, throwaway data (the product default is scram-sha-256 +
      # a generated credential). Superuser is "darling" (not "postgres") so CREATE SCHEMA ...
      # AUTHORIZATION darling in the V8 schema-split migration resolves. Settings mirror
      # DarlingManagedPostgres.BuildConfAppend (timescaledb preload, port 5541, loopback bind)
      # and BuildWorkerSizingConfAppend (the two worker settings below).
      #
      # #1888: the worker settings are NOT optional garnish. PostgreSQL's default
      # max_worker_processes = 8 cannot launch TimescaleDB's per-hypertable compression,
      # retention and continuous-aggregate policy jobs — the postmaster logs "failed to start a
      # background worker" storms and most policy runs never happen. Without them this job tested a
      # configuration NO customer runs (the product refuses to: BuildWorkerSizingConfAppend writes
      # these on every managed start), and worse, made failures luck-of-the-slot rather than
      # reproducible — which is exactly how #1862's compression flake failed twice on CI in two
      # unrecognizably different ways and could not be reproduced locally at all.
      #
      # The values are the product's own derivation from the live hypertable count
      # (TimescaleSupport.HypertableCount = the 62-collector catalog + collection_log = 63):
      #   timescaledb.max_background_workers = HypertableCount + 2       = 67
      #   max_worker_processes = 3 + (HypertableCount + 2) + 8           = 78
      # Hard-coded here because a workflow cannot call into the product — so
      # CiClusterWorkerSizingTests parses THIS FILE and fails the build if either number stops
      # matching the formula as collectors are added, and CiClusterWorkerSizingLiveTests asserts
      # the running cluster actually serves them (a conf line that never took effect is
      # indistinguishable from one that did, by inspection).
      - name: Initialize and start throwaway PostgreSQL
        if: steps.filter.outputs.darling == 'true'
        shell: pwsh
        run: |
          $bin     = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          $dataDir = "$env:RUNNER_TEMP\darling-pgdata"
          $logFile = "$env:RUNNER_TEMP\darling-pg.log"
          & "$bin\initdb.exe" -D $dataDir -U darling -A trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw "initdb failed ($LASTEXITCODE)" }
          Add-Content -Path "$dataDir\postgresql.conf" -Value "shared_preload_libraries = 'timescaledb'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "port = 5541"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "listen_addresses = '127.0.0.1'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "timescaledb.max_background_workers = 67"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "max_worker_processes = 78"
          & "$bin\pg_ctl.exe" -D $dataDir -l $logFile -w start
          if ($LASTEXITCODE -ne 0) { if (Test-Path $logFile) { Get-Content $logFile -Tail 50 }; throw "pg_ctl start failed ($LASTEXITCODE)" }
          & "$bin\createdb.exe" -h 127.0.0.1 -p 5541 -U darling darling
          if ($LASTEXITCODE -ne 0) { throw "createdb failed ($LASTEXITCODE)" }

      # DARLING_TEST_PG lights up the [Collection("live-postgres")] classes; DARLING_TEST_PGRUNTIME
      # lights up the managed-bootstrap E2E. DARLING_TEST_SQL is intentionally unset — the one
      # live-SQL-Server E2E stays skipped (no SQL Server on the runner). Full suite (not a filtered
      # subset): the ungated ~3s overlap with the build job is negligible and a filter could hide a
      # test the way narrow filters have bitten before.
      - name: Run Darling PG tests
        if: steps.filter.outputs.darling == 'true'
        shell: pwsh
        env:
          DARLING_TEST_PG: "Host=127.0.0.1;Port=5541;Username=darling;Database=darling"
          DARLING_TEST_PGRUNTIME: ${{ github.workspace }}\Darling\artifacts\pg-runtime
        run: dotnet run --project Darling/Darling.Tests/Darling.Tests.csproj -c Release --no-build -- -trx TestResults/darling-pr.trx

      - name: Stop PostgreSQL
        if: always() && steps.filter.outputs.darling == 'true'
        shell: pwsh
        run: |
          $bin     = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          $dataDir = "$env:RUNNER_TEMP\darling-pgdata"
          if (Test-Path "$bin\pg_ctl.exe") { & "$bin\pg_ctl.exe" -D $dataDir -m fast -w stop }
          exit 0

      - name: Upload PG log and test results on failure
        if: failure() && steps.filter.outputs.darling == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: darling-pg-failure
          path: |
            ${{ runner.temp }}/darling-pg.log
            TestResults/
          if-no-files-found: ignore

  # ── Linux service build + container image (#1804) ────────────────────────────────────────────────
  # The Darling service is cross-platform .NET on purpose, but until this job nothing PROVED it on
  # every PR — the linux-x64 publish and the container image both built for the first time at release
  # time or never. Same path-filter shape as darling-pg above: only runs the expensive work when
  # Darling/service code (or this workflow, or the Dockerfile) changed, always reports a result so it
  # can be a required check. No tests run here — the test projects are net10.0-windows (they reference
  # the WPF apps); the cross-platform behavior they pin is exercised by the Windows jobs, and the
  # container smoke lives in the compose quickstart. On PRs/pushes this job answers exactly two
  # questions: does the service still publish for linux-x64, and does the image still build.
  #
  # On the RELEASE event this job is the Linux PUBLISHER: before it, a stable release shipped Windows
  # zips and Setup.exes while the linux tar.gz and the ghcr image existed only at nightly quality
  # (nightly.yml, tag :nightly) — the compose quickstart pointed released users at a nightly image.
  # Now the release uploads PerformanceMonitorDarling-linux-x64-<v>.tar.gz + SHA256SUMS-linux.txt to
  # the release and pushes ghcr :<version> and :latest. Linux binaries are NOT SignPath-signed
  # (SignPath signs Windows PEs); the checksums file is the integrity story, same as the nightly.
  darling-linux:
    name: Darling Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Sigstore keyless signing + GitHub provenance (proven on the nightly first): id-token yields
      # the OIDC identity Fulcio certifies against; attestations stores the tarball's provenance.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            darling:
              - 'Darling/**/!(*.md)'
              - 'PerformanceMonitor.Common/**'
              - 'PerformanceMonitor.Collectors/**'
              - 'PerformanceMonitor.Analysis/**'
              - '.github/workflows/build.yml'

      - name: Report the Linux gate decision
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "::notice title=Darling Linux publishing::Release event - packaging the versioned linux tar.gz and pushing the ghcr image."
          elif [ "${{ steps.filter.outputs.darling }}" = "true" ]; then
            echo "::notice title=Darling Linux build running::Darling/service code (or this workflow) changed."
          else
            echo "::notice title=Darling Linux build skipped::No Darling/service code changed."
          fi

      - name: Setup .NET 10.0
        if: github.event_name == 'release' || steps.filter.outputs.darling == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish service (linux-x64)
        if: github.event_name == 'release' || steps.filter.outputs.darling == 'true'
        run: dotnet publish Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj -c Release -r linux-x64 --self-contained false -o publish/DarlingService-linux

      - name: Build container image
        if: github.event_name != 'release' && steps.filter.outputs.darling == 'true'
        run: docker build -f Darling/Dockerfile -t performancemonitor-darling:pr .

      # ── Release-only publishing (mirrors nightly.yml's linux job, versioned instead of :nightly) ──

      - name: Get version
        if: github.event_name == 'release'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Lite/PerformanceMonitorLite.csproj)"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Package linux artifact + checksum
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          mkdir -p releases
          tar -C publish/DarlingService-linux -czf "releases/PerformanceMonitorDarling-linux-x64-${version}.tar.gz" .
          (cd releases && sha256sum "PerformanceMonitorDarling-linux-x64-${version}.tar.gz" > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      - name: Upload linux artifact to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} releases/PerformanceMonitorDarling-linux-x64-*.tar.gz releases/SHA256SUMS-linux.txt --clobber

      - name: Build and push container image (ghcr, versioned + latest)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          image="ghcr.io/${{ github.repository_owner }}/performancemonitor-darling"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f Darling/Dockerfile -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"

      # Keyless Sigstore signature on the released image — the same steps the nightly runs (verified
      # end-to-end from a client 2026-08-06: cosign validated the claims, the Rekor log entry, and the
      # workflow identity). SignPath's cosign support is edition-gated, and this path needs no keys or
      # subscription at all. Verify:
      #   cosign verify ghcr.io/erikdarlingdata/performancemonitor-darling:<version> \
      #     --certificate-identity-regexp 'github.com/erikdarlingdata/PerformanceMonitor' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless, Sigstore)
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          image="ghcr.io/${{ github.repository_owner }}/performancemonitor-darling"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${version}")"
          cosign sign --yes "${digest}"

      # GitHub-native SLSA provenance for the released tarball: gh attestation verify <file> -R <repo>.
      - name: Attest the linux tarball (GitHub provenance)
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: releases/PerformanceMonitorDarling-linux-x64-*.tar.gz
