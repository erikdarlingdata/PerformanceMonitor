name: WPF smoke

# #5745: starts the real apps and checks the named controls show data, with FlaUI over UI Automation (tools/ui-smoke-wpf).
#   * Lite, on a seeded data folder.
#   * The Darling viewer, on a throwaway PostgreSQL store: the Darling service runs once to migrate it, tools/ui-smoke/seed.sql
#     (the same seed the web UI smoke uses; SQL Server target ui-sql) fills it, and the viewer reads it through DARLING_CONFIG.
# Each walk checks the same four things: the server picker lists the seeded server, the Overview card's server-name text reads
# its display name, the Wait Stats type list has items, and the Top Queries grid has rows. A screenshot of the runner's desktop
# is taken before anything of ours runs (the probe: proof that the runner gives an interactive desktop), and again when each
# app's main window shows, after each walk, and on any failure. No screenshots are compared.
#
# Triggers: the nightly (workflow_call) and a manual dispatch. It no longer runs on pull requests (#6656): the pull request
# workflow (pr.yml) is the one per-PR CI system, so this smoke is a nightly and on-demand check.
#
# History (#6492): it was built to be a required check on pull requests, with no `paths:` filter, because a workflow its path
# filter skips never reports, and a required check that never reports blocks the merge. The jobs keep that shape, and on the
# two events left every `if` below takes its non-pull-request branch:
#   * `changes` works out, on every event, whether the smoke is needed: a non-draft pull request that changes Lite, the Darling
#     viewer or its storage, the harness, the seed or this workflow (the list the old filter held), or any event that is not a
#     pull request (the nightly, a dispatch). A draft pull request is skipped until it is marked ready.
#   * `smoke` runs only when `changes` says so.
#   * `WPF smoke (result)` always runs and is the one check to require: success when the smoke passed or was not needed, failure
#     when the smoke failed, was cancelled, or `changes` itself failed.
on:
  # The nightly runs it as a reusable workflow (nightly.yml, outside publish's needs).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpf-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: WPF smoke (is it needed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.needed.outputs.run }}
    steps:
      # The pull request's merge commit: its first parent is the base branch tip, so `HEAD^1..HEAD` is exactly what the pull
      # request changes. Two commits is all the diff needs. Only a non-draft pull request needs the checkout.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        with:
          fetch-depth: 2

      - name: Work out whether the smoke is needed
        id: needed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request ($EVENT_NAME): the smoke runs."
            exit 0
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Draft pull request: the smoke is skipped until it is marked ready."
            exit 0
          fi
          # The paths the smoke exercises (the list the old `paths:` filter held).
          pattern='^(Lite/|Darling/|tools/ui-smoke-wpf/|tools/ui-smoke/|Lite\.Tests/TestDataSeeder\.cs$|\.github/workflows/wpf-smoke\.yml$)'
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files: $(printf '%s\n' "$files" | grep -c .)"
          matched=$(printf '%s\n' "$files" | grep -E "$pattern" || true)
          if [ -n "$matched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The pull request changes smoke paths, the smoke runs. First matches:"
            printf '%s\n' "$matched" | head -5
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The pull request changes none of the smoke paths: the smoke is not needed."
          fi

  smoke:
    name: WPF smoke (Lite and the Darling viewer)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    # Expected 4 to 6 minutes warm (restore and builds of Lite, the service and the viewer 3, PostgreSQL and the store migration 1,
    # the two walks under 1); 3 more on a cold pg-runtime cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The desktop probe: a screenshot of the runner's primary screen before anything of ours is running.
      - name: Desktop probe
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\wpf-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "virtual screen: $($b.Width)x$($b.Height); user interactive: $([Environment]::UserInteractive)"
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$out\desktop-probe.png")

      # The exact SDK version from global.json, not its feature band. Given a band, setup-dotnet resolves the newest
      # patch through aka.ms links, and on 2026-10-25 those links sent every run to a download that failed with HTTP 409.
      # With an exact version the install script downloads from the release feed and never asks aka.ms.
      - name: Read the SDK version from global.json
        id: globaljson_sdk
        shell: pwsh
        run: |
          $version = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'global.json') | ConvertFrom-Json).sdk.version
          if (-not $version) { throw 'global.json names no sdk.version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.globaljson_sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore the harness, the service and the viewer (locked)
        shell: pwsh
        run: |
          dotnet restore tools/ui-smoke-wpf/UiSmokeWpf.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "restore of the harness failed ($LASTEXITCODE)" }
          dotnet restore Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "restore of the service failed ($LASTEXITCODE)" }
          dotnet restore Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "restore of the viewer failed ($LASTEXITCODE)" }

      - name: Build the harness and Lite
        shell: pwsh
        run: dotnet build tools/ui-smoke-wpf/UiSmokeWpf.csproj -c Release --no-restore --nologo -v q

      - name: Build the service and the viewer
        shell: pwsh
        run: |
          dotnet build Darling/PerformanceMonitor.Darling.Service/PerformanceMonitor.Darling.Service.csproj -c Release --no-restore --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "build of the service failed ($LASTEXITCODE)" }
          dotnet build Darling/PerformanceMonitor.Darling.Viewer/PerformanceMonitor.Darling.Viewer.csproj -c Release --no-restore --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "build of the viewer failed ($LASTEXITCODE)" }

      - name: Run the Lite walk
        shell: pwsh
        env:
          UI_SMOKE_OUT: ${{ runner.temp }}\wpf-smoke\lite
        run: |
          & "tools/ui-smoke-wpf/bin/Release/net10.0-windows/UiSmokeWpf.exe" -class UiSmokeWpf.LiteWalkTests
          if ($LASTEXITCODE -ne 0) { throw "the Lite walk failed ($LASTEXITCODE); screenshots are in the wpf-smoke artifact" }

      # The viewer's store. Same cache key build.yml, the nightly, the release and darling-ui-smoke.yml use (the fetch script's
      # own content hash), so a warm cache from any of them means no ~340MB download here.
      - name: Cache Darling pg-runtime.zip
        id: cache-pg-runtime
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: Darling/artifacts/pg-runtime.zip
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('Darling/tools/fetch-pg-runtime.ps1') }}

      - name: Build Darling pg-runtime.zip (cache miss only)
        if: ${{ !cancelled() && steps.cache-pg-runtime.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: ./Darling/tools/fetch-pg-runtime.ps1

      - name: Extract pg-runtime
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $zip  = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime.zip"
          $dest = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          if (-not (Test-Path "$dest\pgsql\bin\pg_ctl.exe")) { throw "pg-runtime missing pgsql\bin\pg_ctl.exe" }

      # One throwaway store on 5541, the cluster build.yml's darling-pg job starts (worker numbers pinned by
      # CiClusterWorkerSizingTests there; copied here exactly).
      - name: Initialize and start throwaway PostgreSQL
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bin     = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          $dataDir = "$env:RUNNER_TEMP\darling-pgdata"
          $logFile = "$env:RUNNER_TEMP\darling-pg.log"
          & "$bin\initdb.exe" -D $dataDir -U darling -A trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw "initdb failed ($LASTEXITCODE)" }
          Add-Content -Path "$dataDir\postgresql.conf" -Value "shared_preload_libraries = 'timescaledb,pg_stat_statements'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "port = 5541"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "listen_addresses = '127.0.0.1'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "timescaledb.max_background_workers = 74"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "max_worker_processes = 85"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "timezone = 'UTC'"
          Add-Content -Path "$dataDir\postgresql.conf" -Value "log_timezone = 'UTC'"
          & "$bin\pg_ctl.exe" -D $dataDir -l $logFile -w start
          if ($LASTEXITCODE -ne 0) { if (Test-Path $logFile) { Get-Content $logFile -Tail 50 }; throw "pg_ctl start failed ($LASTEXITCODE)" }
          & "$bin\createdb.exe" -h 127.0.0.1 -p 5541 -U darling darling
          if ($LASTEXITCODE -ne 0) { throw "createdb failed ($LASTEXITCODE)" }

      # The Darling service runs once, only to migrate the store and register ui-sql; run-ui-smoke.ps1 then applies seed.sql and
      # stops it (the viewer reads the store directly and needs no service).
      - name: Migrate and seed the store
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          ./tools/ui-smoke/run-ui-smoke.ps1 -PgBin "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin" -PgPort 5541 -WorkDir "$env:RUNNER_TEMP\ui-smoke" -NoBuild -SeedOnly

      - name: Run the viewer walk
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          UI_SMOKE_OUT: ${{ runner.temp }}\wpf-smoke\viewer
          DARLING_CONFIG: ${{ runner.temp }}\ui-smoke\cfg\darling.json
          VIEWER_EXE: ${{ github.workspace }}\Darling\PerformanceMonitor.Darling.Viewer\bin\Release\net10.0-windows\PerformanceMonitor.Darling.Viewer.exe
        run: |
          & "tools/ui-smoke-wpf/bin/Release/net10.0-windows/UiSmokeWpf.exe" -class UiSmokeWpf.ViewerWalkTests
          if ($LASTEXITCODE -ne 0) { throw "the viewer walk failed ($LASTEXITCODE); screenshots are in the wpf-smoke artifact" }

      - name: Lite log tail
        if: always()
        shell: pwsh
        run: |
          $d = "$env:LOCALAPPDATA\PerformanceMonitorLite-Data"
          if (Test-Path $d) {
            Get-ChildItem -Path $d -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { "== $($_.FullName) (last 40 lines)"; Get-Content $_.FullName -Tail 40 }
          }

      - name: Logs tail
        if: always()
        shell: pwsh
        run: |
          foreach ($f in 'service.out.log', 'service.err.log') {
            $p = "$env:RUNNER_TEMP\ui-smoke\$f"
            if (Test-Path $p) { "== $f (last 40 lines)"; Get-Content $p -Tail 40 }
          }
          if (Test-Path "$env:RUNNER_TEMP\darling-pg.log") { "== PostgreSQL log (last 20 lines)"; Get-Content "$env:RUNNER_TEMP\darling-pg.log" -Tail 20 }
          foreach ($v in "$env:APPDATA\PerformanceMonitor.Darling.Viewer", "$env:LOCALAPPDATA\PerformanceMonitor.Darling.Viewer") {
            if (Test-Path $v) {
              Get-ChildItem -Path $v -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { "== $($_.FullName) (last 40 lines)"; Get-Content $_.FullName -Tail 40 }
            }
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wpf-smoke
          path: ${{ runner.temp }}\wpf-smoke
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop throwaway PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\Darling\artifacts\pg-runtime\pgsql\bin"
          if (Test-Path "$bin\pg_ctl.exe") { & "$bin\pg_ctl.exe" -D "$env:RUNNER_TEMP\darling-pgdata" -m fast stop }

  # The one check to require. Always runs, so a pull request the smoke does not apply to (no smoke paths changed, or a draft)
  # still reports success; a failed, cancelled or never-started smoke reports failure.
  result:
    name: WPF smoke (result)
    needs: [changes, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_NEEDED: ${{ needs.changes.outputs.run }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          echo "changes: $CHANGES_RESULT (smoke needed: ${RUN_NEEDED:-unknown}); smoke: $SMOKE_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Could not work out whether the smoke is needed ($CHANGES_RESULT)."
            exit 1
          fi
          if [ "$RUN_NEEDED" != "true" ]; then
            echo "The smoke was not needed (no smoke paths changed, or a draft pull request): success."
            exit 0
          fi
          if [ "$SMOKE_RESULT" = "success" ]; then
            echo "The smoke passed."
            exit 0
          fi
          echo "::error::The WPF smoke did not pass ($SMOKE_RESULT)."
          exit 1
