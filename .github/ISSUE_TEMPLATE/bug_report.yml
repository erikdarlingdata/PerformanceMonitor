name: Bug Report
description: Report a problem with Performance Monitor
title: "[BUG] "
labels: ["bug"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Performance Monitor is affected?
      options:
        - Lite
        - Darling
        - Full Dashboard (deprecated)
        - Installer (deprecated)
        - SQL collection scripts
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Performance Monitor Version
      description: Check the About dialog or the release you downloaded.
      placeholder: "e.g., 1.2.0"
    validations:
      required: true

  - type: input
    id: sql-version
    attributes:
      label: SQL Server Version
      description: "Run SELECT @@VERSION on the target server."
      placeholder: "e.g., SQL Server 2019 CU25"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: The OS where the Lite, Darling, or Dashboard app is running.
      placeholder: "e.g., Windows 11 23H2, Windows Server 2022"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the app
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Error Messages / Log Output
      description: Paste any error messages or relevant log entries. Dashboard logs are in %LOCALAPPDATA%\PerformanceMonitor\Logs\; Lite logs are in %LOCALAPPDATA%\PerformanceMonitorLite-Data\logs\ (on versions before the data-root move, %LOCALAPPDATA%\PerformanceMonitorLite\logs\); Darling logs are in %ProgramData%\PerformanceMonitorDarling\logs\.
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics-bundle
    attributes:
      label: Diagnostics bundle (Darling)
      description: |
        Run `PerformanceMonitor.Darling.Service.exe --diagnostics-bundle darling-bundle.json` from an elevated prompt in the service folder (Windows). On Linux, run `./PerformanceMonitor.Darling.Service --diagnostics-bundle darling-bundle.json`; for compose, run it with `docker compose exec` and copy the file out with `docker compose cp`.
        Drag the file here (rename it to .txt if GitHub refuses .json). Host, server and database names in it are replaced with aliases, and secrets are removed. Open it and check it before you attach it.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: |
        Anything else that might help:
        - Did this work before? If so, what changed?
        - Is SQL Server Agent running? (deprecated Full Dashboard edition only)
        - Are you monitoring Azure SQL DB, Azure MI, or AWS RDS?
    validations:
      required: false
